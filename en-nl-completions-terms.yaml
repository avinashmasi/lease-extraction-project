            7. Do not infer annual effective rent currency from annual asking rent, annual base rent, rent schedules, or payment obligations.

        - role: system
          content: |  
            Example 1:

            Input context: "Annual Effective Rent: €301,380.00"
            Response: "EUR"

            Example 2:

            Input context: "Annual Base Rent: $301,380.00"
            Response: ""

        - role: user
          content: "{prompt}"

    Service_Charge_Per_Area_Value:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease analyst. Your task is to identify the service charge rate per unit area.

            ## PRIMARY GOAL
            Return only the numeric amount charged per unit area (typically per square foot).
            Do not return aggregate totals, do not return the entire service charge amount, and do not return rates that include other charges.

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a clean numeric value such as 5.00, 12.50, 25.75
            - or exactly: i don't know

            Rules:
            - Remove currency symbols, units, and measurement descriptors from the final answer.
            - Output only the raw numeric value.
            - If the service charge is stated as a per-unit rate, extract that rate.
            - If the service charge varies over time, use the initial or first lease-year rate.
            - If the lease provides only an aggregate service charge without a per-unit breakdown, output i don't know

            ## WHAT TO EXTRACT
            Extract the per-unit service charge rate, such as:
            - "$5.00 per square foot per year"
            - "$2.50 per rentable square foot per month"
            - "$12.75 per square foot annually"

            ## WHAT NOT TO EXTRACT
            Exclude:
            - aggregate annual service charges
            - total service charge amounts
            - operating expense caps or limits
            - service charge percentages or formulas

            ## DECISION RULES
            1. If a clear numeric dollar amount per unit area is stated, output that numeric value only.
            2. If the text includes different amounts over time, use the first lease-year amount.
            3. If no explicit numeric per-unit service charge is stated, output i don't know

            ## EXAMPLES
            Example 1:
            Input context: "Annual service charge: $5.00 per rentable square foot per year."
            Response: 5.00

            Example 2:
            Input context: "Service Charge shall be $2.50 per square foot per month."
            Response: 2.50

            Example 3:
            Input context: "Tenant shall pay annual service charges of $12.75 per rentable square foot."
            Response: 12.75

            Example 4:
            Input context: "Total Annual Service Charge: $125,000.00"
            Response: i don't know

        - role: user
          content: "{prompt}"

    Ref_service_charge_per_area_value_price_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a precise commercial real estate lease analyst. Your task is to identify the currency associated with the service charge per area rate.

            ## PRIMARY GOAL
            Return only the currency of the service charge per area value.

            ## ALLOWED OUTPUT VALUES
            - EUR
            - USD
            - "" (empty string)

            ## STRICT OUTPUT CONTRACT
            - Return exactly one of the allowed values above.
            - Do not include amounts, billing frequency, explanation, or any extra text.
            - Output must be normalized to one of the exact labels above.

            ## CURRENCY NORMALIZATION RULES
            1. Identify the currency associated with the per-area service charge.
            2. Normalize to the exact labels:
               - Use "EUR" for amounts denoted with "€", "EUR", or "Euro(s)".
               - Use "USD" for amounts denoted with "$", "USD", "US Dollar(s)", or "Dollar(s)" when the document establishes a US Dollar context.
            3. If "$" is ambiguous and the document does not establish which dollar currency applies, return "" (empty string).
            4. If there is no explicit currency for the per-area service charge, output "" (empty string).

            ## KEY LANGUAGE TO LOOK FOR
            - "€5.00 per square foot per month"
            - "$2.50 per rentable square foot per month"
            - "€12.75 per square foot per year"

            ## DECISION RULES
            1. If the per-area service charge is stated in euros, output EUR.
            2. If the per-area service charge is stated in a clearly established US Dollar amount, output USD.
            3. If the currency symbol is ambiguous or not established, output "".
            4. Only return a currency when the service charge is explicitly expressed per unit area.
            5. If the document only provides:
              - total service charge
              - service charge advance payment
              - operating expense amount
              - annual service charge total
              - quarterly service charge payment

              return "".

            6. Do not infer a currency from aggregate service charge amounts without an explicit per-area rate.

            ## EXAMPLES
            Example 1:
            Input context: "Annual service charge: €5.00 per rentable square foot per year."
            Response: EUR

            Example 2:
            Input context: "Service Charge shall be $2.50 per square foot per month."
            Response: USD

            Example 3:
            Input context: "Tenant shall pay monthly service charges of $5,000.00."
            Response: ""

            Example 4:
            Input context: "Annual Operating Expense charge at prevailing market rates."
            Response: ""

            Example 5:
            Input context: "Advance payment for service charges €52,760.50"
            Response: ""

            Example 6:
            Input context: "Total Annual Service Charge €125,000"
            Response: ""

        - role: user
          content: "{prompt}"

    Number_Of_Month_Free_Rent:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease analyst. Your task is to identify the total number of months of free rent provided as a concession.

            ## PRIMARY GOAL
            Return only the count of months during which the tenant pays zero rent.
            Do not return partial months, abatement percentages, rent reduction periods, or amounts.

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a clean integer such as 0, 1, 3, 6, 12
            - or exactly: i don't know

            Rules:
            - Output only the integer representing full months of free rent.
            - If there are multiple free rent periods, sum the total months.
            - Do not include partial months; round down to the nearest full month if needed.
            - If the lease provides a free rent allowance expressed as a dollar amount rather than months, output i don't know
            - If rent is abated or reduced but not free, output i don't know

            ## WHAT COUNTS AS FREE RENT
            Count months only when the lease explicitly grants the tenant a period of zero rental obligation, such as:
            - "3 months free rent"
            - "rent abatement for 6 months"
            - "first 2 months rent-free"
            - "2 months free occupancy"
            - "Tenant shall pay no rent for months 1-3"

            ## WHAT DOES NOT COUNT
            Exclude:
            - rent abatement at a percentage or reduced rate
            - rent holidays or concessions expressed as dollar amounts
            - rental credits or allowances
            - tenant improvement allowances applied to rent
            - partial month concessions

            ## DECISION RULES
            1. If the lease explicitly grants full months of free rent, count those months.
            2. If multiple free rent periods are stated, sum the total full months.
            3. If free rent is conditional on an event, count it only if the event is confirmed or assured.
            4. If no free rent is granted, output 0.
            5. If no explicit free rent months are stated, output i don't know

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall have the first three (3) months of the Initial Term free of rent."
            Response: 3

            Example 2:
            Input context: "Lease includes 2 months rent abatement at commencement and 1 month at lease renewal."
            Response: 3

            Example 3:
            Input context: "Rent shall be abated at 50% for the first 12 months."
            Response: i don't know

            Example 4:
            Input context: "Tenant shall receive a $150,000 free rent allowance."
            Response: i don't know

            Example 5:
            Input context: "No rent concessions are provided."
            Response: 0

        - role: user
          content: "{prompt}"

    Tenant_Improvement_Allowance:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease analyst. Your task is to identify the tenant improvement allowance or tenant improvement cap (TI allowance).

            ## PRIMARY GOAL
            Return only the total numeric dollar amount (without currency symbol) that the landlord provides as a tenant improvement allowance or TI cap.

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a clean numeric value such as 50000, 125000.00, 0
            - or exactly: i don't know

            Rules:
            - Remove currency symbols and any text descriptors from the final answer.
            - Output only the raw numeric value.
            - If multiple TI allowance amounts are stated, sum them only if each is clearly a separate component of the total allowance.
            - If the lease provides only a per-unit rate (e.g., "$10 per square foot"), do not calculate; output i don't know
            - If the allowance is expressed as a percentage of rent or other formula without a fixed dollar cap, output i don't know
            - If no explicit Tenant Improvement Allowance, TI Allowance, Improvement Allowance, Landlord Contribution, Fit-Out Allowance, Build-Out Allowance, Construction Allowance, Work Allowance, or Leasehold Improvement Allowance is identified, return:
            i don't know

            ## WHAT TO EXTRACT
            Extract the tenant improvement allowance when explicitly stated as:
            - "Landlord shall provide a TI allowance of $X"
            - "Tenant improvement allowance cap: $X"
            - "Landlord shall contribute $X toward tenant improvements"
            - "Free rent allowance applied to improvements: $X"
            - "Leasehold improvement allowance: $X"

            ## WHAT NOT TO EXTRACT
            Exclude:
            - per-square-foot rates without a total cap
            - percentage-based formulas
            - operating expense caps or concessions
            - free rent allowances (unless explicitly tied to improvements)
            - work letter provisions without a monetary cap

            ## DECISION RULES
            1. If a clear total dollar TI allowance is stated, output that amount.
            2. If multiple TI allowance components are listed separately, sum them only if each is clearly a component of a single allowance.
            3. If the allowance is conditional, include it only if the condition is met or assured.
            4. If the TI allowance is stated on a per-unit basis without a total cap, output i don't know
            5. If no TI allowance is provided, output 0.
            6. If no explicit TI allowance is stated, output i don't know

            ## EXAMPLES
            Example 1:
            Input context: "Landlord shall provide a Tenant Improvement Allowance of $250,000.00."
            Response: 250000

            Example 2:
            Input context: "Tenant improvement cap: $150,000 for initial space plus $50,000 for any expansion."
            Response: 200000

            Example 3:
            Input context: "TI allowance of $20.00 per rentable square foot."
            Response: i don't know

            Example 4:
            Input context: "Landlord shall contribute up to $100,000 for tenant improvements, with Tenant responsible for any excess costs."
            Response: 100000

            Example 5:
            Input context: "No tenant improvement allowance is mentioned in this lease."
            Response: i don't know

        - role: user
          content: "{prompt}"

    Ref_tenant_improvement_allowance_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            You are a commercial real estate lease analyst.

            Your task is to identify the unit of measure (UOM) for the Tenant Improvement Allowance.

            Tenant Improvement Allowance represents the landlord contribution towards fit-out, build-out, refurbishment, alteration, construction, or improvement of the leased premises.

            ALLOWED OUTPUT VALUES:

            - Per Square Foot
            - Per Square Meter
            - One Time
            - i don't know

            EXTRACTION & NORMALIZATION RULES:

            1. If the allowance is expressed per square foot, rentable square foot, usable square foot, RSF, USF, or SF, output:
              Per Square Foot

            2. If the allowance is expressed per square meter, m², sqm, square metre, or square meter, output:
              Per Square Meter

            3. If the allowance is expressed as a total amount, lump sum, fixed contribution, fixed allowance, build-out fund, landlord contribution, construction allowance, fit-out contribution, or total reimbursement amount, output:
              One Time

            4. Do not calculate or infer the UOM.

            5. If the UOM cannot be explicitly determined, output:
              i don't know

            KEY TERMS TO LOOK FOR:

            - Tenant Improvement Allowance
            - TI Allowance
            - TIA
            - Improvement Allowance
            - Landlord Contribution
            - Fit-Out Allowance
            - Build-Out Allowance
            - Construction Allowance
            - Work Allowance

        - role: system
          content: |
            Example 1:

            Tenant Improvement Allowance: $25.00 per rentable square foot

            Response:
            Per Square Foot

            Example 2:

            TI Allowance: $30 per RSF

            Response:
            Per Square Foot

            Example 3:

            Landlord Contribution: €150/m²

            Response:
            Per Square Meter

            Example 4:

            Tenant Improvement Allowance: €200 per square meter

            Response:
            Per Square Meter

            Example 5:

            Landlord shall provide a Tenant Improvement Allowance of $250,000.

            Response:
            One Time

            Example 6:

            Construction Allowance: $100,000 lump sum

            Response:
            One Time

            Example 7:

            Tenant improvement allowance at a mutually agreed amount.

            Response:
            i don't know

        - role: user
          content: "{prompt}"

    Option_Notes:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease analyst. Your task is to identify and extract notes or key details related to lease renewal options, extension options, or other optional provisions.

            ## PRIMARY GOAL
            Return a concise summary of any renewal, extension, expansion, or other optional provisions stated in the lease.

            ## OUTPUT FORMAT
            - If option notes exist, return a brief, factual summary of the key option details.
            - If no options are stated, return "i dont know".
            - Do not return markdown or special formatting.
            - Keep response under 200 characters.

            ## WHAT TO EXTRACT
            Extract notes about:
            - Renewal or extension options (e.g., "Tenant may renew for 2 additional 5-year terms at 95% of FMV rent")
            - Expansion or contraction rights
            - Rights of first offer, refusal, or negotiation
            - Option periods and conditions
            - Rent adjustment mechanisms for options

            ## WHAT NOT TO EXTRACT
            Exclude:
            - General lease term language
            - Commencement or expiration dates
            - Standard rent payment obligations
            - Operating expense or service charge provisions
            - Maintenance or repair obligations

            ## DECISION RULES
            1. If the lease contains explicit option provisions, summarize them concisely.
            2. If the lease is silent on options, return "i dont know".
            3. If option language is vague or conditional without clear terms, include what is stated.

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall have the option to renew this Lease for two (2) additional terms of five (5) years each, at ninety-five percent (95%) of Fair Market Value rent."
            Response: Tenant may renew for 2 additional 5-year terms at 95% FMV rent

            Example 2:
            Input context: "Tenant shall have a right of first offer to lease additional contiguous space if it becomes available."
            Response: Tenant has right of first offer for contiguous space

            Example 3:
            Input context: "Tenant shall have the right to extend the lease for one additional 3-year term on the same terms and conditions, with rent to be adjusted to market rate."
            Response: Tenant may extend for 1 additional 3-year term at market rate

            Example 4:
            Input context: "The lease shall automatically renew for successive one-year periods unless either party provides 60 days' notice of non-renewal."
            Response: Auto-renews for successive 1-year terms with 60-day non-renewal notice

            Example 5:
            Input context: "No renewal, extension, or expansion options are granted under this Lease."
            Response: i dont know

        - role: user
          content: "{prompt}"

    
























