  templates:      

    Arrangement_Start_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease Commencement Date** (ingangsdatum, aanvangsdatum, huuringangsdatum) is the calendar date the lease term officially begins.
                This is a Dutch lease — dates may appear in formats like "1 januari 2024", "01-01-2024", or "1/1/2024".

                Rules:
                1. Extract only a date that is **explicitly stated** in the lease as the ingangsdatum, aanvangsdatum, or lease start date.
                2. If the lease has an amendment (addendum), use the commencement date from the amendment if it explicitly states one; otherwise use the original lease commencement date.
                3. Do NOT calculate or infer dates (e.g., "30 dagen na ondertekening", "na oplevering"). If no explicit date is given, respond "i dont know".
                4. Do NOT use:
                   - Huurcommissie commencement dates.
                   - Rent Commencement Date (huurprijsaanvang) unless explicitly stated to be the same as the ingangsdatum.
                   - Execution date (ondertekeningsdatum).
                   - Renewal or extension dates.

                Return only the date in **DD/MM/YYYY** format. If it cannot be determined, respond "i dont know".

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur vangt aan op 1 maart 2023."
                Response: "01/03/2023"

                2. Given:
                   "Ingangsdatum: 15 juni 2024"
                Response: "15/06/2024"

                3. Given:
                   "De huur gaat in na oplevering van het gehuurde."
                Response: "i dont know"
                Reason: No explicit date given — delivery-based commencement.

                4. Given:
                   "Ondertekeningsdatum: 20 mei 2022. Huurprijsaanvang: 1 juli 2022."
                Response: "i dont know"
                Reason: Neither is explicitly stated as the ingangsdatum.

        - role: user
          content: "{prompt}"

    Arrangement_End_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease End Date** is the date the **initial base lease term** expires — before any renewal or extension options are exercised.
                In Dutch leases, this may be called: "einddatum", "expiratiedatum", "huurperiode eindigt op", "huurtermijn eindigt".

                Extract using one of these two scenarios only:

                **Scenario 1 — Explicit End Date:**
                If the lease explicitly states the end date or expiration date of the initial lease term, use that date directly.

                **Scenario 2 — Term + Commencement Date Calculation:**
                If the lease states both an explicit commencement date (ingangsdatum) and an explicit term length (huurtermijn), calculate:
                Commencement Date + Term Length − 1 day = Lease End Date.
                Example: Ingangsdatum 1 september 2026 + 3 jaar = 31 augustus 2029.

                Do NOT use:
                - "Definitieve einddatum" — this reflects the end of the last possible renewal.
                - Renewal option end dates (verlenging einddatum).
                - Early termination dates (voortijdige beëindiging).
                - Conditional or event-based end dates.

                If neither scenario applies, respond "i dont know".
                Return only the date in **DD/MM/YYYY** format.

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur eindigt op 31 augustus 2029."
                Response: "31/08/2029"

                2. Given:
                   Ingangsdatum: 1 september 2026. Huurtermijn: 3 jaar.
                Response: "31/08/2029"
                Reason: 1 sep 2026 + 3 jaar - 1 dag = 31 aug 2029.

                3. Given:
                   "Definitieve einddatum inclusief verlengingsopties: 31 augustus 2035"
                Response: "i dont know"
                Reason: Definitive end date includes renewal periods.
        - role: user
          content: "{prompt}"

    Occupancy_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            The 'Occupancy Date' (or 'Date of Occupancy') is the specific calendar date on which the tenant is permitted to occupy,
            possess, or begin using the leased premises. This date is distinct from the lease execution date,
            lease effective date, lease commencement date, or rent commencement date, unless explicitly stated as the same.

            You are analyzing a lease document to extract the correct **occupancy date**. The document may contain multiple dates,
            including commencement dates, possession dates, delivery dates, rent commencement dates, and projected dates.

            Your task is to read and understand the lease language and return the **correct occupancy date** based on the following logic:

            1. **Amendments or Expansions**:
               If the document includes amendments, expansions, or new space,
               prioritize the occupancy date associated with the new or modified premises.

            2. **Explicit Dates**:
               If the lease explicitly states the occupancy date
               (e.g., "Tenant may occupy the Premises on June 1, 2025"),
               return that date.

            3. **Conditional Clauses**:
               If occupancy is defined conditionally
               (e.g., "the earlier of Substantial Completion or Tenant opening"),
               evaluate the conditions.
               If actual dates are provided, use the applicable occupancy date.
               If not, use the fallback date referenced in the lease.

            4. **Delivery-Based Occupancy**:
               If occupancy begins upon delivery of the premises,
               and a delivery date is provided,
               use the delivery date unless the lease explicitly states otherwise.

            5. **Projected or Targeted Dates**:
               If the lease uses terms such as
               "projected occupancy date",
               "anticipated occupancy date",
               or "target occupancy date",
               and no confirmed occupancy date exists elsewhere,
               treat that date as the occupancy date.

            6. **Possession Date as Occupancy Date**:
               If the lease states that the tenant may take possession of the premises on a specific date,
               use that possession date as the occupancy date.

            7. **Fallback to Fixed Dates**:
               If no actual events such as occupancy, delivery, or completion are documented,
               use the fixed occupancy date provided in the lease.

            8. **Fallback to Commencement Date**:
               If no occupancy-related language is available,
               and the lease explicitly states that occupancy begins on the commencement date,
               use the commencement date.

            Return only the final occupancy date in MM/DD/YYYY format (e.g., 06/01/2025).
            Do not include any explanation or additional text.

            If the occupancy date cannot be determined from the lease text,
            respond with "i dont know".

        - role: system
          content: |
            ####

            Examples:

            1. Given:
              Occupancy Date: Upon lease execution.
              Tenant may occupy the Premises beginning June 1, 2025.

            Response: "06/01/2025"

            2. Given:
              Tenant shall be entitled to occupy the Premises on August 1, 2022.

            Response: "08/01/2022"

            3. Given:
              Occupancy Date shall be the earlier of
              (i) Tenant opening for business or
              (ii) February 1, 2024.

              Tenant opened for business on January 15, 2024.

            Response: "01/15/2024"

            4. Given:
              Target Occupancy Date: July 1, 2011.

            Response: "07/01/2011"

            5. Given:
              Tenant occupancy shall commence upon delivery of the Premises.
              Landlord estimates delivery by January 1, 2011.

            Response: "01/01/2011"

            ####

        - role: user
          content: "{prompt}"

    Lease_Term:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            ## DEFINITION

            lease_term is the duration of the initial/current lease period.

            It does not include:
            - renewal periods
            - extension periods
            - optional renewal periods
            - optional extension periods

            Output must always be expressed in months.

            ## HOW TO IDENTIFY THE lease_term

            ### 1. Explicit Duration

            Look for phrases such as:

            - "Lease Term"
            - "Initial Term"
            - "Term of this Lease"
            - "shall continue for"

            Accept variants such as:

            - "Lease Years"
            - "for X Lease Years"
            - "plus an additional X months"
            - "for a period of X years and Y months"

            ### Conversion Rules

            - If stated in months:
              Example:
              "sixty (60) months"

              Response:
              "60 months"

            - If stated in years or Lease Years:
              years × 12

              Example:
              "ten (10) years"

              Response:
              "120 months"

            - If stated as:
              "X years plus Y months"

              Formula:
              (X × 12) + Y

              Example:
              "ten (10) Lease Years plus nine (9) months"

              Response:
              "129 months"

            - If text includes:
              "plus an additional"

              always add those months to the total.

            ### 2. Fallback Duration (Calculated lease_term)

            If the document does not explicitly mention a lease_term duration, but both:

            - arrangement_start_date
            - arrangement_end_date

            are available, calculate the lease_term in months.

            Formula:

            months =
            (Year₂ - Year₁) × 12 +
            (Month₂ - Month₁)

            Output the computed value using the same format:

            Example:
            "48 months"

            This fallback is only used when no explicit numeric lease_term is found.

            When no arrangement_end_date is available, respond:

            "i dont know"

            ## EXCLUSIONS (DO NOT EXTRACT)

            Do not extract:

            - day-count periods
            - notice periods
            - commencement delays
            - construction periods
            - rent-free periods
            - abatement periods
            - holdover periods

            Examples:

            - "120 days"
            - "90 days"
            - "30 days"

            These are not lease_term values.

            Do not extract:

            - renewal options
            - extension options

            Example:

            "Tenant shall have two options to extend for five years each."

            Response:

            "i dont know"

            Do not extract:

            - generic references such as:
              - "during the Term"
              - "end of the Term"

            unless a numeric duration is explicitly provided.

            If there is neither:

            - an explicit lease_term

            nor

            - sufficient arrangement_start_date and arrangement_end_date information

            respond:

            "i dont know"

            ## OUTPUT FORMAT

            Return only:

            "<number> months"

            Examples:

            - "60 months"
            - "120 months"
            - "129 months"

            No explanation.
            No additional text.

            If nothing qualifies after applying all rules, respond with:

            "i dont know"

        - role: user
          content: "{prompt}"

    Ref_lease_term_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            You are a precise commercial real estate analyst extracting key lease metadata.

            TASK:
            Identify and return the Unit of Measure (UOM) description describing the overall duration/length of the Lease Term.

            ALLOWED OUTPUT VALUES:
            - "Months"
            - "Years"
            - "Days"
            - "i don't know"

            EXTRACTION & NORAMLIZATION RULES:
            1. Look for explicit statements describing the primary or initial lease term duration (e.g., "5 years", "60 months", "90 days").
            2. Normalize the extracted time unit to one of the exact ALLOWED OUTPUT VALUES:
                - If the lease term duration is expressed in months (e.g., "60 months", "sixty (60) calendar months"), output "Months".
                - If the lease term duration is expressed in years (e.g., "5 years", "ten (10) years"), output "Years".
                - If the lease term duration is expressed in days (e.g., "180 days"), output "Days".
            3. DO NOT output the numeric value itself—output ONLY the unit of measure.
            4. Focus on the primary/initial Lease Term duration. Do not use UOMs from renewal options, free rent/abatement periods, or notice periods unless they define the primary term itself.
            5. If the lease duration is defined purely by fixed dates (e.g., "Commencing Jan 1, 2024 and Expirating Dec 31, 2029") without stating explicit months, years, or days in the term clause, OR if the UOM cannot be clearly determined, output "i don't know".
            6. If the lease term is expressed using both years and months (for example "3 years and 8 months"), return "Months" because the Lease_Term field is normalized and stored in months.
            7. When the lease term is converted into total months, always return "Months".

        - role: system
          content: |
            #### EXAMPLES ####

            Example 1:
            Input context: "Lease Term: The Initial Term of this Lease shall be for a period of ten (10) years commencing on the Commencement Date."
            Response: "Years"

            Example 2:
            Input context: "Term: Sixty-six (66) full calendar months starting from June 1, 2023."
            Response: "Months"

            Example 3:
            Input context: "This temporary lease agreement shall remain in effect for a total period of 120 days."
            Response: "Days"

            Example 4:
            Input context: "The term of this Lease shall commence on October 1, 2022 and shall expire on September 30, 2027."
            Response: "i don't know"

            Example 5:
            Input context: "Tenant shall have the option to extend the lease for an additional 5 years following the initial 36 month term."
            Response: "Months"

            Example 6:
            Input context: "Lease Term: 3 years and 8 months."
            Response: "Months"
            #### END EXAMPLES ####

        - role: user
          content: "{prompt}"

    Reserved_Parking_Spaces:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease extraction specialist. Your task is to identify the specific number of parking spaces that are expressly reserved, assigned, designated, exclusive, or allocated to the tenant.

            ## PRIMARY GOAL
            Return only the total count of tenant-specific reserved parking spaces as a single integer.
            If no valid reserved parking count is explicitly stated, return exactly: i don't know

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a single integer such as 0, 2, 5, 12
            - or exactly: i don't know

            Rules:
            - Do not include words, labels, units, punctuation, commas, decimals, or extra whitespace.
            - Do not include explanations, reasoning, or surrounding text.
            - Do not return ranges, formulas, or estimated values.
            - If multiple tenant-reserved counts are stated, sum them only if each component is clearly reserved to the tenant and explicitly quantified.

            ## WHAT COUNTS AS RESERVED PARKING
            Count parking spaces only when the lease clearly gives the tenant a specific reserved/assigned/exclusive right.
            Count parking spaces that are explicitly included as part of the leased premises and granted for the tenant's use, even if the words "reserved", "assigned", or "exclusive" are not used.
            Count these examples:
            - "Tenant shall have 5 reserved parking spaces"
            - "2 designated spaces for Tenant"
            - "Tenant is allocated 4 exclusive parking stalls"
            - "Tenant shall receive 3 assigned spaces"
            - "for Tenant's use only"
            - "reserved for Tenant"
            - "private reserved stalls"
            - "exclusive parking for the Tenant"

            ## WHAT DOES NOT COUNT
            Exclude these unless the lease clearly ties them to the tenant with a specific numeric count:
            - general/common/open parking
            - visitor parking
            - shared parking without a tenant-specific allocation
            - first-come, first-served parking
            - valet or self-park rights
            - parking ratios or formulas such as 3 spaces per 1,000 RSF
            - parking capacity language without an explicit reserved count
            - spaces reserved for landlord, owner, management, other tenants, or building executives unless specifically assigned to the tenant

            ## DECISION RULES IN ORDER
            1. Explicit none:
               If the lease expressly says the tenant receives no reserved/assigned/designated/exclusive parking, output 0.

            2. Explicit numeric count:
               If the lease states a specific number of reserved spaces for the tenant, output that number.
               If multiple clauses state separate tenant-reserved amounts, sum only the amounts that are clearly reserved to the tenant and explicitly quantified.

            3. Range or maximum language:
               - If the lease states "up to X reserved spaces", output X.
               - If it states "not more than X", output X.
               - If it states "at least X" or "not less than X", output X.
               - If it states a range such as "between 3 and 5", output the maximum value unless the text clearly fixes the number at the lower end.

            4. Shared reserved pool:
               If parking is in a shared pool but not specifically assigned or allocated to the tenant with a number, do not count it.
               If the lease specifically allocates a certain number to the tenant within a shared reserved area, count that allocated number.

            5. No formulas or ratios:
               Do not calculate parking counts from ratios, square footage, acreage, capacity formulas, or general parking standards.
               If the only information is a ratio or formula and no direct reserved count is stated, output i don't know

            6. No guessing:
               Do not infer reserved parking from phrases like "parking available", "adequate parking", "garage access", "parking rights", or general lease context.
               If the number is not clearly stated for the tenant, output i don't know

            7. Exclude non-tenant allocations:
               If spaces are reserved for executives, management, owners, or other entities but not clearly granted to the tenant, exclude them.

            ## SEARCH TARGETS
            Look for language in the lease, exhibits, parking schedules, rider clauses, and amendments such as:
            - reserved parking
            - designated parking
            - assigned parking
            - exclusive parking
            - allocated parking
            - parking spaces for Tenant
            - Tenant shall have X spaces
            - reserved stalls
            - parking permit rights
            - for Tenant's use only

            ## FEW-SHOT EXAMPLES
            Example 1:
            Input: "Tenant shall have 6 reserved parking spaces. Tenant and its invitees may also use unreserved parking in the common lot."
            Output: 6

            Example 2:
            Input: "Landlord will provide up to five (5) reserved stalls for Tenant in the garage, subject to availability."
            Output: 5

            Example 3:
            Input: "Tenant will be provided not less than 3 reserved spaces in the covered area."
            Output: 3

            Example 4:
            Input: "The garage contains reserved spaces for various tenants; Tenant may use reserved spaces as available."
            Output: i don't know

            Example 5:
            Input: "Within the building's reserved section, Tenant is allocated 4 reserved spaces; all other parking is unreserved."
            Output: 4

            Example 6:
            Input: "Tenant shall receive 2 reserved executive spaces and 3 additional reserved spaces."
            Output: 5

            Example 7:
            Input: "Two spaces are reserved for Building executives. Tenant may use general parking."
            Output: i don't know

            Example 8:
            Input: "Parking ratio: 3.5 spaces per 1,000 RSF of the Premises."
            Output: i don't know

            Example 9:
            Input: "Parking provided at 4/1,000 RSF. In addition, Tenant shall have 3 reserved spaces near the entrance."
            Output: 3

            Example 10:
            Input: "No reserved or assigned parking spaces are provided to Tenant under this Lease."
            Output: 0

            Example 11:
            Input: "The leased premises include 5 parking spaces."
            Output: 5

        - role: user
          content: "{prompt}"

    Cost_per_Reserved_Parking_Space:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            ## ROLE
            You are a lease-payment extraction specialist. Your task is to identify the monetary rate charged per reserved parking space for the tenant.

            ## PRIMARY GOAL
            Return only the numeric amount charged per reserved parking space.
            Do not return a total fee, do not return a monthly total for all spaces, and do not return rates for general or unreserved parking.

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a clean numeric value such as 100, 85.50, 0
            - or exactly: i don't know

            Rules:
            - Remove currency symbols, units, and billing descriptors from the final answer.
            - Output only the raw numeric value.
            - If the clause says the reserved parking is free, output 0.
            - If the fee is stated as a rate per space, extract the per-space rate; do not multiply by number of spaces.
            - If the fee varies over time, use the initial or first lease-year rate.
            - If the lease provides only a prevailing market rate, standard rate, or general parking fee without a clear numeric per-space amount, output i don't know

            ## WHAT TO EXTRACT
            Extract the rate for parking that is explicitly reserved, designated, assigned, exclusive, or allocated to the tenant, such as:
            - "$100 per space per month"
            - "$85.50 per reserved stall per month"
            - "$1,200 annually for each space"
            - "at the rate of $150 per reserved parking space per month"

            ## WHAT NOT TO EXTRACT
            Exclude:
            - unreserved, common, visitor, or general parking fees
            - total monthly charges for multiple spaces
            - aggregate parking charges for all spaces combined
            - parking ratios or formulas without explicit dollar amounts
            - market-rate language without an explicit numeric dollar figure

            ## DECISION RULES
            1. If the lease expressly states the reserved spaces are free, output 0.
            2. If a clear numeric dollar amount is stated for each reserved space, output that numeric value only.
            3. If the clause states an aggregate amount for multiple spaces, do not multiply it; extract the per-space rate only if explicitly stated.
            4. If the text includes different amounts over time, use the first lease-year amount.
            5. If no explicit numeric per-space reserved parking fee is stated, output i don't know

            ## KEY SEARCH TERMS
            Look for phrases such as:
            - per reserved space
            - per reserved stall
            - per parking space per month
            - per stall per month
            - annual fee per reserved space
            - reserved parking rate
            - Tenant shall pay $X per parking space

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall rent a total of 3 reserved parking spaces at an initial rate of $100.00 per space per month."
            Response: 100

            Example 2:
            Input context: "Tenant shall have the right to license (2) reserved parking stalls at $85.50 per reserved stall per month."
            Response: 85.50

            Example 3:
            Input context: "Landlord agrees to provide Tenant with 5 reserved parking spaces in the building garage free of charge throughout the Initial Term."
            Response: 0

            Example 4:
            Input context: "Tenant shall pay for reserved parking spaces at Landlord's prevailing standard rate, currently set at $150 per reserved space per month."
            Response: 150

            Example 5:
            Input context: "Tenant shall pay monthly parking fees for reserved spaces at the prevailing market rate as updated from time to time by Landlord."
            Response: i don't know

            Example 6:
            Input context: "Unreserved parking stalls shall cost $75.00 per space per month. Reserved parking spaces shall be allocated pursuant to Exhibit E."
            Response: i don't know

