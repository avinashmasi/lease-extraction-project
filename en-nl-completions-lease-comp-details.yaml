      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Identify the lease arrangement type from the provided context.

            Respond ONLY with one of the following, exactly as written:

              "Assignment"
              "Direct"
              "Flex Lease"
              "SubLease"
              "Unknown"

            **Rules**

              - "Assignment" → Applies when an existing tenant transfers its lease rights and obligations to another party. Look for terms such as "Assignment of Lease", "Assignee", "Assignor", or lease transfer language.

              - "Direct" → Applies when the lease is executed directly between the Landlord and Tenant without any sublease or assignment arrangement.

              - "Flex Lease" → Applies when the premises, lease structure, occupancy arrangement, or usage is described as flexible, shared, coworking, executive suite, managed office, or flexible workspace.

              - "SubLease" → Applies when a tenant (Sublessor) leases all or part of the premises to another party (Subtenant). Look for terms such as "Sublease Agreement", "Subtenant", "Sublessor", or "Subleased Premises".

              - "Unknown" → Applies when none of the above categories can be clearly determined from the lease document.

            **Exclusions**

              - Do not classify an Assignment as a SubLease.
              - Do not classify a standard Landlord-Tenant lease as a SubLease.
              - Do not infer a Flex Lease unless the document contains clear indicators of a flexible occupancy structure.
              - If the lease arrangement type cannot be confidently identified, respond with "Unknown".
              - Do not include quotes, explanations, or additional text.

            ####

            Examples:

            1. Given:
              "Assignment and Assumption of Lease Agreement between Assignor and Assignee"

              Response:
              Assignment

            2. Given:
              "Lease Agreement entered into by and between Landlord and Tenant"

              Response:
              Direct

            3. Given:
              "Sublease Agreement between Tenant and Subtenant for a portion of the Premises"

              Response:
              SubLease

            4. Given:
              "Flexible office membership agreement for shared workspace occupancy"

              Response:
              Flex Lease

            5. Given:
              "Insufficient information to determine the lease arrangement"

              Response:
              Unknown

            ####

        - role: user
          content: "{prompt}"

      
