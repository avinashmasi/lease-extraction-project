    Lease_Arrangement_Reason_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the Lease Arrangement Reason Type strictly into the allowed categories based on the tenant's underlying motivation for the transaction.

            Business definition:
            The tenant's underlying motivation for the transaction, for example growth, consolidation, cost reduction, quality upgrade, lease expiry, or relocation.

            Do not explain.
            Do not use quotes.
            Respond with ONLY the category name.

            Allowed categories:
              - "Business Continuity"
              - "Business Growth"
              - "Downsizing"
              - "New Establishment"
              - "Relocation"
              - "Unknown"

            #### General Classification Principles:

            - Classify the tenant's underlying business motivation, not merely the legal lease activity, arrangement type, intended use, property location, or physical fit-out.

            - Select a category only when the lease, amendment, recitals, heads of terms, transaction summary, or another operative provision explicitly states the reason or provides strong and unambiguous evidence of that reason.

            - Do not infer the reason solely from:
              - the document being a new lease
              - the tenant being described as a new tenant
              - the lease commencing at a new property
              - the tenant having a registered address different from the leased property
              - the tenant taking premises in another city
              - the premises having a new intended use
              - the tenant carrying out fit-out, renovation, or specialist installation works
              - the premises being delivered before or after completion
              - the size of the leased space
              - the lease being long-term or short-term
              - the existence of a rent-free period or incentive
              - relocation costs being one permitted use of an incentive
              - the document mentioning existing business operations without stating that the lease maintains them
              - the ordinary continuation or automatic extension provisions contained in most leases

            - If two or more reasons are possible and the document does not clearly establish which reason caused the transaction, classify as "Unknown".

            - Historical background must not be treated as the current transaction reason unless the latest operative document clearly links that background to the current lease event.

            #### Classification Rules:

            - "Business Continuity"
              - The transaction is intended to maintain, preserve, replace, renew, or continue existing business operations or an existing occupation.
              - Use when the document clearly indicates:
                - renewal or regear of the same tenant's existing lease for the same premises
                - replacement of an existing lease while the same tenant continues occupying the same premises
                - a temporary or bridging arrangement designed to avoid interruption of existing operations
                - continuation of an existing operational site, facility, office, telecommunications installation, or business function
                - replacement premises required because the existing premises or arrangement will expire, terminate, become unavailable, or undergo redevelopment
                - the document expressly refers to operational continuity, business continuity, continuity of use, maintaining occupancy, or continuing current activities

              - A renewal of the same tenant's occupation at the same property normally supports "Business Continuity" unless the document states another reason.

              - Do not select "Business Continuity" merely because:
                - the tenant is an existing company
                - business operations will take place in the premises
                - the lease contains automatic renewal provisions
                - the transaction is a new lease with no evidence of a replaced or continued arrangement
                - the agreement generally supports the tenant's business

            - "Business Growth"
              - The lease is driven by expansion or growth of the tenant's business.
              - Use when the document clearly indicates:
                - increased headcount
                - increased operational capacity
                - additional premises or additional floors, units, or space required because existing space is insufficient
                - expansion of an established office, store network, laboratory, warehouse, or operational facility
                - growth in customer demand, production, staffing, services, or business activity
                - the new premises are additional to retained existing premises and are required for expansion

              - Do not select "Business Growth" solely because:
                - the leased premises are large
                - the tenant is opening a location
                - the tenant is taking additional space without a stated connection to growth
                - the document describes the tenant as developing or operating a business
                - the transaction may support future growth but growth is not stated as the reason

            - "Downsizing"
              - The lease is driven by a reduction in occupied space, operating capacity, cost, or business footprint.
              - Use when the document clearly indicates:
                - reduction in premises size
                - fewer floors, units, desks, employees, or locations
                - consolidation into a smaller footprint
                - release, surrender, or disposal of surplus space
                - cost reduction achieved by reducing occupied premises
                - reduced staffing or operational requirements

              - Do not select "Downsizing" merely because:
                - the leased area is small
                - the tenant takes flexible or temporary space
                - the transaction includes cost-saving terms
                - part of the existing space is surrendered without evidence that footprint reduction motivated the transaction

            - "New Establishment"
              - The transaction establishes a genuinely new business location, office, branch, store, facility, operational site, or business presence.
              - Use when the document clearly indicates:
                - first office, first store, first branch, or first facility
                - opening or establishing a new location
                - entering a new city, region, or market while retaining existing operations
                - creation of an additional operational site that did not previously exist
                - establishment of a new telecommunications site, laboratory, educational site, healthcare location, or similar operation
                - the document explicitly states that the tenant will establish its business at the premises
                - the tenant first occupies temporary space at the same property while permanent space is prepared as part of establishing the new location

              - A new lease does not automatically mean "New Establishment".

              - Do not select "New Establishment" solely because:
                - the tenant is called a new tenant
                - the lease is the first lease between the parties
                - the premises are in a different city from the tenant's registered address
                - the premises require fit-out or specialist installations
                - a new use will commence at the premises
                - no previous lease at the property is mentioned
                - the tenant is an existing company taking another property without an explicit or strongly supported new-location purpose

              - If the document only establishes that the transaction is a new lease, but does not establish that the premises are a new business location or operation, classify as "Unknown".

            - "Relocation"
              - The transaction involves moving existing business operations, employees, equipment, laboratories, offices, or another existing function from one property to another.
              - Use when the document clearly indicates:
                - relocation, move, transfer, migration, or consolidation from identified existing premises
                - the existing location will be vacated, closed, surrendered, sold, leased out, or replaced
                - employees, operations, equipment, laboratories, or business functions will move from an existing property to the new premises
                - multiple existing locations will be moved and combined into the new premises
                - the new premises are expressly described as replacement premises for the tenant's current location

              - Do not select "Relocation" solely because:
                - the tenant's registered, correspondence, invoice, or visiting address differs from the leased-property address
                - the tenant takes premises in another city
                - relocation expenses are one possible use of a landlord incentive
                - the lease permits moving between units within the same property
                - temporary accommodation is used before the permanent unit at the same property becomes available
                - the tenant receives keys to a new property
                - the lease concerns new premises but does not state what happens to the existing premises

              - An internal move between temporary and permanent units within the same property does not by itself establish "Relocation" as the underlying transaction reason.

            - "Unknown"
              - Use when the tenant's underlying motivation cannot be clearly determined from the lease document.
              - Use "Unknown" when:
                - the document states only the intended use of the premises
                - the document identifies a new lease but provides no reason for taking it
                - the tenant's registered address differs from the leased-property address, but no move or closure is stated
                - the document supports multiple possible reasons
                - the conclusion would depend only on assumptions about the tenant's business plans
                - the document is a brokerage mandate, engagement letter, main work order, search instruction, or services agreement and no completed property transaction reason is identified
                - the document provides alternative possible outcomes, such as relocation or expansion, without confirming which outcome occurred

            #### Evidence Priority:

            When evidence conflicts, apply the following priority:

              1. Latest executed amendment, allonge, rider, or addendum
              2. Explicit statement of the tenant's transaction motivation
              3. Recitals or background clauses directly explaining why the transaction occurred
              4. Operative provisions showing an unambiguous continuation, move, expansion, or reduction
              5. Transaction summary or heads of terms
              6. Contextual indicators such as address differences, fit-out works, incentives, or intended use

            Evidence from levels 1 through 5 may support a category when sufficiently clear.
            Evidence from level 6 alone is not sufficient and should result in "Unknown".

            #### Special Rules for Amendments and Combined Documents:

            - Determine the reason for the latest operative transaction, not an earlier historical event mentioned in the document.

            - When an amendment renews the same tenant at the same premises, classify as "Business Continuity" unless the amendment explicitly states another motivation.

            - When a prior assignment, relocation, or expansion is mentioned only as historical background, do not use that historical reason for the current amendment.

            - When an earlier termination notice is expressly cancelled or treated as not sent and the lease is extended, the extension normally supports "Business Continuity".

            - When the document is a short bridging lease connected to continuation into a replacement or successor arrangement, classify as "Business Continuity" only if the link is clearly documented.

            #### Examples:

            1. Given:
              "Tenant requires additional office space to accommodate projected employee growth."

              Response:
              Business Growth

            2. Given:
              "Tenant shall relocate its operations from the existing premises to the new premises."

              Response:
              Relocation

            3. Given:
              "Tenant is reducing its occupied square footage to align with current staffing needs."

              Response:
              Downsizing

            4. Given:
              "This lease is for Tenant's first office location in Amsterdam."

              Response:
              New Establishment

            5. Given:
              "Tenant renews occupancy to continue ongoing operations at the property."

              Response:
              Business Continuity

            6. Given:
              "No information is provided regarding the business reason for the lease."

              Response:
              Unknown

            7. Given:
              "The tenant's registered address is in Utrecht, and the leased premises are in Eindhoven."

              Response:
              Unknown

            8. Given:
              "The landlord contribution may be used for fit-out costs and/or relocation costs."

              Response:
              Unknown

            9. Given:
              "The tenant will move and combine six existing laboratories into one new facility."

              Response:
              Relocation

            10. Given:
              "The parties replace the prior lease for the same premises, and the tenant's use continues without a new handover."

              Response:
              Business Continuity

            11. Given:
              "The agreement creates a new lease, and the premises will be used as office space."

              Response:
              Unknown

            12. Given:
              "The provider will allow the tenant to establish its business at the new serviced-office location."

              Response:
              New Establishment

            13. Given:
              "The tenant is described as a new tenant of the building."

              Response:
              Unknown

            14. Given:
              "The tenant will open an additional branch in a new region while retaining its existing locations."

              Response:
              New Establishment

            15. Given:
              "The tenant requires additional warehouse capacity because its existing operations have grown."

              Response:
              Business Growth

            16. Given:
              "The engagement may result either in relocation to a new building or expansion in the current building."

              Response:
              Unknown

            17. Given:
              "The transaction extends the existing lease for the same tenant and same premises."

              Response:
              Business Continuity

            18. Given:
              "The tenant will initially occupy a temporary unit in the same building until its permanent new office is completed."

              Response:
              New Establishment

        - role: user
          content: "{prompt}"

    Tenant_Status_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the Tenant Status Type strictly into one of the allowed categories.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY the category name.

            Allowed categories:
              - Expired
              - Future
              - Gone
              - Moving
              - No Longer Tenant
              - Occupying
              - Unknown

            Determine the tenant status as of the supplied runtime processing
            date. The runtime context must explicitly label this value as the
            Current processing date, Processing date, As-of date, or Status date.
            Never use the document date, signature date, delivery date, payment
            date, rent-free date, renewal date, termination date, surrender date,
            relocation date, option date, or the model's implicit knowledge of
            today's date as the processing date. If it is not supplied, return
            Unknown.

            Review the complete lease package and chronology. Use only executed
            documents and controlling dates for the applicable premises record.
            An executed amendment overrides only the commencement, expiration,
            premises, or event term that it expressly changes. Ignore drafts,
            unsigned amendments, proposals, negotiations, intentions, and
            unexercised options. Confirmed extensions, renewals, or amendments
            must be applied before evaluating expiration.

            Normalize all controlling dates to YYYY-MM-DD and compare complete
            dates, not document order or year/month/day fragments. Use:
              commencement_key = commencement date
              expiration_key = expiration date
              processing_key = runtime processing date
              event_key = executed event date

            Apply these rules in exactly this priority order:

            1. No Longer Tenant
              Return No Longer Tenant only when an executed agreement ends the
              tenant's entire tenancy and event_key is on or before processing_key.
              An ordinary expiry or a premises-only removal is not sufficient.

            2. Gone
              Return Gone only when an executed surrender, contraction,
              substitution, completed relocation, or amendment removes this
              specific premises record and event_key is on or before processing_key.
              Apply Gone only to the affected premises record.

            3. Moving
              Return Moving only when an executed relocation, substitution, or
              future surrender will remove this existing premises record and
              event_key is after processing_key. A possible relocation,
              alternative property, break option, or intention is insufficient.

            4. Unknown
              Return Unknown when controlling evidence is missing, conflicting,
              ambiguous, unreadable, or not executed. This includes missing or
              unreliable processing, commencement, or expiration dates;
              commencement after expiration; an unresolved amendment; or
              uncertainty about whether a continuation became effective.

            5. Future
              Return Future only when processing_key is before commencement_key,
              the lease is executed, and no higher-priority event applies.
              A future break, rent review, payment, renewal, or expiry date does
              not make the status Future.

            6. Expired
              Return Expired only when processing_key is after expiration_key,
              no higher-priority event applies, and no effective extension,
              renewal, expiration-date amendment, automatic extension, exercised
              renewal option, holding over, or other supported continuation exists.

            7. Occupying
              Return Occupying only when commencement_key is on or before
              processing_key and processing_key is on or before expiration_key,
              with no higher-priority event. Treat both commencement and
              expiration dates as inclusive. Confirmed move-out, surrender,
              termination, or removal overrides an otherwise active date range.

            Do not create a premises record merely because status language appears.
            Do not use empty area, suite, floor, or unit fields as a reason for
            Unknown when the status dates and event evidence are reliable.

            Before responding, validate the selected status against its exact
            date rule and regenerate the decision from the final controlling
            dates. Return only the exact category name with no quotes,
            punctuation, explanation, or extra text.
              Output exactly one of these values, with matching capitalization and
              no quotes, punctuation, explanation, or extra text:

              Expired
              Future
              Gone
              Moving
              No Longer Tenant
              Occupying
              Unknown

        - role: user
          content: "{prompt}"

    ACT_1954_F:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Determine whether the lease is protected by the Landlord and Tenant Act 1954.

            Respond ONLY with one of the following values:

              "Y"
              "N"

            Do not explain.
            Do not use quotes.
            Do not provide additional text.

            #### Classification Rules:

            - "Y"
              - The lease benefits from security of tenure under the Landlord and Tenant Act 1954.
              - Look for phrases such as:
                - protected by the Landlord and Tenant Act 1954
                - security of tenure
                - inside the Act
                - tenancy protected by Part II of the Landlord and Tenant Act 1954
                - tenant has statutory renewal rights

            - "N"
              - The lease has been contracted out of the Landlord and Tenant Act 1954.
              - Look for phrases such as:
                - outside the Landlord and Tenant Act 1954
                - contracted out
                - exclusion of sections 24-28
                - statutory declaration
                - simple declaration
                - no security of tenure
                - tenancy excluded from Part II of the Act

            - If the lease clearly states that it is contracted out of the Act, respond with "N".

            - If the lease clearly states that security of tenure applies under the Act, respond with "Y".

            ####

            Examples:

            1. Given:
              "This Lease is protected by the security of tenure provisions of the Landlord and Tenant Act 1954."

              Response:
              Y

            2. Given:
              "The parties agree that the tenancy is excluded from Sections 24 to 28 of the Landlord and Tenant Act 1954."

              Response:
              N

            3. Given:
              "Tenant has the benefit of statutory renewal rights under Part II of the Act."

              Response:
              Y

            4. Given:
              "The Lease has been contracted out of the security of tenure provisions of the Landlord and Tenant Act 1954."

              Response:
              N

            ####

        - role: user
          content: "{prompt}"

    Space_Condition_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the physical condition in which the premises are contractually delivered to the tenant.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY one category.

            Allowed categories:
              - Core And Shell
              - Fitted Out
              - To Be Agreed Upon
              - Turn-Key
              - Unknown

            Review the specific delivery clause, landlord works, tenant works, fit-out specification, handover report, and existing improvements. Classify the condition at contractual delivery, not the condition before landlord works or after the tenant completes its own works.

            #### Classification Rules:

            - Core And Shell:
              Select when the premises are delivered as shell, core and shell, casco, bare, raw, substantially unfinished, or when the tenant must complete substantial internal fit-out before normal occupation.

              Base-building items may still be present, including ceilings, lighting, raised floors, climate systems, sanitary facilities, utilities, lifts, cable trays, common areas, or limited landlord works.

              Select Core And Shell when the lease expressly states shell or casco delivery even if some base installations are included.

            - Fitted Out:
              Select when usable interior improvements already exist and are delivered with the premises.

              Examples include flooring, ceilings, lighting, partitions, offices, meeting rooms, pantry, cabling, access control, sanitary facilities, or an existing fit-out package.

              Also select Fitted Out for an existing furnished or serviced office. Furniture and operational services do not by themselves make the premises Turn-Key.

              Minor repairs, cleaning, painting, alterations, tenant branding, furniture installation, or limited tenant customization do not prevent classification as Fitted Out.

            - Turn-Key:
              Select only when the landlord is contractually responsible for completing and delivering the premises ready for the tenant's intended operation, according to an agreed specification, scope of works, drawings, or tenant requirements.

              Turn-Key may include landlord-provided partitions, finishes, furniture, laboratory installations, specialist systems, commissioning, or other tenant-specific works.

              Select Turn-Key based on the final delivery condition even if the premises are shell before the landlord completes the works.

              Do not select Turn-Key merely because:
                - the premises are already furnished
                - the office is move-in ready when contracted
                - services such as internet, reception, cleaning, or furniture are included
                - the landlord performs only minor repairs or limited improvements

            - To Be Agreed Upon:
              Select only when a specific property's final delivery condition or allocation of fit-out responsibilities is explicitly left for future agreement.

              A future handover report, condition report, final inspection, or approval process does not by itself mean To Be Agreed Upon.

              Do not use To Be Agreed Upon as a substitute for missing information.

            - Unknown:
              Select when:
                - no reliable delivery-condition evidence is provided
                - the document is not a lease or property arrangement
                - no specific premises have been selected
                - the document is only a brokerage mandate, engagement letter, search instruction, template, or services framework
                - the available evidence cannot distinguish among the permitted conditions

            #### Interpretation Priority:

              1. Latest executed amendment, rider, or allonge
              2. Specific negotiated delivery or fit-out clause
              3. Agreed landlord works or tenant specification
              4. Signed handover or condition report
              5. Description of existing fit-out
              6. General conditions or standard wording

            - "As is" or "current condition" is not a category. Use the physical details:
                - usable existing interiors → Fitted Out
                - bare or substantially unfinished space → Core And Shell
                - insufficient description → Unknown

            - Tenant alteration rights and expiry reinstatement obligations do not determine the commencement condition.

            - If different parts have different conditions, classify the predominant leased area. If no predominant condition can be determined, return Unknown.

            #### Examples:

            Given:
              "The premises will be delivered in casco condition with climate systems, sanitary facilities, lighting, and raised floors. The tenant will install partitions, finishes, pantry, and cabling."

            Response:
              Core And Shell

            Given:
              "The existing fit-out, including flooring, ceilings, lighting, partitions, pantry, and access control, is transferred to the tenant."

            Response:
              Fitted Out

            Given:
              "The landlord will complete the fit-out, furniture, laboratory installations, testing, and commissioning in accordance with the tenant's specification."

            Response:
              Turn-Key

            Given:
              "The serviced office is completely furnished and includes internet, reception, and cleaning."

            Response:
              Fitted Out

            Given:
              "The final delivery specification and division of fit-out works will be agreed later."

            Response:
              To Be Agreed Upon

            Given:
              "CBRE is appointed to search for potential premises. No property has been selected."

            Response:
              Unknown

            Return exactly one allowed category.

        - role: user
          content: "{prompt}"

          
    Arrangement_End_Future_Action_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the Arrangement End Future Action Type strictly into one
            of the allowed categories.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY the category name.

            Allowed categories:
              - Decisions Ongoing With Landlord
              - Decisions Ongoing With Occupier
              - End Date Not Correct
              - New Break Date
              - New Date Given By Client
              - New Rent Review Date
              - To Be Revisited

            This field describes the next action or workflow status relating
            to the arrangement end. It does not describe every lease event,
            approval requirement, option, or future date contained in the document.

            Use explicit evidence of a current action, decision, correction,
            update, or required follow-up. Do not infer an ongoing decision
            merely from standard contractual wording.

            Classification Rules:

            - Decisions Ongoing With Landlord
              - Select only when the document or supplied context explicitly
                confirms that a current decision, negotiation, response, approval,
                or instruction is pending from the landlord.
              - Relevant wording may include:
                  - awaiting landlord response
                  - landlord decision pending
                  - landlord reviewing the proposal
                  - negotiations currently ongoing with landlord
                  - landlord approval currently outstanding
              - Do not select merely because:
                  - landlord consent may be required in the future
                  - the tenant has a break option
                  - alterations require landlord approval
                  - the lease contains ordinary landlord rights
                  - a contractual condition involves the landlord

            - Decisions Ongoing With Occupier
              - Select only when the document or supplied context explicitly
                confirms that a current decision, instruction, review, or response
                is pending from the tenant, occupier, or client.
              - Relevant wording may include:
                  - awaiting occupier decision
                  - tenant decision pending
                  - awaiting tenant instruction
                  - client reviewing available options
                  - occupier currently considering renewal
                  - tenant currently evaluating relocation
              - Do not select merely because:
                  - the tenant has an unexercised break option
                  - the tenant may terminate or renew in the future
                  - the tenant must provide future notice
                  - the lease gives the tenant a contractual choice

            - End Date Not Correct
              - Select only when the document or supplied context explicitly
                identifies an existing recorded end date, expiry date, or
                termination date as incorrect or inconsistent.
              - Relevant wording may include:
                  - recorded end date is incorrect
                  - expiry date requires correction
                  - termination date is inaccurate
                  - date discrepancy identified
                  - system end date does not match the lease
              - Do not select merely because the lease contains multiple dates,
                extension periods, break options, or conditional termination dates.

            - New Break Date
              - Select when a newly identified, newly agreed, amended, revised,
                or replacement break date must be recorded.
              - The break date must relate to an actual contractual break option
                or early termination right.
              - Relevant wording may include:
                  - revised break date
                  - amended break option date
                  - new tenant break date
                  - break date changed
                  - newly identified break date
                  - break option effective on a specified date
              - A break option must provide a determinable date.
              - A determinable date may be either:
                  - an explicitly stated calendar date; or
                  - a date that can be calculated unambiguously from the
                    commencement date and the break provision.
              - Do not select when:
                  - the provision only describes a general termination right
                  - the date depends on an unresolved future event
                  - the break date cannot be determined
                  - the document only contains the normal lease expiry date
                  - a break option has already been exercised and no new date
                    needs to be recorded

            - New Date Given By Client
              - Select only when the supplied context explicitly confirms that
                the client has provided or instructed a new or replacement
                arrangement end date, expiry date, or termination date.
              - Relevant wording may include:
                  - client confirmed a new end date
                  - replacement date supplied by client
                  - revised expiry date provided by client
                  - client instructed that the end date be changed
              - Do not infer this category from a date appearing in the lease.
              - A landlord, tenant, or lease document is not automatically the
                client for this classification.

            - New Rent Review Date
              - Select when a newly identified, revised, amended, or replacement
                rent review date must be recorded.
              - Relevant wording may include:
                  - revised rent review date
                  - updated review date
                  - next rent review date changed
                  - amended rent review schedule
                  - newly identified rent review date
              - Do not select merely because the lease contains an ordinary
                rent review or indexation date unless the task is specifically
                to record that newly identified date.

            - To Be Revisited
              - Select when:
                  - the matter remains unresolved
                  - information required for classification is unavailable
                  - a future event must occur before the end position is known
                  - additional investigation or clarification is required
                  - a relevant date cannot be determined reliably
                  - none of the other categories is supported by explicit evidence
              - Relevant wording may include:
                  - to be determined
                  - revisit later
                  - pending investigation
                  - clarification required
                  - information unavailable
                  - follow-up required
                  - further review needed

            Evidence and Interpretation Rules:

              - Give priority to explicit current workflow information over
                general lease provisions.
              - Do not treat a contractual right, option, obligation, or approval
                requirement as evidence that a decision is currently ongoing.
              - Do not assume that negotiations are ongoing unless the supplied
                information explicitly says so.
              - Do not assume that a tenant intends to exercise a break option
                merely because the option exists.
              - Do not treat an ordinary lease expiry date as a New Break Date.
              - Distinguish the break effective date from the notice deadline.
              - Do not classify a conditional termination date as a fixed new
                break date when it depends on an event that has not yet occurred.
              - References to landlord consent for alterations, assignment,
                subletting, signage, or fit-out are not arrangement-end actions.
              - References to tenant renewal or termination rights are not evidence
                of an ongoing occupier decision unless a current decision process
                is explicitly described.
              - Dates found only in templates, examples, general conditions,
                headers, footers, or unrelated agreements must not determine
                the classification.
              - When the available evidence supports more than one category,
                select the category describing the most specific current action.
              - If there is no explicit evidence of a current action or reliable
                new date, select To Be Revisited.

            Examples:

            1. Given:
              "The tenant submitted a renewal proposal and is awaiting the
              landlord's response."

              Response:
              Decisions Ongoing With Landlord

            2. Given:
              "The occupier is currently reviewing whether to exercise the
              break option."

              Response:
              Decisions Ongoing With Occupier

            3. Given:
              "The expiry date recorded in the system is incorrect and must
              be corrected."

              Response:
              End Date Not Correct

            4. Given:
              "The amended lease changes the tenant break date to 1 June 2029."

              Response:
              New Break Date

            5. Given:
              "The client has instructed that the arrangement end date be
              changed to 31 December 2030."

              Response:
              New Date Given By Client

            6. Given:
              "The next rent review date has been revised to 15 March 2028."

              Response:
              New Rent Review Date

            7. Given:
              "The lease contains a future break option, but the document does
              not confirm that the tenant is considering or exercising it."

              Response:
              To Be Revisited

            8. Given:
              "The tenant requires the landlord's consent before assigning the
              lease, but no assignment request has been submitted."

              Response:
              To Be Revisited

            9. Given:
              "The arrangement may end if the landlord's superior lease ends,
              but the date of that event is not confirmed."

              Response:
              To Be Revisited

            Return exactly one allowed category.

        - role: user
          content: "{prompt}"

    Arrangement_End_Action_Status_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the status of the expected arrangement-end action.

            Business definition:
            The status of the expected action, for example actioned, to expire, future action, or not actioned.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY one allowed category.

            Allowed categories:
              - Actioned
              - Future Action
              - Not Actioned
              - To Expire

            Assess the status as of the assessment date supplied in the context. If no assessment date is supplied, use the current date.

            #### Classification Rules:

            - Actioned:
              Select when the relevant arrangement-end event or action has already occurred or been completed.

              Examples:
                - termination or break notice was validly served
                - renewal, extension, surrender, amendment, or revised end date was executed
                - a fixed arrangement ended automatically and its end date has passed
                - the initial term ended and the documented continuation or rollover has already taken effect

              Do not select Actioned for a historical event when the lease is now active in a later renewal period. Assess the next relevant action for the current arrangement.

            - Future Action:
              Select when a specific future decision, notice, review, option, response, or other affirmative action is required or expected.

              Examples:
                - a future break option requires the tenant to decide and serve notice
                - a renewal or extension option requires a future election
                - the lease continues automatically unless future termination notice is served
                - a landlord or occupier response is awaited
                - the arrangement is marked To Be Revisited
                - a future end date requires review or instructions
                - a future amendment, surrender, termination, or date update remains pending

              Future Action does not require wording such as "under consideration" when the contract itself clearly requires a future decision or action at the selected future-action date.

            - Not Actioned:
              Select only when a required or intended action was not completed and the applicable deadline has passed.

              Examples:
                - required notice was not served by the deadline
                - an instructed update remains overdue
                - a scheduled action was missed or not implemented

              Do not select Not Actioned merely because an optional break or renewal right was not exercised.

            - To Expire:
              Select when the current arrangement is simply running toward its operative fixed expiry or automatic end date and no specific future decision, option, notice, review, or pending action is tied to that date.

              Examples:
                - a fixed-term lease will end automatically without notice
                - the current term has a stated expiry and no break, renewal election, or identified decision applies
                - no arrangement-end action is required before natural expiry

              Do not select To Expire when:
                - a break option requires a future decision
                - a renewal or extension option requires an election
                - future notice is required to prevent automatic continuation
                - the future action type is Decisions Ongoing, New Break Date, New Date Given By Client, New Rent Review Date, or To Be Revisited
                - a follow-up or review is required

            #### Decision Priority:

              1. Actioned, if the relevant action or end event is completed.
              2. Not Actioned, if a required action is explicitly overdue or missed.
              3. Future Action, if a future decision, notice, option, review, or follow-up is required.
              4. To Expire, if the arrangement will naturally end without another action.

            #### Current-Period Rules:

            - Use the latest executed amendment, allonge, rider, notice, or workflow update.
            - Assess the current operative term, not an expired historical term.
            - If a prior term automatically renewed and the arrangement is now active in a later period, classify the next relevant action for the later period.
            - A past automatic expiry is Actioned only when that arrangement actually ended.
            - If the arrangement continued into a new period, do not mark the historical expiry as Actioned.
            - For non-lease agreements, apply the same rules only when the supplied context treats the agreement's termination or review as the expected arrangement-end action.

            #### Examples:

            Given:
              "The fixed sublease ended automatically on 31 May 2026, and that date has passed."

            Response:
              Actioned

            Given:
              "The tenant may exercise a break option on 30 March 2029 by serving twelve months' notice."

            Response:
              Future Action

            Given:
              "The lease continues automatically unless the tenant serves notice before the future deadline."

            Response:
              Future Action

            Given:
              "The notice deadline passed, but the required notice was not served."

            Response:
              Not Actioned

            Given:
              "The fixed sublease ends automatically on 31 July 2029 without notice or renewal rights."

            Response:
              To Expire

            Given:
              "The 2025 term end passed and the lease automatically continued through 2030."

            Response:
              To Expire

            Return exactly one allowed category.

        - role: user
          content: "{prompt}"

    Arrangement_End_Future_Action_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Extract the Arrangement End Future Action Date.

            Definition:
            The date on or by which the expected arrangement-end action is anticipated.

            Do not explain.
            Do not use quotes.
            Return ONLY one date in MM/DD/YYYY format.
            If no reliable date exists, return:
            i dont know

            #### Date Selection Rules:

            - Extract the date directly connected to the identified future action type.

            - Use this priority:
              1. Date explicitly supplied by the client, notice, workflow note, or latest amendment.
              2. Effective date of a revised or newly introduced break option.
              3. Date of a specifically scheduled landlord, occupier, renewal, rent-review, or follow-up action.
              4. Next applicable break date.
              5. Next applicable end date of the current contractual period.

            - For "To Be Revisited", use the explicit revisit date. If no separate revisit date is stated, use the next applicable break date or current contractual period-end date.

            - For "New Break Date", return the effective break date, not the notice deadline.

            - Do not return a notice deadline unless the context explicitly identifies the notice deadline itself as the expected action date.

            #### Current-Term and Renewal Rules:

            - Determine the current applicable contractual period using the assessment date supplied in the context. If no assessment date is supplied, use the current date.

            - Do not return a term-end or break date that has already passed unless the arrangement has ended and the action status is "Actioned".

            - If a fixed term automatically renews and the prior term-end date has passed with no documented termination, calculate the end of the current renewed period using the stated renewal length.

            - Example:
              A term ended on 09/30/2025 and automatically renewed for five years with no termination evidence.
              Return:
              09/30/2030

            - Do not assume automatic renewal if the document states that renewal requires an affirmative option, signed amendment, mutual agreement, or another unresolved condition.

            - When the current notice deadline has passed without documented termination and the lease automatically continues, use the end date of the resulting renewal period.

            - When the initial term-end date is still in the future, use that date rather than a later automatic-extension end date, unless an earlier applicable break or scheduled action date exists.

            #### Amendments and Conflicting Dates:

            - Use the latest executed amendment, allonge, rider, or addendum over the original lease.

            - Ignore dates that are expressly cancelled, superseded, corrected, treated as not sent, or replaced.

            - Prefer the detailed operative clause over a conflicting summary.

            - If an amendment introduces a whole-arrangement break date earlier than the renewed expiry, use the earlier break date.

            - Do not use a break applying only to part of the premises as the end date for the entire arrangement.

            #### Calculation Rules:

            - A date may be calculated only from a clear commencement or prior term-end date and an unambiguous term or renewal period.

            - Preserve the contractual day and month when calculating successive periods.

            - If a term begins on the first day of a month, the corresponding full-year term normally ends on the final day of the preceding month.

            - Use the exact date printed in the signed operative clause even if a mathematical calculation would produce a date one day later, unless the date is an obvious typographical error and the intended date is unambiguous.

            - Preserve the four-digit year exactly. Never convert a year beginning with 20 into a year beginning with 19.

            #### Conditional Dates:

            - Use a conditional break date only when the future action is specifically tied to monitoring, reviewing, or exercising that break.

            - Do not use an earliest possible termination date, an unresolved event date, or a hypothetical date when no related action is identified.

            - If the date depends on an unresolved event and cannot be determined reliably, return:
              i dont know

            #### Do Not Extract:

            - commencement date
            - signature or execution date
            - rent commencement date
            - payment date
            - notice deadline, unless explicitly required as the action date
            - an expired historical term-end date, unless status is "Actioned"
            - a later renewal expiry when an earlier current term-end or whole-arrangement break date applies
            - dates from templates, examples, unrelated agreements, headers, or footers
            - a services-contract end date when the document does not contain a property arrangement

            #### Validation:

            - Confirm that the selected date is applicable to the current arrangement.
            - Confirm that day, month, and year come from the same date.
            - Confirm that the date is valid and uses a four-digit year.
            - If multiple dates remain equally plausible, return:
              i dont know

            #### Examples:

            Given:
              "The amended break option is effective on 1 July 2029, subject to twelve months' notice."

            Response:
              07/01/2029

            Given:
              "The initial term ends on 31 July 2032 and then automatically continues through 31 July 2037."

            Response:
              07/31/2032

            Given:
              "The term ended on 30 April 2024 and continues for successive five-year periods. No termination is documented."

            Response:
              04/30/2029

            Given:
              "The lease ended automatically on 31 May 2026 and the action status is Actioned."

            Response:
              05/31/2026

            Given:
              "Either party may terminate on 90 days' notice, but no notice has been issued."

            Response:
              i dont know

        - role: user
          content: "{prompt}"

    Arrangement_End_Action_Status_Reason_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Identify the reason why the Arrangement End Action currently carries
            its status.

            Classify the Arrangement End Action Status Reason Type strictly into
            one of the allowed categories.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY the category name.

            Allowed categories:
              - Binding MSA With The Competitor
              - Building Redevelopment
              - Conflict/Cannot Pitch
              - Contract Terms
              - Declined By CBRE
              - Declined By Client
              - Demand Followed By Competitor
              - Direct Deal/Business Conducted In-House
              - Duplicate/Error
              - Existing Relationships/Agents Appointed
              - Late To Pursue
              - No Decision
              - No Landlord Opportunity
              - Occupier Has Already Transacted Elsewhere
              - Occupier Has Renewed/Regeared
              - Occupier No Longer Exists
              - Opportunity/ Space Is Too Small
              - Unreachable
              - Wrong Property Options
              - Wrong Team (Skills/Resources)

            General Instructions:

              - Identify the reason for the current Arrangement End Action Status,
                not merely a topic mentioned in the lease.
              - Use explicit evidence from the document or supplied workflow context.
              - Do not infer internal CBRE, client, competitor, brokerage, or workflow
                information from ordinary lease clauses.
              - Do not classify based only on a keyword.
              - Consider the complete context in which the wording appears.
              - Distinguish the reason for an arrangement-end status from the
                contractual event or date itself.
              - Give priority to specific workflow notes, client instructions,
                amendments, notices, and negotiated clauses over generic lease
                terms and standard conditions.
              - If no supported reason can be identified, select No Decision.

            Classification Rules:

            - Binding MSA With The Competitor
              - Select only when the document or supplied context explicitly states
                that the client or occupier is contractually committed to a
                competing provider under a binding master services agreement or
                equivalent arrangement.
              - Do not infer this category merely because a competitor is mentioned.

            - Building Redevelopment
              - Select only when redevelopment, demolition, reconstruction, major
                refurbishment, conversion, or redevelopment-related vacancy is the
                stated reason for the arrangement-end status.
              - Relevant evidence may include:
                  - building scheduled for demolition
                  - redevelopment project confirmed
                  - premises must be vacated for redevelopment
                  - major reconstruction requires lease termination
                  - landlord requires possession for redevelopment
              - Do not select merely because:
                  - the building may be sold
                  - ownership may change
                  - a leasehold or superior lease may expire
                  - alterations or fit-out works are planned
                  - maintenance or repairs are required
                  - the lease contains a redevelopment clause that has not been invoked

            - Conflict/Cannot Pitch
              - Select only when explicit workflow information confirms that CBRE
                cannot pursue the matter because of a conflict of interest,
                compliance restriction, policy restriction, or legal limitation.
              - Do not infer this category from lease restrictions.

            - Contract Terms
              - Select when the arrangement-end status results from an express
                contractual provision, legal term, financial term, commercial term,
                or negotiated lease condition.
              - This includes:
                  - contractual break option
                  - contractual termination right
                  - superior lease or leasehold expiry affecting the arrangement
                  - automatic termination provision
                  - unacceptable lease terms
                  - unacceptable financial or commercial terms
                  - failure to agree contractual terms
                  - contractual restriction preventing continuation
                  - condition affecting the validity or continuation of the lease
              - A term does not need to be described as unacceptable if the status
                results directly from the operation of that contractual term.
              - Do not select merely because every lease contains contractual terms.
                The identified term must directly explain the arrangement-end status.

            - Declined By CBRE
              - Select only when explicit information confirms that CBRE decided
                not to proceed with, pursue, or accept the opportunity.

            - Declined By Client
              - Select only when explicit information confirms that the client
                rejected, declined, or decided not to proceed with the opportunity,
                proposal, renewal, relocation, or transaction.
              - Do not infer a decline from silence or an unexercised option.

            - Demand Followed By Competitor
              - Select only when explicit information confirms that a competing
                provider pursued or is pursuing the requirement or opportunity.

            - Direct Deal/Business Conducted In-House
              - Select only when explicit information confirms that the transaction
                was handled directly between the relevant parties or internally,
                without the expected brokerage or advisory involvement.
              - Do not select merely because a lease is directly between a landlord
                and a tenant. Most leases are written that way.

            - Duplicate/Error
              - Select when the current status results from:
                  - a duplicate record
                  - an incorrect record
                  - a data-entry error
                  - a date-extraction error
                  - an incorrect tenant or property match
                  - another confirmed administrative error
              - Do not select merely because the document contains inconsistent
                wording unless the supplied context confirms that the record is an error.

            - Existing Relationships/Agents Appointed
              - Select only when explicit information confirms that another broker,
                advisor, agent, or established relationship controls or has been
                appointed to manage the opportunity.

            - Late To Pursue
              - Select only when explicit information confirms that the opportunity
                was identified too late, a relevant deadline was missed, or there
                was insufficient time to pursue the opportunity.

            - No Decision
              - Select when:
                  - no final decision has been made
                  - a contractual option exists but no decision to exercise it is shown
                  - the document is silent about the business reason
                  - the reason for the current status cannot be reliably determined
                  - the available evidence is insufficient or conflicting
                  - none of the other categories is supported by explicit evidence
              - Do not treat No Decision as evidence that negotiations are ongoing.

            - No Landlord Opportunity
              - Select only when explicit information confirms that no viable
                landlord-side opportunity exists.
              - Do not infer this category merely because the landlord cannot renew,
                the property may be sold, or a superior interest may expire.

            - Occupier Has Already Transacted Elsewhere
              - Select only when explicit information confirms that the occupier
                completed, signed, agreed, or committed to a transaction at another
                property or location.
              - Mentioning a possible or alternative location is not sufficient.

            - Occupier Has Renewed/Regeared
              - Select only when the occupier has completed or formally agreed:
                  - a lease renewal
                  - a lease extension
                  - a regear
                  - a restructuring of an existing lease
              - Do not select merely because:
                  - the lease contains an extension option
                  - automatic continuation is possible
                  - renewal is being considered
                  - the document is a new lease
                  - the lease contains a rent review or break option

            - Occupier No Longer Exists
              - Select only when explicit information confirms that the occupier:
                  - has ceased trading
                  - has been dissolved
                  - has been liquidated
                  - no longer legally exists
              - A landlord's bankruptcy, insolvency, or administration does not mean
                that the occupier no longer exists.

            - Opportunity/ Space Is Too Small
              - Select only when explicit information confirms that the property,
                requirement, transaction, or opportunity falls below a relevant size
                threshold or is too small to pursue.
              - Do not classify based only on the numerical floor area.

            - Unreachable
              - Select only when explicit workflow information confirms that attempts
                were made to contact the client, occupier, landlord, or relevant
                contact and those attempts were unsuccessful.

            - Wrong Property Options
              - Select only when explicit information confirms that the proposed or
                available properties do not meet the occupier's requirements.
              - Do not infer this category merely because a tenant is considering
                another property.

            - Wrong Team (Skills/Resources)
              - Select only when explicit information confirms that the matter cannot
                be pursued because the responsible team lacks the necessary skills,
                expertise, capacity, or resources.

            Interpretation and Priority Rules:

              - Building Redevelopment requires evidence of actual or planned
                redevelopment. Do not infer redevelopment from land ownership,
                leasehold expiry, sale, transfer, maintenance, or refurbishment
                wording alone.
              - Contract Terms applies when a break, termination, expiry, condition,
                or other contractual mechanism directly causes the status.
              - Occupier Has Renewed/Regeared requires a completed or formally agreed
                renewal or regear, not merely a renewal right or extension clause.
              - Occupier Has Already Transacted Elsewhere requires evidence of a
                completed or committed transaction, not merely consideration of an
                alternative location.
              - Direct Deal/Business Conducted In-House requires evidence about how
                the transaction was handled. A landlord-to-tenant lease does not by
                itself prove an in-house transaction.
              - Categories involving CBRE, competitors, agents, internal teams,
                unreachable contacts, or client decisions require explicit workflow
                evidence. Do not derive them from ordinary lease text.
              - If the document only contains contractual lease provisions and no
                workflow explanation, choose Contract Terms only when a contractual
                provision clearly explains the status.
              - If the reason still cannot be identified reliably, choose No Decision.
              - Return exactly one allowed category.

            Examples:

            1. Given:
              "The lease will terminate if the superior lease expires, as provided
              under clause 15."

              Response:
              Contract Terms

            2. Given:
              "The landlord requires possession because the building is scheduled
              for demolition and redevelopment."

              Response:
              Building Redevelopment

            3. Given:
              "The lease includes a tenant break option, but the tenant has not
              decided whether to exercise it."

              Response:
              No Decision

            4. Given:
              "The occupier signed a renewal agreement for a further five-year term."

              Response:
              Occupier Has Renewed/Regeared

            5. Given:
              "The occupier has completed a lease for an alternative property."

              Response:
              Occupier Has Already Transacted Elsewhere

            6. Given:
              "The tenant may consider an alternative property before the break
              option date, but no alternative transaction has been agreed."

              Response:
              No Decision

            7. Given:
              "CBRE cannot pursue the opportunity because of a confirmed conflict
              of interest."

              Response:
              Conflict/Cannot Pitch

            8. Given:
              "The transaction was negotiated and completed directly by the client
              without external brokerage involvement."

              Response:
              Direct Deal/Business Conducted In-House

            9. Given:
              "The current arrangement-end record was created twice."

              Response:
              Duplicate/Error

            10. Given:
              "The landlord may transfer its interest to a third party, but no
              redevelopment is described."

              Response:
              Contract Terms

        - role: user
          content: "{prompt}"