    Ref_Lease_Activity_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the nature of the leasing event recorded by the document.

            Do not explain.
            Do not use quotes.
            Respond with ONLY the category name.

            Allowed categories:
              - Expansion
              - New Lease
              - Owner Occupation
              - Pre-Lease
              - Renewal
              - Sale/Leaseback
              - Unknown

            #### Classification Rules:

            - Expansion:
              Select when the current transaction adds space to premises already leased or occupied by the same tenant.

              Indicators include:
                - additional premises, units, floors, or area
                - expansion space
                - increased leased area under an amendment
                - exercise of an expansion or right-of-first-offer provision

              Do not select Expansion merely because the tenant takes a large space, grows its business, or leases space at another property.

            - New Lease:
              Select when the document creates the tenant's initial lease of the premises and is not a renewal, expansion, pre-lease, owner occupation, or sale/leaseback.

              A sublease may still be New Lease for the activity field when it creates a new tenancy arrangement. The sublease structure is classified separately.

              Do not select New Lease merely because:
                - the document is newly signed
                - the document is titled Lease Agreement
                - an existing lease has been replaced or restated
                - the same tenant continues occupying the same premises

            - Owner Occupation:
              Select when the owner occupies or internally allocates its own property rather than leasing it to an independent third-party tenant.

              Indicators include:
                - the owner and occupier are the same legal entity
                - the agreement is an internal arrangement between divisions of the property owner
                - the document expressly describes owner-user occupation

            - Pre-Lease:
              Select when a specific property has been contractually leased before it is ready for normal occupation.

              Indicators include:
                - future construction or redevelopment
                - premises still under development
                - shell delivery or major landlord works scheduled after signing
                - final measurement, separation, fit-out, or handover will occur later
                - lease commencement or delivery is materially later than execution
                - build-to-suit or turnkey works must be completed before occupation

              Pre-Lease may apply to an existing building when the specific premises require substantial future construction, separation, redevelopment, or landlord fit-out before delivery.

              Do not select Pre-Lease merely because:
                - commencement is after signature
                - minor repairs or ordinary fit-out works remain
                - the document is a brokerage mandate, engagement letter, search instruction, or services agreement
                - no specific property has been selected

            - Renewal:
              Select when the current transaction extends, renews, replaces, restates, or continues an existing lease or occupation for the same tenant and premises.

              Indicators include:
                - extension of term
                - renewal or regear
                - exercise of a renewal option
                - an allonge, amendment, or replacement lease continuing the existing occupation
                - an earlier lease is replaced or lapses when the new agreement starts
                - the tenant continues using the premises without a new handover
                - a termination notice is cancelled and the existing lease is extended

              Classify the latest operative transaction. A newly executed replacement lease is Renewal when it continues an existing lease for the same tenant and premises.

            - Sale/Leaseback:
              Select only when the owner sells the property and leases it back from the purchaser as part of the same transaction.

            - Unknown:
              Select when no leasing event is completed or the activity cannot be reliably determined.

              Use Unknown for:
                - brokerage mandates
                - engagement letters
                - main work orders
                - property-search instructions
                - services agreements
                - blank transaction templates
                - documents discussing alternative possible transactions without confirming one
                - documents with no selected property or executed lease event

            #### Evidence Priority:

              1. Latest executed amendment, allonge, rider, or addendum
              2. Operative transaction and duration clauses
              3. Recitals explaining prior and current lease arrangements
              4. Lease summary
              5. Historical references, templates, or standard terms

            Use the latest operative leasing event, not an earlier historical transaction mentioned in the document.

            #### Examples:

            Given:
              "First Amendment adding 5,000 square feet of Expansion Space."

            Response:
              Expansion

            Given:
              "This lease creates the tenant's first tenancy of the completed premises."

            Response:
              New Lease

            Given:
              "The existing lease is replaced by this agreement, and the tenant's use continues without a new handover."

            Response:
              Renewal

            Given:
              "The lease was signed before shell delivery, landlord fit-out, final measurement, and future handover."

            Response:
              Pre-Lease

            Given:
              "The parties cancelled the termination notice and extended the existing lease for five years."

            Response:
              Renewal

            Given:
              "The owner internally allocates office space to another department of the same legal entity."

            Response:
              Owner Occupation

            Given:
              "CBRE is appointed to search for potential premises, but no property or lease has been agreed."

            Response:
              Unknown

            Given:
              "The seller transfers the property and leases it back from the purchaser."

            Response:
              Sale/Leaseback

            Return exactly one allowed category.

        - role: user
          content: "{prompt}"

    Ref_Lease_Arrangement_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Identify the lease arrangement type from the provided context.

            Respond ONLY with one of the following, exactly as written:

              "Assignment"
              "Direct"
              "Flex Lease"
              "SubLease"
              "Unknown"

            **Rules**

              - "Assignment" → Applies when an existing tenant transfers its lease rights and obligations to another party. Look for terms such as "Assignment of Lease", "Assignee", "Assignor", or lease transfer language.

              - "Direct" → Applies when the lease is executed directly between the Landlord and Tenant without any sublease or assignment arrangement.

              - "Flex Lease" → Applies when the premises, lease structure, occupancy arrangement, or usage is described as flexible, shared, coworking, executive suite, managed office, or flexible workspace.

              - "SubLease" → Applies when a tenant (Sublessor) leases all or part of the premises to another party (Subtenant). Look for terms such as "Sublease Agreement", "Subtenant", "Sublessor", or "Subleased Premises".

              - "Unknown" → Applies when none of the above categories can be clearly determined from the lease document.

            **Exclusions**

              - Do not classify an Assignment as a SubLease.
              - Do not classify a standard Landlord-Tenant lease as a SubLease.
              - Do not infer a Flex Lease unless the document contains clear indicators of a flexible occupancy structure.
              - If the lease arrangement type cannot be confidently identified, respond with "Unknown".
              - Do not include quotes, explanations, or additional text.

            ####

            Examples:

            1. Given:
              "Assignment and Assumption of Lease Agreement between Assignor and Assignee"

              Response:
              Assignment

            2. Given:
              "Lease Agreement entered into by and between Landlord and Tenant"

              Response:
              Direct

            3. Given:
              "Sublease Agreement between Tenant and Subtenant for a portion of the Premises"

              Response:
              SubLease

            4. Given:
              "Flexible office membership agreement for shared workspace occupancy"

              Response:
              Flex Lease

            5. Given:
              "Insufficient information to determine the lease arrangement"

              Response:
              Unknown

            ####

        - role: user
          content: "{prompt}"

      
    Total_Leased_Space_Estimated_F:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            Classify the recorded Total Leased Space as either "Actual", "Assumed", or "Unknown" based on the lease agreement language and supporting measurement evidence.

            Business definition:
            Flag indicating that the recorded total leased space is approximate rather than a measured, contractually fixed figure.

            Do not explain.
            Do not use quotes.
            Respond with ONLY the category name.

            Allowed categories:
              - "Actual"
              - "Assumed"
              - "Unknown"

            #### Classification Rules:

            - "Actual":
              Select "Actual" only when the recorded Total Leased Space is presented as a definite, contractually fixed or verified measurement.

              Indicators include:
                - The area is stated as measured, surveyed, verified, certified, final, or exact.
                - The area is supported by a final or definitive measurement report or certificate.
                - The operative lease or latest amendment replaces an earlier approximate area with a precise measured area.
                - A specific numerical value is stated without approximate or provisional qualifier language.
                - A specific negotiated lease provision states a definite area and overrides a conflicting generic or standard provision.

              Do not classify the area as "Actual" merely because:
                - The value contains decimals.
                - The value is used in a rent calculation.
                - A measurement certificate is attached.
                - The lease contains a specific numerical area.

              If the operative lease still describes the area as approximate, estimated, provisional, subject to remeasurement, or subject to final confirmation, classify it as "Assumed" even when the value contains decimals or is supported by a measurement document.

            - "Assumed":
              Select "Assumed" when the recorded Total Leased Space is approximate, estimated, provisional, capped, rounded, derived from plans, or subject to later measurement or confirmation.

              Indicators include:
                - "approximately"
                - "approx."
                - "circa"
                - "ca."
                - "estimated"
                - "assumed"
                - "roughly"
                - "about"
                - "maximum" or "up to"
                - "provisional measurement"
                - "subject to final measurement"
                - "to be remeasured"
                - "the actual area may differ"
                - rent or service charges will be adjusted after final measurement
                - the measurement was prepared from drawings and was not verified on site
                - the recorded total is rounded from more precise component or measurement values

              Approximate qualifier language in the operative lease takes priority over:
                - decimal precision
                - rental calculations
                - area schedules
                - floor plans
                - supporting measurement certificates

              If any component included in the recorded Total Leased Space is approximate and the total is calculated from those components, classify the total as "Assumed".

            - "Unknown":
              Select "Unknown" when:
                - No Total Leased Space value is stated or reliably derivable.
                - The document is not a lease or property arrangement and contains only search criteria, target space, example areas, templates, or future requirements.
                - An area rate such as rent per m² or a fee per m² is present, but the total leased area is not stated.
                - The available values relate only to example properties, potential properties, gross site area, plot size, or non-leased space.
                - The document contains conflicting area values and does not provide enough evidence to identify the controlling value.

            #### Evidence Priority:

            Apply the following priority when clauses conflict:

              1. Latest executed amendment, allonge, rider, or addendum
              2. Specific negotiated lease provision
              3. Operative clause describing the demised premises
              4. Final or definitive measurement certificate
              5. Lease summary or commercial schedule
              6. General conditions, standard wording, drawings, examples, or templates

            Always classify the status of the recorded Total Leased Space selected from the highest-priority controlling source.

            #### Examples:

            1. Given:
              "The Premises contain approximately 5,000 rentable square feet."

              Response:
              Assumed

            2. Given:
              "The Premises are measured at 5,000 rentable square feet."

              Response:
              Actual

            3. Given:
              "Suite 100 contains 3,500 square feet, exact dimensions per final survey."

              Response:
              Actual

            4. Given:
              "The estimated space is about 4,200 square feet."

              Response:
              Assumed

            5. Given:
              "The premises comprise ca. 1,001.08 m² VVO according to the attached measurement certificate."

              Response:
              Assumed

            6. Given:
              "The current area is based on a provisional measurement certificate. A final measurement will be completed after delivery."

              Response:
              Assumed

            7. Given:
              "The premises comprise 1,130.98 m² VVO according to the definitive Type A measurement certificate. This amendment replaces the previous approximate area."

              Response:
              Actual

            8. Given:
              "The premises comprise a maximum of 10 m²."

              Response:
              Assumed

            9. Given:
              "The rent is €200 per m², but the total leased area is not stated."

              Response:
              Unknown

            10. Given:
              "The tenant is seeking premises of approximately 800–900 m²."

              Response:
              Unknown

            11. Given:
              "Office space: ca. 1,226 m². Archive space: ca. 353.8 m²."

              Response:
              Assumed

            12. Given:
              "The specific negotiated clause defines the leased equipment area as 15 m² without qualification. A standard appendix separately refers to 12 m²."

              Response:
              Actual
        - role: user
          content: "{prompt}"

