            - "Business Growth"
              - The lease is driven by expansion or growth of the business.
              - Look for references to expansion, increased headcount, additional space requirements, growing operations, business expansion, or increased capacity.

            - "Downsizing"
              - The lease is driven by a reduction in occupied space or business footprint.
              - Look for references to reducing premises size, consolidation, cost reduction, footprint reduction, or occupancy reduction.

            - "New Establishment"
              - The lease establishes a new business location, office, branch, facility, or operation.
              - Look for references to opening a new location, startup operations, first office, new branch, or new facility.

            - "Relocation"
              - The lease involves moving operations from one location to another.
              - Look for relocation, move, transfer of premises, replacement premises, or moving business operations.

            - "Unknown"
              - Use only when the reason for the lease arrangement cannot be clearly determined from the lease document.

