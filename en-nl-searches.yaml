          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the number of free rent months, free rent period, rent abatement period, rent holiday, concession period, promotional free rent, or months of rent forgiveness. If not found, respond "i dont know".

    Tenant-Improvement-Allowance-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Tenant Improvement Allowance, TI Allowance, Tenant Allowance, Construction Allowance, Build-Out Allowance, Improvement Allowance, Fit-Out Allowance, or Landlord Contribution. If not found, respond "i dont know".

    Ref-Tenant-Improvement-Allowance-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Tenant Improvement Allowance Unit of Measure. Look for per square foot, per square metre, lump sum allowance, fixed allowance amount, TI allowance rate. If not found, respond "i dont know".

    Option-Notes-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract lease option provisions including renewal options, extension options, rights of first refusal, rights of first offer, purchase options, expansion options, contraction rights, termination options, and tenant option clauses. If not found, respond "i dont know".

  ##  Lease-Comp-Details
  
    Lease-Comp-Details-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $unique:
        - =self.Total-Leased-Space-Search
        - =self.Ref-Total-Leased-Space-UOM-Search
        - =self.Ref-Lease-Activity-Type-Search
        - =self.Ref-Lease-Arrangement-Type-Search

    Total-Leased-Space-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find every explicit rentable area leased to the tenant in the original lease premises, including suite, floor, premises area statements, and explicit leased-area totals. Exclude building-wide area, other tenants' areas, amendments, expansion or option space, ROFO or ROFR space, temporary space, and areas not explicitly identified as the tenant's leased premises.

    Ref-Total-Leased-Space-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find the unit of measurement used for the tenant's total leased space, including square meters, square metres, sqm, sq. m., or m². Exclude numeric area amounts and unrelated building measurements.

    Ref-Lease-Activity-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find lease language identifying the transaction or activity type, including expansion, new lease, owner occupation, pre-lease, renewal, sale/leaseback, or language showing the type cannot be determined.

    Ref-Lease-Arrangement-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find lease language identifying the arrangement type, including assignment, direct landlord-to-tenant leasing, flex or shared workspace, or sublease. Include assignor, assignee, sublessor, subtenant, subleased premises, coworking, managed office, and flexible workspace terms.

    Parking-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $unique:
        - =self.Parking-Cost-Monthly-Search

    Parking-Cost-Monthly-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find the explicit monthly fee or rate charged for parking spaces assigned, reserved, or available to the tenant. Include the amount and billing period. Exclude annual, daily, weekly, reimbursement, validation, aggregate, visitor, and unrelated parking charges.


