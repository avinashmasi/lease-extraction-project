kind: Ontology/v2
name: en-nl-searches

namespaces:

  self:

    Contacts-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $unique:
        - =self.Contact-Display-Name-Search
        - =self.First-Name-Search
        - =self.Last-Name-Search
        - =self.Email-Search
        - =self.Full-Phone-Number-Search

    Contact-Display-Name-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Contact person, contact name, primary contact, authorized representative,
            representative, attention, attn, signatory, broker contact,
            property manager contact, notice contact, correspondence contact,
            company contact information

    First-Name-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            First name of contact person, representative name,
            authorized representative, primary contact,
            individual associated with company,
            execution page signatory

    Last-Name-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Last name of contact person, surname,
            representative name,
            authorized representative,
            company contact,
            execution page signatory

    Email-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Email address of contact person,
            company contact email,
            representative email,
            broker email,
            property manager email,
            notice contact email,
            contact information

    Full-Phone-Number-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Phone number of contact person,
            contact telephone number,
            mobile number,
            representative phone number,
            broker phone number,
            property manager phone number,
            notice contact phone number,
            contact information

  ##Terms

    Terms-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $unique:
        - =self.Arrangement-Start-Date-Search
        - =self.Arrangement-End-Date-Search
        - =self.Occupancy-Date-Search
        - =self.Lease-Term-Search
        - =self.Reserved-Parking-Spaces-Search
        - =self.Cost-per-Reserved-Parking-Space-Search
        - =self.Parking-Search-Context
        - =self.Property-Space-Quality-Type-Search
        - =self.Arrangement-Signed-Date-Search
        - =self.Asking-Rent-Monthly-Search
        - =self.Asking-Rent-Yearly-Search
        - =self.Effective-Rent-Monthly-Search
        - =self.Effective-Rent-Yearly-Search
        - =self.Service-Charge-Per-Area-Value-Search
        - =self.Number-Of-Month-Free-Rent-Search
        - =self.Tenant-Improvement-Allowance-Search
        - =self.Option-Notes-Search

    Arrangement-Start-Date-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Lease Commencement Date / Start Date (Ingangsdatum/Aanvangsdatum van de huur) and format it as DD/MM/YYYY. If not found, respond "i dont know".

    Arrangement-End-Date-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Lease Expiration Date / End Date  (Einddatum/Expiratiedatum van de huur) and format it as DD/MM/YYYY. If not found, respond "i dont know".

    Occupancy-Date-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Occupation Date / Possession Date (Opleverdatum / datum van ingebruikname) and format it as DD/MM/YYYY. If not found, respond "i dont know".

    Lease-Term-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Lease term, lease duration, term length, initial term,
            fixed term, lease period, term of lease, number of months,
            number of years, duration of tenancy

    Reserved-Parking-Spaces-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Reserved parking spaces, parking stalls allocated,
            total parking spaces, number of reserved spaces,
            allocated parking, parking permits, covered parking spaces,
            assigned spaces

    Cost-per-Reserved-Parking-Space-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Cost per reserved parking space, fee per parking space,
            monthly parking fee, rate per reserved stall, parking charge,
            parking space rent, charge per space, price for each parking space

    Parking-Search-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Parking terms, parking fees, parking rental, reserved parking,
            parking spaces, parking cost, parking charges, cost per space,
            monthly parking rate, allocated parking, parking permit fee

    Property-Space-Quality-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the property space quality classification. Look for Class A, Class B, Class C, building classification, property class, office class, industrial class, or property grade. If not found, respond "i dont know".

    Arrangement-Signed-Date-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Arrangement Signed Date / Execution Date / Signature Date and format it as DD/MM/YYYY. Look for signed date, executed date, execution date, date signed, fully executed date, or agreement execution date. If not found, respond "i dont know".

    Asking-Rent-Monthly-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Monthly Asking Rent, Monthly Base Rent, Monthly Rental Amount, Monthly Rent Schedule, Advertised Monthly Rent, or Quoted Monthly Rent. If not found, respond "i dont know".

    Ref-Asking-Rent-Monthly-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Monthly Asking Rent Unit of Measure. Look for per month, per square foot per month, per square metre per month, monthly rental rate, PSF monthly, square meter monthly rent. If not found, respond "i dont know".

    Asking-Rent-Yearly-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Annual Asking Rent, Annual Base Rent, Annual Rental Amount, Yearly Rent, Annual Fixed Rent, or Annual Rent Schedule. If not found, respond "i dont know".

    Ref-Asking-Rent-Yearly-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Annual Asking Rent Unit of Measure. Look for per year, annual rental rate, per square foot per year, per square metre per year, annual PSF rate. If not found, respond "i dont know".

    Effective-Rent-Monthly-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Monthly Effective Rent, Net Effective Monthly Rent, Effective Monthly Rental Rate, Discounted Monthly Rent, or Effective Lease Rate. If not found, respond "i dont know".

    Ref-Effective-Rent-Monthly-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Monthly Effective Rent Unit of Measure. Look for per month, per square foot per month, per square metre per month, effective monthly rental rate. If not found, respond "i dont know".

    Effective-Rent-Yearly-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Annual Effective Rent, Net Effective Annual Rent, Effective Annual Rental Rate, Discounted Annual Rent, or Effective Lease Rate. If not found, respond "i dont know".

    Ref-Effective-Rent-Yearly-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Annual Effective Rent Unit of Measure. Look for per year, annual rental rate, per square foot per year, per square metre per year. If not found, respond "i dont know".

    Service-Charge-Per-Area-Value-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Service Charge, Operating Charge, CAM Charge, Common Area Maintenance Charge, Building Service Charge, Service Cost, Operating Expense Recovery, or Service Charge Rate per Area. If not found, respond "i dont know".

    Ref-Service-Charge-Per-Area-Value-Price-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Service Charge Unit of Measure. Look for per square foot per year, per square foot per month, per square metre per year, per square metre per month, annual service charge rate, monthly service charge rate. If not found, respond "i dont know".

    Number-Of-Month-Free-Rent-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the number of free rent months, free rent period, rent abatement period, rent holiday, concession period, promotional free rent, or months of rent forgiveness. If not found, respond "i dont know".

    Tenant-Improvement-Allowance-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Tenant Improvement Allowance, TI Allowance, Tenant Allowance, Construction Allowance, Build-Out Allowance, Improvement Allowance, Fit-Out Allowance, or Landlord Contribution. If not found, respond "i dont know".

    Ref-Tenant-Improvement-Allowance-UOM-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract the Tenant Improvement Allowance Unit of Measure. Look for per square foot, per square metre, lump sum allowance, fixed allowance amount, TI allowance rate. If not found, respond "i dont know".

    Option-Notes-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Extract lease option provisions including renewal options, extension options, rights of first refusal, rights of first offer, purchase options, expansion options, contraction rights, termination options, and tenant option clauses. If not found, respond "i dont know".

  ##  Lease-Comp-Details
  
    Lease-Comp-Details-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $unique:
        - =self.Total-Leased-Space-Search
        - =self.Ref-Lease-Activity-Type-Search
        - =self.Ref-Lease-Arrangement-Type-Search
        - =self.Total-Leased-Space-Estimated-F-Search
        - =self.Sublease-Search
        - =self.Lease-Arrangement-Reason-Type-Search
        - =self.Tenant-Status-Type-Search
        - =self.ACT-1954-Search
        - =self.Space-Condition-Type-Search
        - =self.Arrangement-End-Future-Action-Type-Search
        - =self.Arrangement-End-Action-Status-Type-Search
        - =self.Arrangement-End-Future-Action-Date-Search
        - =self.Arrangement-End-Action-Status-Reason-Type-Search

    Total-Leased-Space-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find every explicit rentable area leased to the tenant in the original lease premises, including suite, floor, premises area statements, and explicit leased-area totals. Exclude building-wide area, other tenants' areas, amendments, expansion or option space, ROFO or ROFR space, temporary space, and areas not explicitly identified as the tenant's leased premises.

    Ref-Lease-Activity-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find lease language identifying the transaction or activity type, including expansion, new lease, owner occupation, pre-lease, renewal, sale/leaseback, or language showing the type cannot be determined.

    Ref-Lease-Arrangement-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find lease language identifying the arrangement type, including assignment, direct landlord-to-tenant leasing, flex or shared workspace, or sublease. Include assignor, assignee, sublessor, subtenant, subleased premises, coworking, managed office, and flexible workspace terms.

    Total-Leased-Space-Estimated-F-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing whether the tenant's leased space is actual, measured, verified, assumed, estimated, approximate, or otherwise not definitively measured.

    Sublease-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language indicating whether the agreement is a sublease, including sublease agreement, subleased premises, subtenant, sublessor, or a tenant subleasing all or part of the premises. Exclude ordinary direct landlord-to-tenant lease language.

    Lease-Arrangement-Reason-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing the business reason for the lease arrangement, including business continuity, business growth, downsizing, new establishment, relocation, or statements showing the reason is unknown.

    Tenant-Status-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing the tenant's status, including expired, future occupancy, gone, moving, no longer a tenant, currently occupying, or other status indicators.

    ACT-1954-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language stating whether the tenancy is protected by or contracted out of the Landlord and Tenant Act 1954, including security of tenure, exclusion of sections 24-28, statutory declaration, or no security of tenure.

    Space-Condition-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing the condition in which the premises are delivered, including core and shell, shell, unfinished, fitted out, built out, turnkey, ready for occupancy, or condition and improvements to be agreed.

    Arrangement-End-Future-Action-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing a future action relating to the arrangement end, including decisions ongoing with landlord or occupier, an incorrect end date, a new break date, a new date given by the client, a new rent review date, or a matter to be revisited.

    Arrangement-End-Action-Status-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language describing the status of action relating to the arrangement end, including actioned, future action, not actioned, or an arrangement that is due to expire.

    Arrangement-End-Future-Action-Date-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find the specific date associated with an anticipated future arrangement-end action, such as a follow-up, review, landlord or occupier decision, break action, or rent review. Exclude commencement, execution, start, and ordinary lease expiry dates unless explicitly tied to the future action.

    Arrangement-End-Action-Status-Reason-Type-Search:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 12
          prompt: |
            Find language explaining the reason for the arrangement-end action status, including competitor commitment, redevelopment, conflict, contract terms, declined by CBRE or client, competitor demand, direct deal, duplicate or error, existing agent, late pursuit, no decision, no landlord opportunity, transaction elsewhere, renewal or regearing, occupier no longer existing, space too small, unreachable, wrong property options, or wrong team resources.

  ##  Floor-Suite
    Floor-Suite-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 25
          prompt: |
            tenant leased premises floor suite unit space size area,
            demised premises, premises schedule, floor schedule, suite schedule,
            unit schedule, floor-by-floor premises allocation, leased floor,
            rented floor, whole floor, partial floor, full floor, suite number,
            floor number, level designation, rent area, lettable area, rentable area,
            usable area, NEN 2580 measurement, space area, floor area,
            premises clause, amendment, relocation, surrender, renewal,
            expansion, contraction, premises exhibit, floor plan,
            tenant premises table, demised area by floor, unit allocation

  ##parking 
    Parking-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 25
          prompt: |
            tenant parking rights, parking allocation, parking schedule,
            car parking, van parking, truck parking, motorcycle parking,
            bicycle parking, EV parking, accessible parking, visitor parking,
            reserved parking, unreserved parking, tandem parking, designated parking,
            non-designated parking, covered parking, uncovered parking, indoor parking,
            outdoor parking, parking bay, parking space, parking fee, parking rent,
            parking charge, parking rate, monthly parking cost, annual parking cost,
            per space per month, per space per year, parking exhibit, parking appendix,
            amendment to parking, parking clause, tenant parking arrangement, parking rights schedule

