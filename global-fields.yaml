    # #################################
    # Options

    # Option-Auto-Renew-Or-Expiry-Notice
    #
    # The match operator is used since the UI requires only the 
    # specific label to be returned for some of the is-or attributes.
    # Using $match, is the key return value is "Renew" then only the 
    # Option-Auto-Renew-Notice is returned and vice versa for Expiry Notice.
    #
    # NOTE: If $match does not find a matching key, it will return an empty set.
    # This has been implemented this way due to a limitation of the UI.
    Option-Auto-Renew-Notice:
      type: Option-Auto-Renew-Notice
      kind: 
        Text: =global-fields/self.response_encoding
      reduction:
        $match:
          key: =self.is-auto-renew-or-expiry-notice
          Renew: =self.option-auto-renew-or-expiry-notice

    option-auto-renew-or-expiry-notice:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-options/self.Auto-Renew-Or-Expiry-Notice
          # warning: en-gb defaults to en-us

    is-auto-renew-or-expiry-notice:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-options/self.Is-Auto-Renew-Or-Expiry-Notice
          # warning: en-gb defaults to en-us

    # Option-Rent-Change-Index-Or-Market
    #
    # The match operator is used since the UI requires only the 
    # specific label to be returned for some of the is-or attributes.
    #
    # NOTE: If $match does not find a matching key, it will return an empty set.
    # This has been implemented this way due to a limitation of the UI.

    Option-Rent-Change-Index-Frequency:
      type: Option-Rent-Change-Index
      reduction:
        $match:
          key: =self.is-rent-change-index-or-market
          Index: =self.option-rent-change-index-or-market-frequency

    Option-Rent-Change-Market-Frequency:
      type: Option-Rent-Change-Market
      reduction:
        $match:
          key: =self.is-rent-change-index-or-market
          Market: =self.option-rent-change-index-or-market-frequency

    option-rent-change-index-or-market-frequency:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-options/self.Rent-Change-Index-Or-Market-Frequency
          # NOTE: goes to expenses
          # warning: en-gb defaults to en-us

    is-rent-change-index-or-market:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-options/self.Is-Rent-Change-Index-Or-Market
          # warning: en-gb defaults to en-us

    # Context
    # provide LLM-centric phrase of lease duration 
    # used in some completions
    Start:
      kind: 
        Text: =global-fields/self.response_encoding
      reduction:
        $precedence:
          - =self.Commencement-Date
          - $const: "Not Present"

    End:
      kind: 
        Text: =global-fields/self.response_encoding
      reduction:
        $precedence:
          - =self.Expiration-Date
          - $const: "Not Present"

    Term:
      kind: 
        Text: =global-fields/self.response_encoding
      reduction:
        $precedence:
          - =self.Lease-Term
          - $const: "Not Present"

    Lease-Context:
      kind: 
        Text: =global-fields/self.response_encoding
      reduction:
        $eval:
          start: =self.Start
          end: =self.End
          term: =self.Term
          expression: f"Lease Commencement Date is {start}\nLease Expiration Date is {end}\nLease Term is {term}"

    # Expenses
    # override auto-gen versions
    Expense-Base-Rent-Unit:
      type: Expense-Base-Rent
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-expenses-base-rent/self.Base-Rent-Unit
          en-us: =en-us-completions-expenses-base-rent/self.Base-Rent-Unit
          en-gb: =en-gb-completions-expenses-base-rent/self.Base-Rent-Unit

