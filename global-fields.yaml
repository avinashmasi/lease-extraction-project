kind: Ontology/v2
name: global-fields
namespaces:

  self:

    # jurisdiction
    jurisdiction:
      reduction:
        $precedence:
          - $get: jurisdiction
          - $const: en-us

    # validation
    validation:
      reduction:
        $precedence:
          - $get: validation
          - $const: fuzzy

    # response language
    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    # response encoding
    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =self.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    # #################################
    # Terms

    Arrangement_Start_Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Arrangement_Start_Date
