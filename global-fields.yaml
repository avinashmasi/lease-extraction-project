kind: Ontology/v2
name: global-fields
namespaces:

  self:

    # jurisdiction
    jurisdiction:
      reduction:
        $precedence:
          - $get: jurisdiction
          - $const: en-us

    # validation
    validation:
      reduction:
        $precedence:
          - $get: validation
          - $const: fuzzy

    # response language
    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    # response encoding
    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =self.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    # #################################
    # Property Terms

    Commencement-Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-key-dates/self.Commencement-Date
          en-us: =en-us-completions-key-dates/self.Commencement-Date
          en-gb: =en-gb-completions-key-dates/self.Commencement-Date

    Expiration-Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-key-dates/self.Expiration-Date
          en-us: =en-us-completions-key-dates/self.Expiration-Date
          en-gb: =en-gb-completions-key-dates/self.Expiration-Date

    Lease-Term:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-key-dates/self.Lease-Term
          en-us: =en-us-completions-key-dates/self.Lease-Term
          en-gb: =en-gb-completions-key-dates/self.Lease-Term

    Execution-Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-key-dates/self.Execution-Date
          en-us: =en-us-completions-key-dates/self.Execution-Date
          en-gb: =en-gb-completions-key-dates/self.Execution-Date

    Effective-Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-key-dates/self.Effective-Date
          en-us: =en-us-completions-key-dates/self.Effective-Date
          en-gb: =en-gb-completions-key-dates/self.Effective-Date

    Start-Reason:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-expenses/self.Start-Reason
          en-us: =en-us-completions-expenses/self.Start-Reason
          en-gb: =en-gb-completions-expenses/self.Start-Reason

    Is-Month-To-Month:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-expenses/self.Is-Month-To-Month
          en-us: =en-us-completions-expenses/self.Is-Month-To-Month
          en-gb: =en-gb-completions-expenses/self.Is-Month-To-Month

    Is-Auto-Renew:
      kind:
        Enum: [ "Yes", "No" ]
      reduction:
        $precedence:
          - $eval:
              value:
                $match:
                  key: =self.jurisdiction
                  default: =en-us-completions-expenses/self.Is-Auto-Renew
                  en-us: =en-us-completions-expenses/self.Is-Auto-Renew
                  en-gb: =en-gb-completions-expenses/self.Is-Auto-Renew
              expression: "'Yes' if value and value.lower() == 'yes' else 'No'"
          - $const: "No"

    Reconciliation-Required:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-us-completions-expenses/self.Is-Reconciliation-Required
          en-us: =en-us-completions-expenses/self.Is-Reconciliation-Required
          en-gb: =en-gb-completions-expenses/self.Is-Reconciliation-Required

