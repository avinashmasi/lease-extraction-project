          - role: user
            content: =global-context/self.ascii-formatted-clustered
          # ----------------------------------------------------------------
          # Final extraction enforcement
          # ----------------------------------------------------------------
          - role: system
            raw: true
            content: |
              FINAL COMPANY EXTRACTION ENFORCEMENT

              Extract only supported company or organization records.

              Apply COMPANY-ONLY VALIDATION before assigning any role. Never output a natural person
              or contact name. Reject candidates introduced by individual titles or consisting of
              personal initials and a surname unless a separate non-natural-person legal entity is
              expressly identified. A VAT number, tax number, personal address, email domain, or
              business activity does not convert a person into a company. If a landlord, tenant,
              manager, representative, or owner role is held only by a natural person, omit that
              company-role record.

              Resolve defined terms to legal company names. If a clause states that "the landlord
              acts as manager", treat management as part of the owner's role and do not create
              LANDLORD REP for the same company. If a third-party company handles landlord-side
              technical, operational, administrative, or lease matters, return that company as
              LANDLORD REP. Use LANDLORD REP PASSIVE only for a passive copy or notice recipient
              that does not handle the matter.

              When an Admin, Administration, Administrator, Manager, Property Manager,
              Managing Agent, service-desk, technical-reporting, maintenance-portal,
              or equivalent lease-specific section expressly names a separate company,
              return that company as LANDLORD REP when the tenant is instructed to
              contact, notify, report to, correspond with, or deal with that company
              regarding the lease, building, maintenance, technical failures,
              administration, or property-management matters.

              Parse the complete tenant representation chain. Every separate company in an operative
              nested "represented by" chain is TENANT REP, even when it is a holding, parent,
              shareholder, affiliate, group, or corporate-director company. Stop at natural persons.
              Do not confuse representation with guarantees, 403 statements, ownership lists, or
              change-of-control provisions.

              In a direct lease, return the operative landlord or current leaseholder company as
              LEGAL OWNER unless it is only an agent or a different controlling owner is
              established. In a sublease, return the identified underlying owner rather than the
              sublessor. Do not change current roles for an uncompleted or unnamed future transfer.

              In a sublease, after identifying the underlying owner as LEGAL
              OWNER, separately evaluate the operative sublessor. If the lease
              expressly makes the sublessor the manager, administrator, lease
              contact, or landlord-side handler, return the sublessor as
              LANDLORD REP.

              Independently inspect every executed signature block after identifying
              the direct parties. When a landlord signature block names a separate
              company after "By:", "represented by", or "acting through" and gives
              that company a corporate capacity such as Director, Managing Director,
              Manager, General Partner, or Attorney-in-Fact, return that separate
              company as LANDLORD REP. Continue through any nested corporate chain
              and stop when the chain reaches a natural person. Do not omit the
              corporate representative merely because LEGAL OWNER and TENANT have
              already been extracted.

              ================================================================
              SIGNATURE ENTRY SEPARATION
              ================================================================

              Evaluate every "By:" entry in an executed landlord signature block
              independently.

              A legal company named after "By:" with the capacity Director,
              Managing Director, Manager, General Partner, or Attorney-in-Fact
              is a LANDLORD REP when it is separate from the LEGAL OWNER.

              If a following "By:" entry contains a natural person, exclude only
              that person. Never delete or invalidate the preceding corporate
              representative.

              Example pattern:

              "Owner Company B.V.
               By: Corporate Director B.V.
               Title: Director
               By: J. Example
               Title: Director"

              Return Owner Company B.V. as LEGAL OWNER and Corporate Director
              B.V. as LANDLORD REP. Exclude J. Example.

              company_id is an internal MIQ/CIQ foreign key. Never use registration, VAT, tax,
              cadastral, establishment, or envelope numbers.

              Immediately before returning JSON, run the MANDATORY FINAL PERSON FILTER on every
              complete record. Delete any record whose company_name is a personal name, including an
              individual-title name, initials-plus-surname name, or given-name-plus-surname name
              without affirmative organization evidence. For example, a value such as "S.J. Dirks"
              must never be returned as company_name, even when the source calls that person Lessor
              and provides a VAT number. Remove role_desc, company_name, and company_id together for
              the rejected record. Do not transfer the deleted role to the tenant or another
              company, do not duplicate a remaining company, and do not preserve the original
              candidate count. Every surviving role-company pair must have independent controlling
              evidence. Then remove any LANDLORD REP or LANDLORD REP PASSIVE record whose company is
              the same legal entity as a LEGAL OWNER. Then compare normalized company names and
              remove any LANDLORD REP or LANDLORD REP PASSIVE record whose company is the same legal
              entity as a LEGAL OWNER. Complete the second-pass audit. Return valid JSON only.
          # ----------------------------------------------------------------
          # Final extraction request
          # ----------------------------------------------------------------
          - role: user
            raw: true
            content: |
              Extract every supported company-role record from the complete lease context.

              Return only Company-Table with equal-length arrays for role_desc, company_name, and
              company_id.

              Use only the seven supported role values. Keep only legal company or organization
              names. Reject natural persons both before role mapping and immediately before output.
              A title, initials-plus-surname pattern, residence, VAT number, tax number, passport
              detail, contact detail, or landlord role must never be accepted as legal-entity
              evidence. Delete the entire record when company_name is a person. Leave that role
              absent unless another company has independent controlling evidence for it. Never
              transfer a rejected LEGAL OWNER role to the tenant and never duplicate a remaining
              company to keep the same record count.

              Do not stop after LEGAL OWNER and TENANT. Inspect the summary, key-data page,
              administration clause, maintenance portal, service-desk details, signature blocks, and
              representation chains. Resolve separate landlord managers, including expressly
              appointed construction, building, maintenance, facilities, engineering, works, or
              service companies; corporate landlord directors; corporate managing companies; general
              partners; attorneys-in-fact; passive notice recipients; and every company in nested
              landlord-side and tenant-side representation chains. Self-management by the owner does
              not create a duplicate LANDLORD REP.

              Never return the same legal entity as both LEGAL OWNER and LANDLORD REP or LANDLORD
              REP PASSIVE. Representative roles require a separate company. Other multi-role cases
              require independent evidence.

              Leave company_id empty unless an explicit internal MIQ/CIQ account identifier is
              supplied for that exact company.