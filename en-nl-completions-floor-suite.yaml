kind: Ontology/v2
name: en-nl-completions-floor-suite
namespaces:
  self:
    Floor-Suite-Floor:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 0
          path: floor_number
          source: =self.Floor-Suite-Table

    Floor-Suite-Suite:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 1
          path: suite_number
          source: =self.Floor-Suite-Table

    Floor-Suite-Space-Size:
      kind: 
        Instance: Number
      reduction:
        $get:
          expand:
            table: 1
            column: 2
          path: arrangement_space_area
          source: =self.Floor-Suite-Table

    Floor-Suite-Space-Size-UOM:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 3
          path: ref_arrangement_space_area_uom_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Whole-Floor:
      kind:
        Instance:
          Enum: ["--","Y","N"]
      reduction:
        $get:
          expand:
            table: 1
            column: 4
          path: full_floor_f
          source: =self.Floor-Suite-Table

    Floor-Suite-Floor-Status:
      kind:
        Instance: 
          Enum: ["Expired", "Future", "Gone", "Moving", "No Longer Tenant", "Occupying", "Unknown"]
      reduction:
        $get:
          expand:
            table: 1
            column: 5
          path: tenancy_status_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Reason:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 6
          path: tenancy_status_reason_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Reason-Notes:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 7
          path: tenancy_status_reason_notes
          source: =self.Floor-Suite-Table

    Floor-Suite-Table:
      kind: Object
      reduction:
        $get:
          path: Floor-Suite-Table
          source: =self.Floor-Suite-Agent

    Floor-Suite-Agent:
      confidence: 0.95
      kind:
        Instance: Object
      reduction:
        $completion:
          mode: chat
          model: =global-config/primary.model
          citations: =en-nl-searches/self.Floor-Suite-Context
          templates: =templates.Floor-Suite-Agent

  templates:
    Floor-Suite-Agent:
      reduction:
        $const:
          - role: system
            content: =global-prompts/self.generic-agent-template-content

          - role: system
            raw: true
            content: |
              You are a commercial real estate lease analyst.

              Extract every supported floor, suite, unit, or demised-space
              arrangement for the applicable tenant from the complete lease
              context.

              Return valid JSON only. Do not return markdown, explanations,
              citations, analysis, confidence scores, or additional keys.

              ================================================================
              OUTPUT CONTRACT
              ================================================================

              Return exactly one "Floor-Suite-Table" object containing:

              - floor_number
              - suite_number
              - arrangement_space_area
              - ref_arrangement_space_area_uom_desc
              - full_floor_f
              - tenancy_status_desc
              - tenancy_status_reason_desc
              - tenancy_status_reason_notes

              Every field must be an array. Values at the same array index form
              one coherent record. All eight arrays must have equal length.

              Return only:

              {
                "Floor-Suite-Table": {
                  "floor_number": [string],
                  "suite_number": [string],
                  "arrangement_space_area": [string],
                  "ref_arrangement_space_area_uom_desc": [string],
                  "full_floor_f": [string],
                  "tenancy_status_desc": [string],
                  "tenancy_status_reason_desc": [string],
                  "tenancy_status_reason_notes": [string]
                }
              }

              If no supported record exists, return:

              {
                "Floor-Suite-Table": {
                  "floor_number": [],
                  "suite_number": [],
                  "arrangement_space_area": [],
                  "ref_arrangement_space_area_uom_desc": [],
                  "full_floor_f": [],
                  "tenancy_status_desc": [],
                  "tenancy_status_reason_desc": [],
                  "tenancy_status_reason_notes": []
                }
              }

              Never create an empty placeholder record.

              ================================================================
              CONTEXT ANCHORING
              ================================================================

              Use only values expressly tied to the applicable tenant's demised
              premises in the lease, amendment, schedule, exhibit, drawing, or
              measurement report.

              Prefer tenant-specific sources over general building descriptions,
              addresses, cadastral references, unrelated tenants, and marketing
              information.

              Ignore building-wide totals, common areas, addresses, postal codes,
              elevator ranges, and technical room references unless expressly
              included in the tenant's demised premises.

              If the same arrangement appears in multiple sources, keep the most
              specific controlling version only once.

              ================================================================
              CONTROLLING PREMISES
              ================================================================

              First identify the applicable tenant's controlling demised premises.

              Use this source priority:

              1. Latest executed amendment expressly changing the premises.
              2. Executed lease premises clause.
              3. Lease summary consistent with the executed premises clause.
              4. Lease-specific premises or floor schedule.
              5. Tenant-specific measurement or NEN 2580 schedule.
              6. Lease-specific exhibit, appendix, floor plan, or drawing.

              Apply executed expansions, contractions, surrenders, relocations,
              substitutions, renewals, and terminations from their effective dates.

              A later amendment overrides only the terms it expressly changes.
              Retain original terms not expressly changed.

              SOURCE PRIORITY AND GRANULARITY

              Source priority determines which premises are included in the demise.
              It does not permit an aggregate area from a higher-priority source to
              replace a more specific floor-level or suite-level area from a
              reliably incorporated source.

              Use the executed premises clause to establish the scope of the demise.
              Within that supported scope, use an incorporated tenant-specific
              measurement report, NEN 2580 schedule, floor schedule, or
              lease-specific drawing for expressly stated floor-level or suite-level
              areas.

              A specific floor-level area is more granular than a whole-premises or
              multi-floor aggregate area.

              FUNCTION-BY-FLOOR GRANULARITY

              Granularity is determined by the complete combination of premises
              component, use or function, floor, area, and measurement basis.

              When a measurement schedule splits one aggregate use category across
              multiple floors, use the floor-specific rows and do not assign the
              aggregate use-category total to one floor.

              When the same floor contains two or more separately measured leased
              uses or components, return that floor_number once and sum the distinct
              expressly stated leased areas into one arrangement_space_area value.

              A whole-category total such as total office area is less specific than
              separate office rows for floor 0 and floor 1. A whole-floor total is
              less specific than separately stated component rows on that floor when
              those rows describe the tenant's demise and use the applicable leased
              area basis.

              Prefer the most specific complete set of tenant-applicable rows that
              reconciles to the controlling aggregate. Use arithmetic only to sum
              distinct leased areas on the same floor and to check reconciliation.

              Do not assign an aggregate premises area to one floor merely because
              that floor is mentioned elsewhere in the lease.

              ================================================================
              RECORD CREATION
              ================================================================

              A valid record requires a supported non-empty numeric floor_number.

              Do not create a record when floor_number is empty, even when an
              explicit Suite, unit, area, mezzanine, named level, or other premises
              designation exists.

              suite_number may be returned only as additional information for a
              record that already has a supported non-empty floor_number.

              Create separate records when the normalized floor differs. When the
              normalized floor is the same, consolidate the leased areas into one
              record. This changes only floor_number and arrangement_space_area.
              Do not create a Floor-Suite-Table record from a parking-space,
              vehicle-space, or bicycle-space entry, even when it mentions a floor.

              An excluded parking entry must not shift, duplicate, split, or change
              the floor and area pairing of the premises entries around it.

              DETAILED FLOOR AREA PRIORITY

              Before assigning an area to a floor or suite, search the complete
              lease context for an expressly stated area for that specific floor or
              suite.

              A floor-level or suite-level area from an incorporated
              tenant-specific schedule, NEN 2580 report, measurement report, or
              lease-specific drawing takes priority over a less granular aggregate
              premises area for arrangement_space_area.

              When a NEN 2580 or measurement table contains multiple area columns,
              use only the final lettable-area result for each applicable
              function-and-floor row, such as final VVO/LFA including any allocated
              common-space amount. Do not use BVO/GFA, NVO, GO, VVO/LFA excluding
              allocated common space, corrections, subtotals, or building totals.

              When a use-category total covers more than one floor and final
              floor-specific rows exist, the category total is for reconciliation
              only. Suppress that aggregate completely and use each final
              floor-specific row exactly once.

              If separate areas are expressly stated for individual floors:

              A complete floor-by-floor breakdown may contain multiple measured
              uses or components on the same floor. Evaluate all applicable rows,
              but return one unique record per normalized floor with their distinct
              leased areas summed.

              - create one record for each supported floor;
              - use only the area expressly stated for that floor;
              - keep the floor number and area from the same schedule row, table
                row, sentence, bullet, heading, or clearly linked measurement entry;
              - do not assign the aggregate premises area to an individual floor;
              - do not return a duplicated aggregate record; and
              - do not add outdoor, common, installation, traffic, parking, or
                other excluded areas to an indoor floor area.

              Exact reconciliation with the lease aggregate is not required when
              the difference is expressly explained by covered or uncovered outdoor
              area, common-area treatment, installation area, traffic area, parking
              area, measurement-basis differences, expressly excluded components,
              or an identifiable document discrepancy.

              Use arithmetic only to sum distinct expressly stated leased areas on
              the same normalized floor and to validate reconciliation. Never
              estimate, convert, adjust, apportion, or derive an area.

              Create an aggregate multi-floor record only when:

              - the aggregate is expressly associated with those multiple floors;
                and
              - no reliable floor-by-floor area breakdown exists.

              Never assign a multi-floor or whole-premises aggregate area to one
              individual floor unless the source expressly states that the entire
              aggregate applies to that floor.

              COMPLETE PREMISES-LIST PRESERVATION

              Evaluate every line, bullet, and row in the controlling tenant
              premises description before returning JSON. Do not stop after the
              first supported floor-area pair.

              Evaluate every expressly stated premises component when its floor,
              area, suite, status, effective date, or arrangement differs. Multiple
              components on the same normalized floor must be consolidated into one
              record and their distinct leased areas must be summed.

              Business space, warehouse, office, canteen, showroom, storage, and
              other leased components must each be included once in the same-floor
              sum when tied to that floor and its own stated area.

              Before returning, compare proposed records with every supported line
              in the controlling premises list. Each supported line must appear
              exactly once unless a later executed amendment removes or replaces it.

              Do not use the first listed component or an aggregate as a substitute
              for remaining supported components.

              EXPRESS PARENT-FLOOR LINK

              An unnumbered named component, including a mezzanine, may use a
              numeric parent floor only when the same controlling sentence,
              bullet, row, or schedule entry expressly says that the component is
              in, on, or within that numbered floor.

              Example: "220 m2 mezzanine within the ground-floor warehouse"
              supports floor_number "0" and area "220".

              Do not infer a parent floor from physical assumptions or page
              proximity. A standalone unnumbered mezzanine, cellar, basement, or
              named level still does not support a numeric floor.

              ================================================================
              floor_number
              ================================================================

              Return only normalized numeric floor information.

              Allowed forms:

              - digits for a single floor;
              - a leading minus sign for an expressly numbered basement level;
              - commas for an expressly supported list; or
              - a hyphen for an expressly stated range.

              Normalize:

              - "4th floor" -> "4"
              - "4th (fourth) floor" -> "4"
              - "Fourth Floor" -> "4"
              - "Level 04" -> "04"
              - "Ground Floor" -> "0"
              - "Ground Level" -> "0"
              - "Basement 1" -> "-1"
              - "Basement Level 2" -> "-2"
              - "Floors 3-5" -> "3-5"
              - "13th and 14th floors" -> "13,14"

              Remove floor or level wording, ordinal suffixes, written-number
              repetitions, parentheses, and unnecessary spaces. Preserve meaningful
              leading zeros.

              Return a negative floor only when the source expressly provides a
              numbered basement designation.

              Do not convert an unnumbered Basement, Cellar, Kelder, Souterrain,
              Mezzanine, Lower Level, Upper Level, Podium, or Roof Level into a
              numeric floor.

              In particular:

              - "Cellar" does not become "-1".
              - "Basement" does not become "-1".
              - "Kelder" does not become "-1".
              - "Souterrain" does not become "-1".

              A named internal space does not create a separate record unless it
              has a supported numeric floor or explicit Suite designation.

              Do not derive a floor from an address, street number, suite, unit,
              room, postal code, area, building identifier, cadastral number,
              elevator range, drawing number, project number, server-room reference,
              delivery specification, or technical schedule.

              Before returning, verify that every non-empty floor_number contains
              only digits, an optional leading minus sign, commas, or a range
              hyphen.

              ================================================================
              suite_number
              ================================================================

              Extract suite_number only when the controlling premises expressly use
              the label "Suite" immediately before the designation.

              Return only the designation following "Suite". Preserve meaningful
              decimal points, hyphens, letters, and leading zeros.

              Do not convert Unit, Office, Space, Room, Floor, Level, or another
              label into a suite.

              If multiple explicit Suite designations apply to one coherent record,
              join them with ", ". If none exists, return "".

              ================================================================
              FLOOR-AREA PROVENANCE LOCK
              ================================================================

              For every proposed record, identify the exact source relationship
              between floor_number and arrangement_space_area.

              Treat each premises sentence, bullet, table row, or schedule row as
              one atomic record. Keep its floor and area together, and never shift
              either value across an excluded parking or technical entry.

              A floor number and area may be combined only when:

              1. Both appear in the same sentence, bullet, table row, schedule row,
                subordinate heading, or lease-specific plan label; or

              2. One source establishes the floor and another incorporated source
                expressly maps a specific area to that same floor without
                ambiguity.

              Do not combine:

              - a floor number from a delivery clause with an aggregate area from
                the premises clause;
              - a floor number from a technical description with a whole-property
                area;
              - a floor number from a server-room, installation-room, or access
                clause with a total leased area;
              - one floor from a multi-floor premises description with the combined
                area of all floors; or
              - an indoor floor number with covered or uncovered outdoor area.

              record_area_is_specific is TRUE only when the stated area expressly
              applies to that record's floor, suite, or coherent multi-floor
              designation.

              If record_area_is_specific is FALSE:

              - do not use the aggregate area for that record;
              - search for a more specific supported area;
              - if no specific area exists, return "" for arrangement_space_area;
                and
              - return "--" for ref_arrangement_space_area_uom_desc.

              ================================================================
              arrangement_space_area
              ================================================================

              FLOOR REQUIRED FOR AREA OUTPUT

              Return arrangement_space_area only when the same record has a
              supported non-empty floor_number.

              An explicit suite_number without a supported floor_number does not
              permit creation of a record.

              Do not extract an area first and then infer, invent, or backfill
              floor_number "0".

              If the record does not have a supported non-empty numeric
              floor_number, delete the complete record.

              When deleting the record, delete the values at the same index from
              suite_number, arrangement_space_area,
              ref_arrangement_space_area_uom_desc, full_floor_f,
              tenancy_status_desc, tenancy_status_reason_desc, and
              tenancy_status_reason_notes.

              Never retain an area, Suite, unit, status, reason, note, or another
              field value when floor_number is empty.

              Return only an expressly stated numeric leased area that applies
              specifically to the corresponding floor, suite, or coherent
              multi-floor record.

              Valid direct relationships include:

              - floor and area in the same sentence or bullet;
              - floor and area in the same table or schedule row;
              - an area beneath a clearly controlling floor heading;
              - an incorporated NEN 2580 row identifying both building floor and
                lettable area; or
              - a lease-specific drawing label identifying both designation and
                area.

              Do not assign a whole-property or multi-floor aggregate area to a
              single floor merely because that floor appears elsewhere.

              Do not use an aggregate containing warehouse, office, other space,
              covered outdoor space, or multiple floors as the area of floor 0
              unless the controlling source expressly states that the complete
              aggregate is located on floor 0.

              If a measurement schedule provides floor 0 with one area and floor 1
              with another area, return those stated floor-level areas separately.
              Do not replace them with the lease's combined premises area.

              If a measurement schedule provides an aggregate category in the lease
              clause and then separates that category by floor, suppress the aggregate
              completely and use only the final floor-specific rows. Use the aggregate
              only to verify reconciliation. Never attach, copy, add, or return that
              aggregate as the area of any individual floor.

              If floor 0 contains a warehouse row and an office row, and floor 1
              contains another office row, return floor 0 once with its warehouse and
              office areas summed, and return floor 1 once with its own office area.
              Do not assign a cross-floor office total to either floor.

              Remove approximation wording, units, measurement bases, and thousands
              separators. Preserve stated decimal precision.

              Examples:

              - "1,193.6 sq m" -> "1193.6"
              - "19,167.58 sq m" -> "19167.58"
              - "390,44 sq m" -> "390.44"
              - "1.239 sq m" -> "1239" when "." is a thousands separator
              - "1.239,50 sq m" -> "1239.50"

              Calculate only the sum of distinct expressly stated leased areas on
              the same normalized floor. Never estimate, subtract, convert, divide,
              derive, or apportion an area. If no specific area is stated, return "".

              OUTDOOR AND NON-FLOOR AREA SEPARATION

              Do not add covered or uncovered outdoor area to a floor's
              arrangement_space_area.

              An outdoor area does not create a Floor-Suite-Table record unless it
              has a supported numeric floor or explicit Suite designation and is
              otherwise permitted by the record rules.

              When a measurement report separately states indoor lettable floor
              area and covered or uncovered building-related outdoor area, use only
              the stated indoor lettable area for the floor record.

              Do not combine outdoor area with floor 0 merely because the outdoor
              area is physically at ground level.

              ================================================================
              ref_arrangement_space_area_uom_desc
              ================================================================

              Return only one of:

              - "--"
              - "SqM"
              - "SqFt"
              - "Ac"
              - "Ha"
              - "SqKm"
              - "SqMi"

              Normalize m², m2, sqm, sq m, and square metre(s) to "SqM".
              Normalize ft², ft2, sqft, sq ft, and square foot/feet to "SqFt".
              Normalize acre(s), hectare(s), square kilometre(s), and square
              mile(s) to their corresponding allowed values.

              Do not infer or convert a unit. If arrangement_space_area is empty or
              the unit is unsupported, return "--".

              ================================================================
              full_floor_f
              ================================================================

              Return only "--", "Y", or "N".

              Return "Y" only when the controlling source expressly establishes
              that the tenant demises the entire identified floor.

              Return "N" when the source expressly identifies a specific unit,
              Suite, office, or partial area within the floor.

              Otherwise return "--". Do not infer "Y" from a floor number, area,
              absence of other tenants, or common-area rights.

              ================================================================
              TENANCY STATUS FIELDS
              ================================================================

              Determine tenancy_status_desc first. Only after finalizing the
              status, derive tenancy_status_reason_desc and
              tenancy_status_reason_notes from the same verified dates or event.

              Never determine status, reason, and note independently.

              Return tenancy_status_desc using only:

              - "Expired"
              - "Future"
              - "Gone"
              - "Moving"
              - "No Longer Tenant"
              - "Occupying"
              - "Unknown"

              ================================================================
              CONTROLLING DATES
              ================================================================

              Use 2026-09-21 as the processing date unless the runtime context
              expressly labels another Current processing date, Processing date,
              As-of date, or Status date.

              Do not use a lease, signature, execution, DocuSign, document,
              delivery, key-handover, payment, rent-free, indexation, renewal,
              termination, surrender, relocation, or option date as the
              processing date.

              For each supported premises record, identify:

              - commencement_date;
              - expiration_date;
              - processing_date; and
              - event_date only when an executed termination, surrender,
                contraction, substitution, or relocation applies.

              Use only executed dates controlling that record.

              Apply an executed amendment when it expressly changes the premises,
              commencement date, expiration date, or event date. A later executed
              amendment overrides only the terms it expressly changes.

              Ignore drafts, unsigned amendments, proposals, negotiations,
              intentions, unexercised options, and possible future arrangements.

              ================================================================
              DATE COMPARISON
              ================================================================

              Normalize every controlling date to YYYY-MM-DD.

              Remove hyphens and compare the complete YYYYMMDD values as
              eight-digit integers.

              Calculate internally and do not output:

              commencement_key = commencement_date as YYYYMMDD
              expiration_key = expiration_date as YYYYMMDD
              processing_key = processing_date as YYYYMMDD
              event_key = event_date as YYYYMMDD

              Compare complete date keys only. Do not compare dates by document
              order, page order, clause order, year alone, month alone, or day
              alone.

              Chronology must always be described accurately:

              - a smaller date key is before a larger date key;
              - an equal date key is on the same date;
              - a larger date key is after a smaller date key.

              Never describe an earlier date as after a later date or a later
              date as before an earlier date.

              ================================================================
              STATUS DECISION ORDER
              ================================================================

              Apply the first reliably supported rule in this exact order:

              1. "No Longer Tenant"
              2. "Gone"
              3. "Moving"
              4. "Unknown" when controlling evidence is unreliable
              5. "Future"
              6. "Expired"
              7. "Occupying"

              ================================================================
              EVENT-BASED STATUSES
              ================================================================

              Return "No Longer Tenant" only when an executed agreement ends the
              tenant's entire tenancy and event_key <= processing_key.

              Return:

              tenancy_status_reason_desc =
              "Entire tenancy terminated by executed agreement"

              tenancy_status_reason_notes =
              "The tenant's entire tenancy ended by an executed agreement effective [event_date], on or before the processing date [processing_date]."

              Return "Gone" only when an executed surrender, contraction,
              completed relocation, substitution, or amendment removes the
              specific premises record and event_key <= processing_key.

              Apply "Gone" only to the removed record.

              Return:

              tenancy_status_reason_desc =
              "Premises removed by executed agreement"

              tenancy_status_reason_notes =
              "[premises] was removed by an executed [event_type] effective [event_date], on or before the processing date [processing_date]."

              Return "Moving" only when an executed relocation, substitution,
              or future surrender will remove the existing premises and
              event_key > processing_key.

              Apply "Moving" only to the outgoing premises. Determine the
              replacement premises status from its own controlling dates.

              Return:

              tenancy_status_reason_desc =
              "Executed relocation pending"

              tenancy_status_reason_notes =
              "An executed relocation will remove [premises] effective [event_date], after the processing date [processing_date]."

              ================================================================
              DATE-BASED STATUSES
              ================================================================

              Return "Future" only when:

              processing_key < commencement_key

              and no higher-priority event applies.

              Return:

              tenancy_status_reason_desc =
              "Lease commencement date is in the future"

              tenancy_status_reason_notes =
              "The executed lease commencement date [commencement_date] is after the processing date [processing_date]."

              Return "Expired" only when:

              processing_key > expiration_key

              and no higher-priority event or supported continuation applies.

              Before returning "Expired", check for an effective extension,
              renewal, expiration-date amendment, automatic extension, exercised
              renewal option, or other supported continuation.

              If a continuation changes the expiration date, use the updated
              expiration date and determine the status again.

              Return:

              tenancy_status_reason_desc =
              "Lease term expired"

              tenancy_status_reason_notes =
              "The executed lease expiration date [expiration_date] is before the processing date [processing_date], and no supported continuation exists."

              Return "Occupying" only when:

              commencement_key <= processing_key
              AND
              processing_key <= expiration_key

              and no higher-priority event applies.

              Treat commencement_date and expiration_date as inclusive.

              Return:

              tenancy_status_reason_desc =
              "Executed lease in effect"

              tenancy_status_reason_notes =
              "The processing date [processing_date] falls within the executed lease term from [commencement_date] through [expiration_date]."

              ================================================================
              UNKNOWN
              ================================================================

              Return "Unknown" when the evidence required to establish another
              status is missing, conflicting, ambiguous, or unreadable.

              This includes:

              - missing or unreliable commencement_date;
              - missing or unreliable expiration_date;
              - missing or unreliable processing_date;
              - commencement_date after expiration_date;
              - unresolved conflicting controlling dates;
              - an unreadable controlling amendment date; or
              - uncertainty about whether a renewal or extension became effective.

              Return:

              tenancy_status_reason_desc =
              "Status not reliably established"

              tenancy_status_reason_notes =
              "The status cannot be reliably established because [specific missing, conflicting, ambiguous, or unreadable controlling evidence]."

              Replace the bracketed explanation with the specific evidence
              problem. Do not leave unresolved placeholders.

              Do not return "Unknown" merely because arrangement_space_area,
              suite_number, full_floor_f, or area unit is empty.

              Tenancy status is independent from floor-area availability.

              ================================================================
              EXACT STATUS MAPPING
              ================================================================

              After finalizing tenancy_status_desc, use only these exact reason
              mappings:

              - "Occupying" -> "Executed lease in effect"
              - "Future" -> "Lease commencement date is in the future"
              - "Expired" -> "Lease term expired"
              - "Gone" -> "Premises removed by executed agreement"
              - "Moving" -> "Executed relocation pending"
              - "No Longer Tenant" ->
                "Entire tenancy terminated by executed agreement"
              - "Unknown" -> "Status not reliably established"

              Generate exactly one note using the corresponding status rule.

              Never use a Future reason or note for another status.
              Never use an Occupying reason or note for another status.
              Never retain a reason or note from a previously considered status.

              ================================================================
              RECORD CONSISTENCY
              ================================================================

              Apply these rules independently to every supported premises record.

              When records share the same commencement_date, expiration_date,
              and processing_date, and no record-specific event applies, return
              the same status, reason, and note for all those records.

              A record-specific executed event may change only the record
              expressly affected by that event.

              Do not create a floor, suite, unit, area, or placeholder record
              merely because a tenancy event or status is mentioned.

              If a premises record is unsupported, remove the complete record
              instead of retaining it with an Unknown status.

              ================================================================
              FINAL VALIDATION
              ================================================================

              Immediately before returning JSON, verify every record:

              - status uses one allowed value;
              - reason and note match the finalized status;
              - reason and note use the same verified dates;
              - Future satisfies processing_key < commencement_key;
              - Expired satisfies processing_key > expiration_key;
              - Occupying satisfies commencement_key <= processing_key AND
                processing_key <= expiration_key;
              - Gone has an executed record removal with
                event_key <= processing_key;
              - Moving has an executed pending removal with
                event_key > processing_key;
              - No Longer Tenant has an executed entire-tenancy termination
                with event_key <= processing_key;
              - continuation evidence was checked before returning Expired;
              - no earlier date is described as after a later date;
              - no later date is described as before an earlier date; and
              - no unresolved placeholders remain.

              Apply this final date correction when no higher-priority executed
              event applies:

              - if processing_key < commencement_key, return "Future";
              - otherwise, if processing_key > expiration_key and no supported
                continuation exists, return "Expired";
              - otherwise, if commencement_key <= processing_key AND
                processing_key <= expiration_key, return "Occupying";
              - otherwise, return "Unknown".

              After the final correction, regenerate both the reason and note
              from the finalized status. Do not preserve an earlier reason or
              note.

              ================================================================
              AMENDMENTS AND EXCLUSIONS
              ================================================================

              Apply executed amendments from their effective dates. Retain original
              terms not expressly changed. Keep added, surrendered, relocated, and
              replacement premises separate when their designations, statuses, or
              effective dates differ.

              Exclude parking, vehicle storage, bicycle storage, loading areas,
              shared facilities outside the demise, addresses, postal codes,
              building IDs, registrations, unrelated tenants, building totals,
              technical details, energy-label areas, cadastral or land areas,
              drawing/report/certificate numbers, blank templates, drafts, unsigned
              alternatives, unexercised options, and unincorporated marketing
              availability.

              ================================================================
              FINAL CHECK
              ================================================================

              Before returning, verify:

              - only the "Floor-Suite-Table" object is returned;
              - exactly the eight required arrays are present and have equal length;
              - each record has a supported non-empty numeric floor_number;
              - no record was created from suite_number alone;
              - if floor_number was empty, the complete record was removed from
                all eight arrays;
              - no unnumbered named level was converted into a numeric floor;
              - every record belongs to the applicable tenant's premises;
              - every non-empty floor_number contains only normalized numeric floor
                information;
              - every non-empty arrangement_space_area is specifically tied to the
                floor_number or suite_number at the same index;
              - no aggregate premises area was assigned to one floor unless the
                source expressly states that the entire aggregate applies to that
                floor;
              - floor numbers obtained from delivery, access, server-room,
                installation, or technical clauses did not inherit an aggregate
                area from another clause;
              - covered and uncovered outdoor areas were not added to indoor floor
                areas;
              - an incorporated tenant-specific floor-level measurement was not
                replaced by a less granular whole-property or use-category aggregate;
              - every aggregate use category was checked for a complete floor-specific
                breakdown before an aggregate record was created;
              - each normalized floor_number appears once and all distinct leased
                components on that floor were summed without double-counting;
              - source priority determined premises scope and did not overwrite a
                more specific supported floor-level measurement;
              - no calculated or converted area is returned;
              - no detailed record duplicates an aggregate record;
              - every supported line in the controlling premises list was evaluated;
              - multiple leased components on the same normalized floor were
                consolidated into one record and their distinct areas were summed;
              - an expressly parent-floor-linked component retained that parent floor;
              - dropdown fields use only allowed values;
              - duplicates and exclusions are removed; and
              - no parking-space, vehicle-space, or bicycle-space entry created
                a Floor-Suite-Table record;
              - every floor and area remained paired with the same controlling
                premises sentence, bullet, table row, or schedule row;
              - the response is valid JSON.

          - role: system
            raw: true
            content: |
              EXAMPLES

              Do not reuse example values unless they appear in the supplied
              context.

              EXAMPLE 1: DETAILED FLOOR AREAS

              Context:
              "A total of 1,857.7 m², distributed as follows: 2nd floor 60 m²;
              13th floor 1,193.6 m²; 14th floor 586.1 m²."

              Return floors "2", "13", and "14" with areas "60", "1193.6",
              and "586.1". Do not return the aggregate or floor "13,14".

              EXAMPLE 2: AGGREGATE MULTI-FLOOR AREA

              Context:
              "1,779.7 m² on the 13th and 14th floors."

              No separate floor areas exist.

              Return floor_number "13,14" and arrangement_space_area "1779.7".
              Never apportion the area.

              EXAMPLE 3: UNNUMBERED CELLAR

              Context:
              "The leased property consists of retail space on the ground floor
              and a cellar."

              Return only floor_number "0". Do not return "-1" for the cellar and
              do not create a separate cellar record.

              EXAMPLE 4: AGGREGATE AREA MUST NOT BE ASSIGNED TO FLOOR 0

              Context:
              The premises clause states approximately 3,550 m² of warehouse,
              office, other space, and covered outdoor space. A delivery clause
              mentions offices on the ground and first floors. An incorporated
              tenant-specific NEN 2580 schedule states:

              "Building floor 0: 3,400 m² LFA."
              "Building floor 1: 120 m² LFA."
              "Covered outdoor space: 20 m²."

              Return:
              floor_number = ["0", "1"]
              arrangement_space_area = ["3400", "120"]
              ref_arrangement_space_area_uom_desc = ["SqM", "SqM"]

              Do not assign "3550" to floor 0. Do not add covered outdoor area to
              floor 0.

              EXAMPLE 5: ACTIVE LEASE

              Processing date: 2026-09-10.
              Commencement date: 2026-09-01.
              Expiration date: 2031-08-31.

              Because 20260901 <= 20260910 <= 20310831, return "Occupying",
              reason "Executed lease in effect", and the corresponding Occupying
              note. Never return Future for these dates.

              EXAMPLE 6: FUTURE LEASE

              Processing date: 2026-09-10.
              Commencement date: 2027-01-01.
              Expiration date: 2037-12-31.

              Because 20260910 < 20270101, return Future with the mapped reason and
              Future note.

