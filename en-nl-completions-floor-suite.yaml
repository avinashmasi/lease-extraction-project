          - role: system
            raw: true
            content: |
              FINAL TENANCY, FLOOR, AND AREA ENFORCEMENT

              Use 2026-09-21 as the default processing date unless the runtime
              context expressly labels another Current processing date, Processing
              date, As-of date, or Status date.

              Normalize controlling dates to YYYY-MM-DD, remove hyphens, and compare
              YYYYMMDD values as eight-digit integers.

              Apply the comparison in this exact order: processing_key less than
              commencement_key means Future; otherwise processing_key greater than
              expiration_key means Expired; otherwise the term is active. Do not
              compare only month and day values.

              If commencement_key <= processing_key AND processing_key <=
              expiration_key, status must be "Occupying" unless a higher-priority
              executed event applies.

              Return "Future" only when processing_key < commencement_key.

              Do not invent a numeric floor for an unnumbered named level. A
              negative floor requires an expressly numbered basement designation.

              Do not create a record when floor_number is empty. An explicit Suite,
              unit, area, status, or other value cannot create a record without a
              supported numeric floor_number. If floor_number is empty, remove the
              complete record from all eight arrays.

              This is a mandatory complete-record deletion rule. If floor_number
              is empty, delete the complete record at that index from all eight
              arrays:

              - floor_number
              - suite_number
              - arrangement_space_area
              - ref_arrangement_space_area_uom_desc
              - full_floor_f
              - tenancy_status_desc
              - tenancy_status_reason_desc
              - tenancy_status_reason_notes

              A suite-only, unit-only, area-only, status-only, or named-level-only
              record is prohibited.

              Never return an area-only record. Never assign floor_number "0"
              merely because the premises are a warehouse, business space,
              office, boiler room, mezzanine, or physically appear to be at
              ground level.              

              For each record, verify that arrangement_space_area expressly applies
              to the floor_number or suite_number at the same index.

              Never assign a whole-property, multi-floor, or multi-component
              aggregate area to one floor unless the source expressly states that
              the complete aggregate applies to that floor.

              When an incorporated tenant-specific NEN 2580 schedule or measurement
              report provides separate floor-level LFA values, use those stated
              values for the corresponding floor records.

              When an aggregate use-category area is split into floor-specific rows,
              return every applicable floor-specific row and suppress the aggregate
              category area. Consolidate separately measured leased components on
              the same normalized floor into one record and sum their distinct areas.

              Do not add covered or uncovered outdoor area to an indoor floor area.

              These area rules must not remove or alter an independently supported
              floor_number.

              Evaluate every supported floor-area line in the controlling premises
              clause, schedule, or incorporated measurement source. Do not stop
              after the first valid record. Consolidate separately stated leased
              components on the same floor and sum their distinct areas.

              MANDATORY UNIQUE-FLOOR CONSOLIDATION

              Perform this as the final floor-area step after identifying all
              supported premises components. Group proposed records by normalized
              floor_number. For each group, output exactly one record and set its
              arrangement_space_area to the sum of all distinct expressly stated
              same-unit leased areas in that group. Remove the pre-consolidation
              component records, so a floor_number can never occur more than once.


              Apply this order before consolidation:

              1. If reliable final floor-specific VVO/LFA rows exist, select those
                 final rows and suppress related cross-floor category totals.
              2. Otherwise, use distinct leased components expressly tied to the
                 floor in the controlling premises clause or incorporated schedule.
              3. Sum selected same-unit components only within the same normalized
                 floor.

              Do not let the unique-floor rule remove a valid component from a floor.
              It requires combining all selected same-floor components, not choosing
              only the first, largest, or lease-summary value.

              Example: ground-floor business space 1435 m2 plus a 240 m2 mezzanine
              expressly within that ground-floor business space plus ground-floor
              office space 822 m2 must return one floor 0 record with area 2497.
              Do not return separate floor 0 records for 1435 and 240, and do not
              omit the 822 ground-floor office area.


              Example: an office category total of 179.96 m2 covers floors 0 and 1,
              while final measurement rows state floor 0 office 92.65 m2 and floor 1
              office 87.31 m2. Use 92.65 and 87.31 as the floor-specific values and
              use 179.96 only for reconciliation. If floor 0 also has warehouse
              19167.58 m2, return floor 0 area 19260.23 and floor 1 area 87.31.

              Determine tenancy_status_desc first, then regenerate both the reason
              and note only from that finalized status.

              Apply this final date rule exactly when no higher-priority executed
              event applies:

              - if processing_key < commencement_key, return "Future";
              - otherwise, if processing_key > expiration_key and no supported
                continuation exists, return "Expired";
              - otherwise, if commencement_key <= processing_key AND
                processing_key <= expiration_key, return "Occupying";
              - otherwise, return "Unknown".

              Never return "Future" when commencement_key <= processing_key.

              For "Occupying", return exactly:

              tenancy_status_reason_desc = "Executed lease in effect"

              tenancy_status_reason_notes =
              "The processing date [processing_date] falls within the executed lease term from [commencement_date] through [expiration_date]."

              After finalizing the status, discard any reason or note generated
              for an earlier candidate status. Never describe an earlier
              commencement date as after a later processing date.

