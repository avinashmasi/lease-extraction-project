    Effective_Rent_Yearly:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |

            Extract the Effective Rent Yearly amount.
            FIELD DEFINITION
            Effective Rent Yearly is the annual rent payable after
            applying all rent concessions, incentives,
            rent-free periods, abatements, rental discounts,
            vacancy discounts and lease incentives.

            Effective Rent Yearly is NOT the same as
            Asking Rent Yearly unless the lease explicitly
            contains no rent incentives.

            ----------------------------------------
            PRIORITY 1
            DIRECT EFFECTIVE YEARLY RENT
            ----------------------------------------

            Search the entire document for:
            - Annual Effective Rent
            - Effective Annual Rent
            - Effective Rent Yearly
            - Effective Yearly Rent
            - Annual Net Effective Rent
            - Net Effective Annual Rent
            - Effective Rent Per Year
            - Annual Effective Rental Amount
            - effective annual base rent
            - netto effectieve jaarhuur
            - effectieve jaarhuur
            - netto jaarhuur
            - effectieve huur per jaar
            If found:
            Return the explicitly stated annual effective rent.
            Never recalculate a direct effective rent value.

            ----------------------------------------
            PRIORITY 2
            MONTHLY EFFECTIVE RENT
            ----------------------------------------

            If no annual effective rent exists:
            Search for:
            - Monthly Effective Rent
            - Effective Monthly Rent
            - Monthly Net Effective Rent
            - Net Effective Monthly Rent
            - effectieve huur per maand
            - netto effectieve huur per maand
            If found:
            Effective Rent Yearly =
            Effective Rent Monthly × 12

            ----------------------------------------
            PRIORITY 3
            CALCULATE EFFECTIVE RENT
            ----------------------------------------

            Only calculate when no direct effective rent exists.
            STEP A
            Find Asking Rent Yearly.
            Search for:
            - Annual Rent
            - Annual Base Rent
            - Base Rent
            - Commencing Rent
            - Total Annual Rent
            - huurprijs per jaar
            - aanvangshuurprijs
            - yearly ren
            Ignore:
            - VAT
            - service charges
            - operating expenses
            - maintenance
            - utilities
            - taxes
            - parking fees
            - insurance

            STEP B
            Search entire lease for concessions.
            Keywords:
            - rent free
            - rent-free
            - free rent
            - rent holiday
            - huurvrij
            - huurvrije periode
            - concession
            - incentive
            - lease incentive
            - rental incentive
            - rent reduction
            - huurkorting
            - annual discount
            - rental discount
            - abatement
            - vacancy compensation
            - landlord contribution
            - rent credit
            - stepped rent

            ----------------------------------------
            CALCULATION RULES
            ----------------------------------------

            RULE 1
            RENT FREE MONTHS
            Annual Rent = A
            Lease Months = T
            Rent Free Months = F
            Effective Annual Rent =
            A × ((T - F) / T)

            Example:
            A = 424192.50
            T = 60
            F = 8

            Result:
            356321.70

            RULE 2
            ANNUAL RENT DISCOUNT
            Effective Annual Rent =
            Asking Annual Rent
            - Annual Discount

            RULE 3
            ONE TIME INCENTIVE
            Lease Years = T / 12
            Annualized Incentive =
            Incentive Amount / Lease Years
            Effective Annual Rent =
            Asking Annual Rent
            - Annualized Incentive

            RULE 4
            MULTIPLE INCENTIVES
            Combine:
            - rent free periods
            - rent discounts
            - abatements
            - vacancy compensation
            - incentive credits
            Apply each concession only once.

            RULE 5
            STEPPED RENT
            When rent changes during the lease:
            Calculate total payable rent for all steps.
            Total Effective Rent =
            Sum of all step rents
            Effective Annual Rent =
            Total Effective Rent / Lease Years
            Never use the simple rent-free formula
            for stepped rent schedules.

            ----------------------------------------
            VALIDATION
            ----------------------------------------

            Use values in this order:
            1. Direct Annual Effective Rent
            2. Direct Monthly Effective Rent × 12
            3. Calculated Effective Rent
            Direct values always override calculations.
            Do not return:
            - Asking Rent
            - Base Rent
            - Monthly Rent
            - Rent/SF
            - Rent/SQM
            - Service Charge
            - CAM
            - Operating Expenses
            - Parking Fees

            ----------------------------------------
            SPECIAL RULE
            ----------------------------------------

            Only when the entire lease contains
            NO concessions, incentives,
            discounts or rent-free periods:
            Effective Rent Yearly =
            Asking Rent Yearly

            ----------------------------------------
            NUMBER NORMALIZATION
            ----------------------------------------

            $301,380.00 -> 301380.00
            €301.380,00 -> 301380.00
            Remove:
            - currency symbols
            - thousand separators
            Return only the numeric value.
            Examples:
            356321.70
            270366.90
            97368.68
            If no reliable value exists:
            i dont know

        - role: user
          content: "{prompt}"

