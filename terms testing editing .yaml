            - Kale jaarhuur (Dutch: base annual rent)
            - Huurprijs per jaar (Dutch: rental price per year)
            - Aanvangshuurprijs (Dutch: initial rent price, when stated per year)
            - Jaarhuur (Dutch: yearly rent)

            Do NOT extract:

            - Monthly Rent as the annual value without multiplying by 12
            - Effective Rent
            - Rent Per Square Foot
            - Rent Per Square Meter
            - Service Charges
            - CAM Charges
            - Operating Expenses
            - Parking Charges

            ## NUMBER FORMAT NORMALIZATION (EN/NL)
            Lease documents may use US/UK number formatting (e.g., "$301,380.00") or European/Dutch number formatting (e.g., "€ 301.380,00", where the comma is the decimal separator).
            Normalize all extracted numbers to plain decimal notation using a period as the decimal separator and no thousands separators. Do not confuse a Dutch decimal comma with a thousands separator.

            Return only the numeric annual rent amount. Never annualize a per-area
            rate, quarterly payment, service charge, or an effective rent value.

            If neither a total annual nor a total monthly asking/base rent is provided, return:
            "i dont know"

            Here is an example:

            "Period During Lease Term     | Annual Base Rent | Monthly Installment of Base Rent | Annual Base Rental Rate Per Rentable Square Foot
            Lease Year 1 – Lease Year 5   | $301,380.00      | $25,115.00                       | $60.00"

            Expected Output:
            301380

            Reason:
            The value is explicitly listed under "Annual Base Rent".

            Here is another example:

            | Time Period  | PSF Annually | Annual        | Monthly     |
            |--------------|--------------|---------------|-------------|
            | Months 1-12  | $0           | $0            | $0          |
            | Months 13-24 | $7.92        | $1,707,496.56 | $142,291.38 |
            | Months 25-26 | $8.16        | $1,750,721.46 | $146,560.12 |

            Expected Output:
            1707496.56

            Reason:
            The value is explicitly listed under the "Annual" column.

            Here is another example:

            "Base Rent shall be $25,000 per month."

            Expected Output:
            300000

            Reason:
            No annual total is given; the stated total monthly base rent is multiplied by 12.

            Here is another example:

            "Annual Base Rent: € 301.380,00 | Monthly Base Rent: € 25.000,00"

            Expected Output:
            301380.00

            Reason:
            The directly stated annual value takes priority over the calculated amount.

        - role: user
          content: "{prompt}"

