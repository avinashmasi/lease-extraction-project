    Effective_Rent_Monthly:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            Extract the Total Effective Rent Monthly amount.

            DEFINITION
            Effective Rent Monthly represents the actual monthly rent payable
            after considering all rent incentives, concessions, abatements,
            rent-free periods, rent discounts, rental credits, and lease incentives.

            EXTRACTION PRIORITY

            STEP 1 - DIRECT MONTHLY EFFECTIVE RENT
            Search the entire document for explicit monthly effective rent values.
            Examples include:
            - Monthly Effective Rent
            - Effective Monthly Rent
            - Net Effective Rent Per Month
            - Monthly Net Effective Rent
            - Effective Base Rent
            - Net Effective Monthly Rent
            - Effective Rent PM
            - effectieve huur per maand
            - netto effectieve huur per maand
            If found, return that value immediately.
            A stated value of 0 is valid.

            STEP 2 - DIRECT ANNUAL EFFECTIVE RENT
            If no monthly effective rent exists:
            Search for:
            - Annual Effective Rent
            - Effective Annual Rent
            - Effective Yearly Rent
            - Net Effective Annual Rent
            - Annual Net Effective Rent
            - effectieve jaarhuur
            - netto jaarhuur
            - effective base rent

            If found:
            Effective Rent Monthly =
            Effective Rent Yearly / 12
            Round to 2 decimals.

            STEP 3 - CALCULATE EFFECTIVE RENT
            If no effective rent amount exists directly,
            calculate it using asking rent and incentives.

            ASKING RENT IDENTIFICATION
            Search for:
            - Annual Base Rent
            - Base Rent
            - Annual Rent
            - Total Annual Rent
            - Commencing Annual Rent
            - huurprijs per jaar
            - aanvangshuurprijs
            - yearly rent

            Ignore:
            - VAT
            - Service charges
            - Utilities
            - Operating expenses
            - Taxes
            - Maintenance charges
            - Per-square-foot rent
            - Per-square-meter rent
            - Parking charges unless included in stated rent

            INCENTIVE IDENTIFICATION

            Search entire document for:
            - rent free
            - rent-free
            - free rent
            - rent holiday
            - huurvrij
            - huurvrije periode
            - incentive
            - lease incentive
            - rental incentive
            - concession
            - rent discount
            - rental discount
            - huurkorting
            - vacancy compensation
            - rent reduction
            - landlord contribution applied against rent
            - abatement
            - stepped rent

            CALCULATION RULES
            RULE A - RENT FREE MONTHS
            If:
            Annual Rent = A
            Lease Months = T
            Free Months = F
            Effective Annual Rent =
            A × ((T - F) / T)

            Example:
            Annual Rent = 424192.50
            Lease Term = 60 months
            Rent Free = 8 months
            Effective Annual =
            424192.50 × (52/60)

            RULE B - ANNUAL RENT DISCOUNT
            If annual discount exists:
            Effective Annual Rent =
            Asking Annual Rent
            minus Annual Discount

            RULE C - ONE-TIME RENT CREDIT

            If one-time rent credit exists:
            Annualized Credit =
            Credit Amount / Lease Years
            Effective Annual Rent =
            Asking Annual Rent
            minus Annualized Credit

            RULE D - MULTIPLE CONCESSIONS
            If multiple incentives exist:
            Apply all incentives one time only.
            Combine:
            - rent free months
            - annual discounts
            - rental abatements
            - vacancy compensation
            - incentive credits

            RULE E - STEPPED RENT
            For stepped rent schedules:
            Calculate total rent across the full
            initial lease term.
            Divide by lease years.
            Do not use a simple rent-free formula
            when rent changes by period.

            RULE F - NO INCENTIVES
            If lease contains no incentives:
            Effective Annual Rent =
            Asking Annual Rent
            VALIDATION
            Preferred source order:
            1. Direct Monthly Effective Rent
            2. Direct Annual Effective Rent
            3. Calculated Effective Annual Rent
            4. Calculated Effective Monthly Rent

            Direct values always override calculated values.
            If Effective Annual Rent is known:
            Effective Monthly Rent =
            Effective Annual Rent / 12
            If Effective Monthly Rent is known:
            Effective Annual Rent =
            Effective Monthly Rent × 12

            Never use:
            - VAT
            - taxes
            - service charges
            - common area maintenance
            - utilities
            - operating expenses
            - parking fees
            - insurance costs

            NUMBER NORMALIZATION
            Convert:
            €75.077,10 → 75077.10
            $75,077.10 → 75077.10

            OUTPUT
            Return only the numeric monthly amount.
            Examples:
            29693.48
            22530.57
            8114.06

            If a reliable value cannot be identified
            or calculated, return:

            i dont know

        - role: user
          content: "{prompt}"

