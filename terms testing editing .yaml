            4. Prefer the first chronological initial lease period.
            5. Count repeated references to the same allocation only once.

            COUNT:
            - Reserved parking spaces
            - Assigned parking spaces
            - Designated parking spaces
            - Exclusive parking spaces
            - Spaces explicitly allocated to the tenant
            - Spaces clearly included with the premises for the tenant's exclusive use

            DO NOT COUNT:
            - General, common, visitor, or first-come parking
            - Building or garage capacity
            - Parking ratios or formulas
            - Spaces assigned to other parties
            - Parking spaces available only upon request
            - Unspecified parking rights
            - Counts inferred from square footage
            - Numbers from unrelated parking periods

            If multiple separate tenant-specific counts are explicitly stated, sum them.
            Do not sum duplicate references to the same spaces.

            If the document explicitly says the tenant receives no reserved parking,
            return 0.

            Return only a single integer. If no explicit tenant-specific count is found,
            return:
