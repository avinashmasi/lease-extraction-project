# file name: global-fields.yaml
kind: Ontology/v2
name: global-fields
namespaces:

  self:

    # jurisdiction
    jurisdiction:
      reduction:
        $precedence:
          - $get: jurisdiction
          - $const: en-nl

    # validation
    validation:
      reduction:
        $precedence:
          - $get: validation
          - $const: fuzzy

    # response language
    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    # response encoding
    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =self.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    
    # Floor/Suite

    Floor-Suite-Floor:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Floor
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Floor

    Floor-Suite-Suite:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Suite
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Suite

    Floor-Suite-Space-Size:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Space-Size
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Space-Size

    Floor-Suite-Space-Size-UOM:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Space-Size-UOM
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Space-Size-UOM

    Floor-Suite-Whole-Floor:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Whole-Floor
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Whole-Floor

    Floor-Suite-Floor-Status:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Floor-Status
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Floor-Status

    Floor-Suite-Reason:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Reason
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Reason

    Floor-Suite-Reason-Notes:
      type: Floor-Suite
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-floor-suite/self.Floor-Suite-Reason-Notes
          en-nl: =en-nl-completions-floor-suite/self.Floor-Suite-Reason-Notes

    # Parking
    parking_type_desc:
      type: property_lease_arrangement_parking
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-property-type-parking-details/self.parking_type_desc
          en-nl: =en-nl-completions-property-type-parking-details/self.parking_type_desc

    parking_sub_type_desc:
      type: property_lease_arrangement_parking
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-property-type-parking-details/self.parking_sub_type_desc
          en-nl: =en-nl-completions-property-type-parking-details/self.parking_sub_type_desc

    number_parking_space:
      type: property_lease_arrangement_parking
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-property-type-parking-details/self.number_parking_space
          en-nl: =en-nl-completions-property-type-parking-details/self.number_parking_space

    parking_cost_monthly:
      type: property_lease_arrangement_parking
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-property-type-parking-details/self.parking_cost_monthly
