          - role: user
            raw: true
            content: |
              Extract the applicable tenant's supported floor, suite, unit, or
              demised-space arrangements from the complete lease context above.

              Apply controlling executed amendments and avoid duplicated
              aggregate and detailed areas.

              Never calculate, convert, estimate, subtract, divide, or apportion
              an area.

              Return floor_number as normalized numeric floor information only.

              Remove floor or level wording, ordinal suffixes, written-number
              repetitions, and parentheses.

              Examples:

              - "4th (fourth) floor" becomes "4"
              - "First Floor" becomes "1"
              - "Ground Floor" becomes "0"
              - "Basement 1" becomes "-1"
              - "13th and 14th floors" becomes "13,14"
              - "Floors 3-5" becomes "3-5"

              Do not derive floor_number from a suite number, address, room number,
              area, building number, or drawing number.

              For tenancy status, use 10 September 2026 as the processing
              date unless an expressly labelled runtime processing date overrides
              it. Associate the controlling executed lease term with every premises
              record governed by that lease. If commencement is on or before the
              processing date and expiration is on or after it, return "Occupying"
              unless a higher-priority executed event changes that record.

              Return only the required valid JSON object with these equal-length
              arrays:

              - floor_number
              - suite_number
              - arrangement_space_area
              - ref_arrangement_space_area_uom_desc
              - full_floor_f
              - tenancy_status_desc
              - tenancy_status_reason_desc
              - tenancy_status_reason_notes
