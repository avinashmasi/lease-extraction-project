kind: Ontology/v2

# name - used by external ontologies to reference
#        back to the current instance.
#        this should always be the same as the file base-name
name: en-nl-lease

# minimum version
version: v2.2.126

# entrypoint
entrypoint: abstract

# defaults
defaults:

  # embed metadata in all searches
  search_adorn: false

  # override completion instance confidence with token logits
  completion_logprobs: true

  # default date input style and output format
  kind_date_input_format: 'MDY'
  kind_date_output_format: '%m/%d/%y'

  # turn off highlighted for testing
  abstract_highlight: false
  abstract_highlight_search_length: 128

# namespaces
namespaces:

  # #################################
  # abstract
  # #################################

  abstract:

    # used to specialize prompts and logic for
    # certain locales (a.k.a., jurisdictions), notice
    # it will keep the value if preset, otherwise set to
    # the default, e.g., en-us
    # { "kind": "object" ... "jurisdiction": "en-us" }
    jurisdiction:
      reduction:
        $precedence:
        - $get: jurisdiction
        - $set: en-nl

    validation:
      reduction:
        $precedence:
        - $get: validation
        - $set: fuzzy   # fuzzy, primary, secondary

    $classifications:
      reduction:
        $set:
        - name: Lease
          confidence: 1.0

    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =abstract.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    # the following semantics will all run in parallel
    # (i.e., labels with the first letter capitalized run concurrently)
    # however, the collate and join parameters run sequentially

    # Terms:
    #   reduction:
    #     $collate:
    #       - =global-fields/self.Arrangement_Start_Date
    #       - =global-fields/self.Arrangement_End_Date
    #       - =global-fields/self.Occupancy_Date
    #       - =global-fields/self.Occupancy-Date-Explicit
    #       - =global-fields/self.Lease_Term
    #       - =global-fields/self.Ref_lease_term_uom_desc
    #       - =global-fields/self.Reserved_Parking_Spaces
    #       - =global-fields/self.Cost_per_Reserved_Parking_Space
    #       - =global-fields/self.Ref_cost_per_reserved_parking_space_uom_desc

    
    # Contacts:
    #   reduction:
    #     $join:
    #       display_contact_name:
    #         - =global-fields/self.3PL-Provider-Display-Contact-Name
    #         - =global-fields/self.3PL-Recipient-Display-Contact-Name
    #         - =global-fields/self.Landlord-Rep-Display-Contact-Name
    #         - =global-fields/self.Landlord-Rep-Passive-Display-Contact-Name
    #         - =global-fields/self.Legal-Owner-Display-Contact-Name
    #         - =global-fields/self.Tenant-Display-Contact-Name
    #         - =global-fields/self.Tenant-Rep-Display-Contact-Name

    #       first_name:
    #         - =global-fields/self.3PL-Provider-First-Name
    #         - =global-fields/self.3PL-Recipient-First-Name
    #         - =global-fields/self.Landlord-Rep-First-Name
    #         - =global-fields/self.Landlord-Rep-Passive-First-Name
    #         - =global-fields/self.Legal-Owner-First-Name
    #         - =global-fields/self.Tenant-First-Name
    #         - =global-fields/self.Tenant-Rep-First-Name

    #       last_name:
    #         - =global-fields/self.3PL-Provider-Last-Name
    #         - =global-fields/self.3PL-Recipient-Last-Name
    #         - =global-fields/self.Landlord-Rep-Last-Name
    #         - =global-fields/self.Landlord-Rep-Passive-Last-Name
    #         - =global-fields/self.Legal-Owner-Last-Name
    #         - =global-fields/self.Tenant-Last-Name
    #         - =global-fields/self.Tenant-Rep-Last-Name

    #       email:
    #         - =global-fields/self.3PL-Provider-Email
    #         - =global-fields/self.3PL-Recipient-Email
    #         - =global-fields/self.Landlord-Rep-Email
    #         - =global-fields/self.Landlord-Rep-Passive-Email
    #         - =global-fields/self.Legal-Owner-Email
    #         - =global-fields/self.Tenant-Email
    #         - =global-fields/self.Tenant-Rep-Email

    #       full_phone_number:
    #         - =global-fields/self.3PL-Provider-Full-Phone-Number
    #         - =global-fields/self.3PL-Recipient-Full-Phone-Number
    #         - =global-fields/self.Landlord-Rep-Full-Phone-Number
    #         - =global-fields/self.Landlord-Rep-Passive-Full-Phone-Number
    #         - =global-fields/self.Legal-Owner-Full-Phone-Number
    #         - =global-fields/self.Tenant-Full-Phone-Number
    #         - =global-fields/self.Tenant-Rep-Full-Phone-Number

    floor_suite:
      reduction:
        $join:
          debug:
            - =en-nl-completions-floor-suite/self.Floor-Suite-Table
          floor_number:
            - =global-fields/self.Floor-Suite-Floor
          suite_number:
            - =global-fields/self.Floor-Suite-Suite
          arrangement_space_area:
            - =global-fields/self.Floor-Suite-Space-Size
          ref_arrangement_space_area_uom_desc:
            - =global-fields/self.Floor-Suite-Space-Size-UOM
          full_floor_f:
            - =global-fields/self.Floor-Suite-Whole-Floor
          tenancy_status_desc:
            - =global-fields/self.Floor-Suite-Floor-Status
          tenancy_status_reason_desc:
            - =global-fields/self.Floor-Suite-Reason
          tenancy_status_reason_notes:
            - =global-fields/self.Floor-Suite-Reason-Notes

    Parking:
      reduction:
        $join:
          debug:
            - =en-nl-completions-property-type-parking-details/self.Parking-Table
          parking_type_desc:
            - =global-fields/self.parking_type_desc
          parking_sub_type_desc:
            - =global-fields/self.parking_sub_type_desc
          number_parking_space:
            - =global-fields/self.number_parking_space
          parking_cost_monthly:
            - =global-fields/self.parking_cost_monthly
          parking_cost_monthly_uom:
            - =global-fields/self.parking_cost_monthly_uom
          parking_comments:
            - =global-fields/self.parking_comments
          parking_cost_yearly:
            - =global-fields/self.parking_cost_yearly
          parking_cost_yearly_uom:
            - =global-fields/self.parking_cost_yearly_uom
---
# file name: global-config.yaml
kind: Ontology/v2
name: global-config
namespaces:

  # #################################
  # configuration 
  # #################################

  # tools url configuration
  # configuration:
  #   tools_url: 
  #     reduction: http://xero-lambda-tools-service.app-portfolio.svc.cluster.local:8080

  #   relativedate_endpoint: 
  #     reduction: http://xero-lambda-abstraction-service.app-portfolio.svc.cluster.local:8080
  configuration:
    tools_url:
      reduction: http://localhost:8080

    relativedate_endpoint:
      reduction: https://develop.xero.uniti.cbre.com

  # search options (vector-store)
  search:
    chunk-max-l2-distance:
      reduction: 2.0

  # model options
  primary:
    model:
      reduction: gpt-5.1

    baseline:
      reduction: 0.95

  secondary:
    model:
      reduction: gemini-2.5-flash

    baseline:
      reduction: 0.90

  agent:
    model:
      reduction: gpt-5.1
    baseline:
      reduction: 0.95
---
# file name: global-context.yaml
kind: Ontology/v2
name: global-context
namespaces:

  # #################################
  # context 
  # #################################
  # used for general searches and document sections

  self:
    ascii-formatted-clustered:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: caster
          algorithm: default
          max_tokens: 124000
          chunk: document

    ascii-formatted-clustered-10p:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: caster
          algorithm: default
          max_tokens: 124000
          chunk: document
          pages: 1-10

    ascii-formatted-aligned:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: caster
          algorithm: default
          max_tokens: 124000
          chunk: document
---
# file name: en-nl-searches.yaml
kind: Ontology/v2
name: en-nl-searches
namespaces:
  self:
    Floor-Suite-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 25
          prompt: |
            tenant leased premises floor suite unit space size area,
            demised premises, premises schedule, floor schedule, suite schedule,
            unit schedule, floor-by-floor premises allocation, leased floor,
            rented floor, whole floor, partial floor, full floor, suite number,
            floor number, level designation, rent area, lettable area, rentable area,
            usable area, NEN 2580 measurement, space area, floor area,
            premises clause, amendment, relocation, surrender, renewal,
            expansion, contraction, premises exhibit, floor plan,
            tenant premises table, demised area by floor, unit allocation

    Parking-Context:
      kind:
        Text: =global-fields/self.response_encoding
      reduction:
        $search:
          mode: loader
          max_score: =global-config/search.chunk-max-l2-distance
          top_k: 25
          prompt: |
            tenant parking rights, parking allocation, parking schedule,
            car parking, van parking, truck parking, motorcycle parking,
            bicycle parking, EV parking, accessible parking, visitor parking,
            reserved parking, unreserved parking, tandem parking, designated parking,
            non-designated parking, covered parking, uncovered parking, indoor parking,
            outdoor parking, parking bay, parking space, parking fee, parking rent,
            parking charge, parking rate, monthly parking cost, annual parking cost,
            per space per month, per space per year, parking exhibit, parking appendix,
            amendment to parking, parking clause, tenant parking arrangement, parking rights schedule
