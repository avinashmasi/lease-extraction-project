          - role: user
            raw: true
            content: |
              Extract every supported parking arrangement for the applicable
              tenant from the complete lease context.

              Apply the controlling-source and amendment rules before extracting
              the final values.

              Return all supported fields for every arrangement:

              - parking_type_desc
              - parking_sub_type_desc
              - number_parking_space
              - parking_cost_monthly
              - parking_cost_monthly_uom
              - parking_comments
              - parking_cost_yearly
              - parking_cost_yearly_uom

              For parking_type_desc, use only:

              - "CarParking1"
              - "CarParking2"
              - "CarParking3"
              - "TruckParking"
              - "Two-wheelers"
              - "VanParking"

              For parking_sub_type_desc, use only:

              - "Indoor"
              - "Outdoor"

              Use "" for an unsupported field. Do not infer an indoor or outdoor
              subtype from general building parking information.

              Associate quantity, location, and separately itemized parking rent
              across controlling clauses when they clearly apply to the same
              tenant parking arrangement.

              Inspect annual and monthly rent breakdowns for a separately itemized
              parking-space row. When a governing annual or monthly heading clearly
              applies to every component rate and the parking row states a per-space
              basis such as "each", inherit that period for the parking rate.

              Populate a parking cost only when the exact source amount is
              expressly identified as parking-only and has a supported period,
              basis, quantity where required, and currency.

              Calculate a missing yearly per-space cost from an expressly stated
              monthly per-space parking rate.

              Calculate a missing monthly per-space cost from an expressly stated
              yearly per-space parking rate.

              When an expressly parking-only amount applies to exactly 3 (three)
              calendar months, calculate the monthly per-space equivalent by
              dividing by 3. If it is a supported total for multiple spaces,
              divide by the expressly stated quantity first. Calculate yearly cost
              from the original three-month amount or unrounded monthly equivalent.

              When the lease states an exact quantity and a monthly or yearly
              parking-only total for the same single arrangement, divide the
              total by the quantity to establish the per-space rate. Then
              calculate the missing monthly or yearly period.

              For parking_comments, return a concise sentence based on the
              controlling lease text that describes the corresponding parking
              arrangement.

              The comment may repeat the parking type, subtype, quantity,
              location, cost, currency, or another output value when necessary
              to preserve a meaningful lease-based sentence.

              If the lease provides no separate parking condition, use a
              concise version of the source statement that establishes the
              tenant's parking right or allocation.

              Do not include calculation explanations, conversion notes,
              extraction reasoning, classification explanations, citations,
              confidence scores, or unsupported assumptions in
              parking_comments.

              Return parking_comments as "" only when no reliable
              parking-specific sentence can be produced from the supported
              lease information without inference.

              Preserve distinct arrangements, remove duplicated references,
              and prefer supported detailed splits over duplicated aggregate
              records.

              Return only the required valid JSON object. Ensure all eight
              arrays have exactly the same length.