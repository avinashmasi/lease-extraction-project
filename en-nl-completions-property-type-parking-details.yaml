          - role: user
            content: =global-context/self.ascii-formatted-clustered

          - role: user
            raw: true
            content: |
              Extract every supported tenant parking arrangement from the complete controlling lease context.

              Return only the required valid JSON object with these eight equal-length arrays:
              parking_type_desc, parking_sub_type_desc, number_parking_space, parking_cost_monthly,
              parking_cost_monthly_uom, parking_comments, parking_cost_yearly, and parking_cost_yearly_uom.

              Reconstruct reliable structured and OCR-flattened rented-property summaries before concluding that a
              parking quantity is absent. Match ordered labels to ordered values when headings, units, layout, and
              surrounding clauses support the mapping.

              An exact supported numeric number_parking_space is mandatory for every record. If the quantity would
              be "", discard the entire candidate from all arrays. If no valid records remain, return empty arrays.

              A parking-lot use or destination statement must not create a record, parking type, or comment by itself.

              Associate quantity, location, subtype, access terms, and separately itemized parking-only rent across
              clauses only when they clearly describe the same arrangement. Apply controlling amendments, preserve
              distinct arrangements, remove duplicates, and prefer supported detailed splits over aggregate duplicates.

              Use only the controlled type and subtype values defined above. Use "" for another unsupported field
              within an otherwise valid record. Do not infer subtype from general building information.

              Populate costs only from exact parking-only amounts with a supported period, basis, quantity where
              required, and currency. Perform only the permitted monthly, yearly, and exact-three-month conversions.

              Return a concise controlling lease-based comment for each valid arrangement. Do not include reasoning,
              citations, confidence, classification explanations, or calculation notes.