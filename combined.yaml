# file name: global-fields.yaml
# yaml-language-server: $schema=../schemas/ontology.schema.json
# Copyright (C) 2024-2025 CBRE Inc. All rights reserved.
kind: Ontology/v2
name: global-fields
namespaces:

  self:

    # jurisdiction
    jurisdiction:
      reduction:
        $precedence:
          - $get: jurisdiction
          - $const: en-us

    # validation
    validation:
      reduction:
        $precedence:
          - $get: validation
          - $const: fuzzy

    # response language
    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    # response encoding
    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =self.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    # #################################
    # Terms

    Arrangement_Start_Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Arrangement_Start_Date
          en-nl: =en-nl-completions-terms/self.Arrangement_Start_Date

    Arrangement_End_Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Arrangement_End_Date
          en-nl: =en-nl-completions-terms/self.Arrangement_End_Date

    Occupancy_Date:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Occupancy_Date
          en-nl: =en-nl-completions-terms/self.Occupancy_Date

    Occupancy-Date-Explicit:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Occupancy-Date-Explicit
          en-nl: =en-nl-completions-terms/self.Occupancy-Date-Explicit

    Lease_Term:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Lease_Term
          en-nl: =en-nl-completions-terms/self.Lease_Term

    Ref_lease_term_uom_desc:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Ref_lease_term_uom_desc
          en-nl: =en-nl-completions-terms/self.Ref_lease_term_uom_desc

    Reserved_parking_spaces:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Reserved_Parking_Spaces
          en-nl: =en-nl-completions-terms/self.Reserved_Parking_Spaces

    Cost_per_Reserved_Parking_Space:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Cost_per_Reserved_Parking_Space
          en-nl: =en-nl-completions-terms/self.Cost_per_Reserved_Parking_Space

    Ref_cost_per_reserved_parking_space_uom_desc:
      reduction:
        $match:
          key: =self.jurisdiction
          default: =en-nl-completions-terms/self.Ref_cost_per_reserved_parking_space_uom_desc
          en-nl: =en-nl-completions-terms/self.Ref_cost_per_reserved_parking_space_uom_desc
