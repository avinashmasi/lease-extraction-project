# file name: en-nl-completions-floor-suite.yaml
kind: Ontology/v2
name: en-nl-completions-floor-suite

namespaces:
  self:
    Floor-Suite-Floor:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 0
          path: floor_number
          source: =self.Floor-Suite-Table

    Floor-Suite-Suite:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 1
          path: suite_number
          source: =self.Floor-Suite-Table

    Floor-Suite-Space-Size:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 2
          path: arrangement_space_area
          source: =self.Floor-Suite-Table

    Floor-Suite-Space-Size-UOM:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 3
          path: ref_arrangement_space_area_uom_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Whole-Floor:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 4
          path: full_floor_f
          source: =self.Floor-Suite-Table

    Floor-Suite-Floor-Status:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 5
          path: tenancy_status_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Reason:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 6
          path: tenancy_status_reason_desc
          source: =self.Floor-Suite-Table

    Floor-Suite-Reason-Notes:
      kind: Text
      reduction:
        $get:
          expand:
            table: 1
            column: 7
          path: tenancy_status_reason_notes
          source: =self.Floor-Suite-Table

    Floor-Suite-Table:
      kind: Object
      reduction:
        $get:
          path: Floor-Suite-Table
          source: =self.Floor-Suite-Agent

    Floor-Suite-Agent:
      confidence: 0.95
      kind:
        Instance: Object
      reduction:
        $completion:
          mode: chat
          model: =global-config/primary.model
          citations: =en-nl-searches/self.Floor-Suite-Context
          templates: =templates.Floor-Suite-Agent

  templates:
    Floor-Suite-Agent:
      reduction:
        $const:
          - role: system
            content: =global-prompts/self.generic-agent-template-content

          - role: system
            raw: true
            content: |
              You are a commercial real estate lease analyst.

              Extract every supported floor, suite, unit, or demised-space
              arrangement for the applicable tenant from the complete lease
              context.

              Return valid JSON only. Do not return markdown, explanations,
              citations, analysis, confidence scores, or additional keys.

              ================================================================
              OUTPUT CONTRACT
              ================================================================

              Return exactly one "Floor-Suite-Table" object containing these fields:

              - floor_number
              - suite_number
              - arrangement_space_area
              - ref_arrangement_space_area_uom_desc
              - full_floor_f
              - tenancy_status_desc
              - tenancy_status_reason_desc
              - tenancy_status_reason_notes

              Every field must be an array. Values at the same array index form
              one coherent record. All eight arrays must have equal length.

              Return only:

              {
                "Floor-Suite-Table": {
                  "floor_number": [string],
                  "suite_number": [string],
                  "arrangement_space_area": [string],
                  "ref_arrangement_space_area_uom_desc": [string],
                  "full_floor_f": [string],
                  "tenancy_status_desc": [string],
                  "tenancy_status_reason_desc": [string],
                  "tenancy_status_reason_notes": [string]
                }
              }

              If no supported record exists, return:

              {
                "Floor-Suite-Table": {
                  "floor_number": [],
                  "suite_number": [],
                  "arrangement_space_area": [],
                  "ref_arrangement_space_area_uom_desc": [],
                  "full_floor_f": [],
                  "tenancy_status_desc": [],
                  "tenancy_status_reason_desc": [],
                  "tenancy_status_reason_notes": []
                }
              }

              Never create an empty placeholder record.

              ================================================================
              CONTEXT ANCHORING
              ================================================================

              Use only values that are expressly tied to the applicable tenant's
              demised premises in the lease, amendment, schedule, exhibit, drawing,
              or measurement report.

              Prefer tenant-specific premises schedules, floor schedules, suite
              schedules, amendments, and drawing labels over general building
              descriptions, addresses, cadastral references, and unrelated tenants.

              Ignore building-wide totals, common areas, addresses, postal codes,
              elevator ranges, and technical room references unless they are
              expressly part of the tenant's demised premises.

              If the same arrangement appears in multiple sources, keep the most
              specific and controlling version only once.

              ================================================================
              CONTROLLING PREMISES
              ================================================================

              First identify the applicable tenant's controlling demised
              premises.

              Use this source priority:

              1. Latest executed amendment expressly changing the premises.
              2. Executed lease premises clause.
              3. Lease summary consistent with the executed premises clause.
              4. Lease-specific premises or floor schedule.
              5. Tenant-specific measurement or NEN 2580 schedule.
              6. Lease-specific exhibit, appendix, floor plan, or drawing.

              Apply executed expansions, contractions, surrenders, relocations,
              substitutions, renewals, and terminations from their stated
              effective dates.

              A later amendment overrides only the premises terms it expressly
              changes. Retain original terms not expressly changed.

              Extract only records clearly connected to the applicable tenant's
              demised premises. Deduplicate the same arrangement when repeated
              across sources.

              ================================================================
              RECORD CREATION
              ================================================================

              A valid record requires at least one of:

              - a supported floor or level; or
              - an expressly identified suite, unit, or internal space
                designation.

              Create separate records when supported floor, suite, area,
              full-floor flag, status, status reason, effective date, or premises
              arrangement differs.

              Preserve a combined floor designation as one record when one
              aggregate area applies to multiple floors and separate floor areas
              are not expressly stated.

              Example:

              "1,779.7 square metres on the 13th and 14th floors"

              Return:

              floor_number = "13th and 14th floors"
              arrangement_space_area = "1779.7"
              ref_arrangement_space_area_uom_desc = "SqM"

              Never divide or apportion an aggregate area among multiple floors.

              Do not create separate records for office, warehouse, storage, or
              other space types unless each component has a supported floor,
              suite, unit, or demised-space designation.

              ================================================================
              FIELD RULES
              ================================================================

              floor_number
              ------------

              Return the floor designation exactly as stated in the controlling
              source.

              Examples:

              - "-1"
              - "00"
              - "0"
              - "01"
              - "Ground Floor"
              - "1st floor"
              - "First Floor"
              - "Mezzanine"
              - "Basement"
              - "13th and 14th floors"
              - "Floors 3-5"

              Do not convert numeric and written floor designations.

              If an expressly demised suite has no supported floor, return ""
              for floor_number and retain the record.

              Do not derive a floor from an address, suite number, room number,
              postal code, area, drawing, elevator range, building identifier,
              or technical schedule.

              suite_number
              ------------

              Return the internal suite, unit, office, or space designation.

              Remove the introductory label:

              - "Suite 500" becomes "500"
              - "Unit 2C" becomes "2C"
              - "Office 5.01" becomes "5.01"
              - "Space A" becomes "A"
              - "Unit B-12" becomes "B-12"

              Do not extract a street number, house number, building number,
              cadastral number, or address suffix as suite_number.

              Example:

              Do not extract "2C" from "Trompenburgstraat 2C" unless the lease
              separately identifies "Suite 2C", "Unit 2C", or equivalent.

              arrangement_space_area
              ----------------------

              Return only the expressly stated numeric leased area associated
              with the corresponding record.

              Associate an area only when connected through the same sentence,
              bullet, table row, schedule row, subordinate floor heading, or
              lease-specific plan label. Same-page proximity alone is
              insufficient.

              Remove approximation wording, units, measurement bases, and
              thousands separators. Preserve stated decimal precision.

              Examples:

              - "1,193.6 sq m" becomes "1193.6"
              - "19,167.58 sq m" becomes "19167.58"
              - "390,44 sq m" becomes "390.44"
              - "1.239 sq m" becomes "1239" when "." is a thousands separator
              - "1.239,50 sq m" becomes "1239.50"

              Never calculate, estimate, subtract, convert, divide, derive, or
              apportion an area.

              Do not use building-wide, cadastral, land, energy-label, or
              unrelated common-area measurements.

              If no separate area is expressly stated for a valid record,
              return "".

              ref_arrangement_space_area_uom_desc
              -----------------------------------

              Return only one of:

              - "--"
              - "SqM"
              - "SqFt"
              - "Ac"
              - "Ha"
              - "SqKm"
              - "SqMi"

              Normalize as follows:

              - m², m2, sqm, sq m, square metre or square metres -> "SqM"
              - ft², ft2, sqft, sq ft, square foot or square feet -> "SqFt"
              - acre or acres -> "Ac"
              - hectare or hectares -> "Ha"
              - km², km2, sq km or square kilometres -> "SqKm"
              - mi², mi2, sq mi or square miles -> "SqMi"

              Do not include LFA, GFA, GVO, VVO, BVO, NVO, rentable, lettable,
              or usable in this field.

              Do not infer or convert a unit.

              If arrangement_space_area is empty or its unit is unsupported,
              return "--".

              full_floor_f
              ------------

              Return only:

              - "--"
              - "Y"
              - "N"

              Return "Y" only when the controlling source expressly states or
              clearly establishes that the tenant leases the entire floor.

              Examples:

              - "the entire 5th floor"
              - "the whole of the 5th floor"
              - "all space on the 5th floor"
              - an incorporated schedule clearly identifying the complete floor
                as the tenant's demised premises

              Return "N" only when the controlling source expressly states or
              clearly establishes that the tenant leases part of a floor.

              Examples:

              - "part of the 5th floor"
              - "a portion of the 5th floor"
              - a controlling schedule showing multiple units on the floor and
                identifying the tenant's unit

              A suite designation alone does not always prove that the suite is
              less than the entire floor. Return "N" only when a partial-floor
              arrangement is supported.

              Otherwise return "--".

              Do not infer the flag from common-area rights, apparent area size,
              the number of named tenants, or the absence of other tenants.

              tenancy_status_desc
              -------------------

              Return only:

              - "Expired"
              - "Future"
              - "Gone"
              - "Moving"
              - "No Longer Tenant"
              - "Occupying"
              - "Unknown"

              Use an expressly supplied current processing date only when one is
              present in the context.

              Apply these rules:

              - "Occupying": an executed lease or amendment is in effect on the
                supplied date, or current occupancy is expressly stated.
              - "Future": an executed lease commencement date is after the
                supplied date.
              - "Expired": the lease expired before the supplied date with no
                supported extension, renewal, or holdover.
              - "Gone": an executed surrender or premises amendment removed the
                record from the tenant's premises.
              - "Moving": an executed relocation is pending or the document
                expressly identifies the tenant as moving from the record.
              - "No Longer Tenant": an executed termination or express statement
                establishes that the tenant no longer leases or occupies the
                record.
              - "Unknown": no other allowed status is reliably supported.

              For an effective relocation already completed by the supplied
              date, use "Gone" for the old premises and "Occupying" for the
              replacement premises.

              Do not determine status from upload dates, PDF metadata,
              signature-platform timestamps alone, drafts, unsigned proposals,
              marketing documents, or unincorporated availability schedules.

              tenancy_status_reason_desc
              --------------------------

              Return a concise reason corresponding to tenancy_status_desc.

              Use these preferred mappings:

              - Occupying -> "Executed lease in effect"
              - Future -> "Lease commencement date is in the future"
              - Expired -> "Lease term expired"
              - Gone -> "Premises surrendered by executed amendment"
              - Moving -> "Tenant relocated by executed amendment"
              - No Longer Tenant -> "Lease terminated by executed agreement"
              - Unknown -> "Status not stated"

              Adapt the reason only when the supported event differs, while
              keeping it concise and factual.

              Do not include dates, citations, analysis, or confidence language.

              tenancy_status_reason_notes
              ---------------------------

              Return concise factual support for the status and reason.

              Include supported commencement, expiration, amendment, surrender,
              relocation, or termination dates and the affected floor or suite.

              Do not include citations, page numbers, clause numbers, confidence
              scores, reasoning steps, or unsupported conclusions.

              If no useful supporting fact is stated, return "".

              ================================================================
              AREA DETAIL AND MEASUREMENT SOURCES
              ================================================================

              Prefer detailed floor-level or suite-level areas over a duplicated
              aggregate area only when all detailed areas are expressly stated,
              apply to the same premises, and reconcile with the aggregate.

              Arithmetic may be used only to validate reconciliation. Never
              output a calculated value.

              Do not return both aggregate and detailed records when doing so
              double counts the same premises.

              Use a NEN 2580 report, measurement schedule, tenant overview, floor
              plan, or drawing only when clearly linked to the tenant's premises
              through incorporation, tenant, address, floor, suite, component, or
              area reconciliation.

              Exclude building totals, unrelated tenants, parking, installation
              areas, traffic areas, sanitary areas, voids, measurement
              corrections, and separately stated common-area allocations.

              A common-area share may remain included in the tenant's area when
              the lease defines the aggregate as the tenant's leased or lettable
              area. Do not create a separate common-area record.

              ================================================================
              AMENDMENTS
              ================================================================

              Apply an executed amendment from its stated effective date.

              Retain original premises terms not expressly changed.

              Keep added, surrendered, relocated, and replacement premises
              separate when their designations, statuses, or effective dates
              differ.

              Do not treat surrendered premises as currently occupied.

              Do not treat replacement premises as effective before the stated
              effective date.

              Use only expressly stated revised or remaining areas. Never
              calculate a remaining area by subtraction.

              ================================================================
              EXCLUSIONS
              ================================================================

              Exclude:

              - parking, vehicle storage, bicycle storage, and loading areas;
              - shared facilities not included in the demised premises;
              - addresses, postal codes, building IDs, and registration records;
              - unrelated tenants and building-wide totals;
              - technical, construction, mechanical, electrical, HVAC,
                fire-safety, elevator, staircase, floor-load, and finish details;
              - energy-label, cadastral, and land areas;
              - drawing, project, report, and certificate numbers;
              - blank templates, drafts, unsigned alternatives, and unexercised
                options; and
              - marketing availability not incorporated into the tenant's lease.

              ================================================================
              FINAL CHECK
              ================================================================

              Before returning, verify:

              - the output contains only the "Floor-Suite-Table" object;
              - it contains exactly the eight required arrays;
              - all arrays have equal length;
              - each record has floor_number, suite_number, or both;
              - every record belongs to the applicable tenant's premises;
              - every area is expressly stated and correctly associated;
              - no value was calculated or converted;
              - no detailed record duplicates an aggregate record;
              - dropdown fields contain only allowed values;
              - duplicate and excluded records are removed; and
              - the output is valid JSON.

          - role: system
            raw: true
            content: |
              The following examples define the required extraction behavior.
              Do not reuse example values unless they appear in the supplied
              context.

              ================================================================
              EXAMPLE 1: FLOOR-BY-FLOOR AREAS
              ================================================================

              Context:

              "A total of approximately 1,857.7 m² LFA, distributed as follows:
              2nd floor: approximately 60 m² LFA storage space;
              13th floor: approximately 1,193.6 m² LFA office space;
              14th floor: approximately 586.1 m² LFA office space."

              The supplied current processing date falls within the executed
              lease term. Whole-floor status is not established.

              Result:

              {
                "Floor-Suite-Table": {
                  "floor_number": [
                    "2nd floor",
                    "13th floor",
                    "14th floor"
                  ],
                  "suite_number": [
                    "",
                    "",
                    ""
                  ],
                  "arrangement_space_area": [
                    "60",
                    "1193.6",
                    "586.1"
                  ],
                  "ref_arrangement_space_area_uom_desc": [
                    "SqM",
                    "SqM",
                    "SqM"
                  ],
                  "full_floor_f": [
                    "--",
                    "--",
                    "--"
                  ],
                  "tenancy_status_desc": [
                    "Occupying",
                    "Occupying",
                    "Occupying"
                  ],
                  "tenancy_status_reason_desc": [
                    "Executed lease in effect",
                    "Executed lease in effect",
                    "Executed lease in effect"
                  ],
                  "tenancy_status_reason_notes": [
                    "The supplied current processing date falls within the executed lease term.",
                    "The supplied current processing date falls within the executed lease term.",
                    "The supplied current processing date falls within the executed lease term."
                  ]
                }
              }

              Do not also return the aggregate 1,857.7 square metre record.

              ================================================================
              EXAMPLE 2: ADDRESS SUFFIX IS NOT A SUITE
              ================================================================

              Context:

              "The leased property at Trompenburgstraat 2C has a total size of
              approximately 998.10 m² LFA office space located on the 5th floor,
              including a share in the general areas."

              The supplied current processing date falls within the executed
              lease term. Whole-floor status is not established.

              Result:

              {
                "Floor-Suite-Table": {
                  "floor_number": [
                    "5th floor"
                  ],
                  "suite_number": [
                    ""
                  ],
                  "arrangement_space_area": [
                    "998.10"
                  ],
                  "ref_arrangement_space_area_uom_desc": [
                    "SqM"
                  ],
                  "full_floor_f": [
                    "--"
                  ],
                  "tenancy_status_desc": [
                    "Occupying"
                  ],
                  "tenancy_status_reason_desc": [
                    "Executed lease in effect"
                  ],
                  "tenancy_status_reason_notes": [
                    "The supplied current processing date falls within the executed lease term."
                  ]
                }
              }

              Do not extract "2C" as suite_number because it appears only in the
              property address. Do not infer full_floor_f from common-area rights.

              ================================================================
              EXAMPLE 3: TENANT-SPECIFIC MEASUREMENT DETAIL
              ================================================================

              Context:

              The controlling premises clause states:

              "Warehouse: 19,167.58 m² LFA.
              Office: 179.96 m² LFA."

              An incorporated tenant-specific NEN 2580 schedule states:

              "Industry, building floor 0: 19,167.58 m² LFA.
              Office, building floor 0: 92.65 m² LFA.
              Office, building floor 1: 87.31 m² LFA."

              The executed commencement date is after the supplied current
              processing date.

              Result:

              {
                "Floor-Suite-Table": {
                  "floor_number": [
                    "0",
                    "0",
                    "1"
                  ],
                  "suite_number": [
                    "",
                    "",
                    ""
                  ],
                  "arrangement_space_area": [
                    "19167.58",
                    "92.65",
                    "87.31"
                  ],
                  "ref_arrangement_space_area_uom_desc": [
                    "SqM",
                    "SqM",
                    "SqM"
                  ],
                  "full_floor_f": [
                    "--",
                    "--",
                    "--"
                  ],
                  "tenancy_status_desc": [
                    "Future",
                    "Future",
                    "Future"
                  ],
                  "tenancy_status_reason_desc": [
                    "Lease commencement date is in the future",
                    "Lease commencement date is in the future",
                    "Lease commencement date is in the future"
                  ],
                  "tenancy_status_reason_notes": [
                    "The executed lease commencement date is after the supplied current processing date.",
                    "The executed lease commencement date is after the supplied current processing date.",
                    "The executed lease commencement date is after the supplied current processing date."
                  ]
                }
              }

              Do not also return the aggregate 179.96 square metre office record.

              ================================================================
              EXAMPLE 4: SURRENDER AND RELOCATION
              ================================================================

              Context:

              "Tenant leases Suite 400, comprising 650 m² LFA on the 4th floor."

              An executed amendment states:

              "Effective 1 September 2026, Tenant surrenders Suite 400 on the
              4th floor and relocates to the entire 5th floor, comprising
              1,100 m² LFA and designated as Suite 500."

              The supplied current processing date is after 1 September 2026.

              Result:

              {
                "Floor-Suite-Table": {
                  "floor_number": [
                    "4th floor",
                    "5th floor"
                  ],
                  "suite_number": [
                    "400",
                    "500"
                  ],
                  "arrangement_space_area": [
                    "650",
                    "1100"
                  ],
                  "ref_arrangement_space_area_uom_desc": [
                    "SqM",
                    "SqM"
                  ],
                  "full_floor_f": [
                    "--",
                    "Y"
                  ],
                  "tenancy_status_desc": [
                    "Gone",
                    "Occupying"
                  ],
                  "tenancy_status_reason_desc": [
                    "Premises surrendered by executed amendment",
                    "Executed lease in effect"
                  ],
                  "tenancy_status_reason_notes": [
                    "Suite 400 on the 4th floor was surrendered effective 1 September 2026.",
                    "The amendment relocated the tenant to Suite 500 comprising the entire 5th floor effective 1 September 2026."
                  ]
                }
              }

          - role: user
            content: =global-context/self.ascii-formatted-clustered

          - role: user
            raw: true
            content: |
              Extract the applicable tenant's supported floor, suite, unit, or
              demised-space arrangements from the complete lease context above.

              Apply controlling executed amendments and avoid duplicated
              aggregate and detailed areas.

              Never calculate, convert, estimate, subtract, divide, or apportion
              an area.

              Return only the required valid JSON object with these equal-length
              arrays:

              - floor_number
              - suite_number
              - arrangement_space_area
              - ref_arrangement_space_area_uom_desc
              - full_floor_f
              - tenancy_status_desc
              - tenancy_status_reason_desc
              - tenancy_status_reason_notes
