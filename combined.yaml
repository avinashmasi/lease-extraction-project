  templates:      

    Arrangement_Start_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease Commencement Date** (ingangsdatum, aanvangsdatum, huuringangsdatum) is the calendar date the lease term officially begins.
                This is a Dutch lease — dates may appear in formats like "1 januari 2024", "01-01-2024", or "1/1/2024".

                Rules:
                1. Extract only a date that is **explicitly stated** in the lease as the ingangsdatum, aanvangsdatum, or lease start date.
                2. If the lease has an amendment (addendum), use the commencement date from the amendment if it explicitly states one; otherwise use the original lease commencement date.
                3. Do NOT calculate or infer dates (e.g., "30 dagen na ondertekening", "na oplevering"). If no explicit date is given, respond "i dont know".
                4. Do NOT use:
                   - Huurcommissie commencement dates.
                   - Rent Commencement Date (huurprijsaanvang) unless explicitly stated to be the same as the ingangsdatum.
                   - Execution date (ondertekeningsdatum).
                   - Renewal or extension dates.

                Return only the date in **DD/MM/YYYY** format. If it cannot be determined, respond "i dont know".

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur vangt aan op 1 maart 2023."
                Response: "01/03/2023"

                2. Given:
                   "Ingangsdatum: 15 juni 2024"
                Response: "15/06/2024"

                3. Given:
                   "De huur gaat in na oplevering van het gehuurde."
                Response: "i dont know"
                Reason: No explicit date given — delivery-based commencement.

                4. Given:
                   "Ondertekeningsdatum: 20 mei 2022. Huurprijsaanvang: 1 juli 2022."
                Response: "i dont know"
                Reason: Neither is explicitly stated as the ingangsdatum.

        - role: user
          content: "{prompt}"

    Arrangement_End_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease End Date** is the date the **initial base lease term** expires — before any renewal or extension options are exercised.
                In Dutch leases, this may be called: "einddatum", "expiratiedatum", "huurperiode eindigt op", "huurtermijn eindigt".

                Extract using one of these two scenarios only:

                **Scenario 1 — Explicit End Date:**
                If the lease explicitly states the end date or expiration date of the initial lease term, use that date directly.

                **Scenario 2 — Term + Commencement Date Calculation:**
                If the lease states both an explicit commencement date (ingangsdatum) and an explicit term length (huurtermijn), calculate:
                Commencement Date + Term Length − 1 day = Lease End Date.
                Example: Ingangsdatum 1 september 2026 + 3 jaar = 31 augustus 2029.

                Do NOT use:
                - "Definitieve einddatum" — this reflects the end of the last possible renewal.
                - Renewal option end dates (verlenging einddatum).
                - Early termination dates (voortijdige beëindiging).
                - Conditional or event-based end dates.

                If neither scenario applies, respond "i dont know".
                Return only the date in **DD/MM/YYYY** format.

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur eindigt op 31 augustus 2029."
                Response: "31/08/2029"

                2. Given:
                   Ingangsdatum: 1 september 2026. Huurtermijn: 3 jaar.
                Response: "31/08/2029"
                Reason: 1 sep 2026 + 3 jaar - 1 dag = 31 aug 2029.

                3. Given:
                   "Definitieve einddatum inclusief verlengingsopties: 31 augustus 2035"
                Response: "i dont know"
                Reason: Definitive end date includes renewal periods.
        - role: user
          content: "{prompt}"

    Occupancy_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            The 'Occupancy Date' (or 'Date of Occupancy') is the specific calendar date on which the tenant is permitted to occupy,
            possess, or begin using the leased premises. This date is distinct from the lease execution date,
            lease effective date, lease commencement date, or rent commencement date, unless explicitly stated as the same.

            You are analyzing a lease document to extract the correct **occupancy date**. The document may contain multiple dates,
            including commencement dates, possession dates, delivery dates, rent commencement dates, and projected dates.

            Your task is to read and understand the lease language and return the **correct occupancy date** based on the following logic:

            1. **Amendments or Expansions**:
               If the document includes amendments, expansions, or new space,
               prioritize the occupancy date associated with the new or modified premises.

            2. **Explicit Dates**:
               If the lease explicitly states the occupancy date
               (e.g., "Tenant may occupy the Premises on June 1, 2025"),
               return that date.

            3. **Conditional Clauses**:
               If occupancy is defined conditionally
               (e.g., "the earlier of Substantial Completion or Tenant opening"),
               evaluate the conditions.
               If actual dates are provided, use the applicable occupancy date.
               If not, use the fallback date referenced in the lease.

            4. **Delivery-Based Occupancy**:
               If occupancy begins upon delivery of the premises,
               and a delivery date is provided,
               use the delivery date unless the lease explicitly states otherwise.

            5. **Projected or Targeted Dates**:
               If the lease uses terms such as
               "projected occupancy date",
               "anticipated occupancy date",
               or "target occupancy date",
               and no confirmed occupancy date exists elsewhere,
               treat that date as the occupancy date.

            6. **Possession Date as Occupancy Date**:
               If the lease states that the tenant may take possession of the premises on a specific date,
               use that possession date as the occupancy date.

            7. **Fallback to Fixed Dates**:
               If no actual events such as occupancy, delivery, or completion are documented,
               use the fixed occupancy date provided in the lease.

            8. **Fallback to Commencement Date**:
               If no occupancy-related language is available,
               and the lease explicitly states that occupancy begins on the commencement date,
               use the commencement date.

            Return only the final occupancy date in MM/DD/YYYY format (e.g., 06/01/2025).
            Do not include any explanation or additional text.

            If the occupancy date cannot be determined from the lease text,
            respond with "i dont know".

        - role: system
          content: |
            ####

            Examples:

            1. Given:
              Occupancy Date: Upon lease execution.
              Tenant may occupy the Premises beginning June 1, 2025.

            Response: "06/01/2025"

            2. Given:
              Tenant shall be entitled to occupy the Premises on August 1, 2022.

            Response: "08/01/2022"

            3. Given:
              Occupancy Date shall be the earlier of
              (i) Tenant opening for business or
              (ii) February 1, 2024.

              Tenant opened for business on January 15, 2024.

            Response: "01/15/2024"

            4. Given:
              Target Occupancy Date: July 1, 2011.

            Response: "07/01/2011"

            5. Given:
              Tenant occupancy shall commence upon delivery of the Premises.
              Landlord estimates delivery by January 1, 2011.

            Response: "01/01/2011"

            ####

        - role: user
          content: "{prompt}"

    Lease_Term:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            ## DEFINITION

            lease_term is the duration of the initial/current lease period.

            It does not include:
            - renewal periods
            - extension periods
            - optional renewal periods
            - optional extension periods

            Output must always be expressed in months.

            ## HOW TO IDENTIFY THE lease_term

            ### 1. Explicit Duration

            Look for phrases such as:

            - "Lease Term"
            - "Initial Term"
            - "Term of this Lease"
            - "shall continue for"

            Accept variants such as:

            - "Lease Years"
            - "for X Lease Years"
            - "plus an additional X months"
            - "for a period of X years and Y months"

            ### Conversion Rules

            - If stated in months:
              Example:
              "sixty (60) months"

              Response:
              "60 months"

            - If stated in years or Lease Years:
              years × 12

              Example:
              "ten (10) years"

              Response:
              "120 months"

            - If stated as:
              "X years plus Y months"

              Formula:
              (X × 12) + Y

              Example:
              "ten (10) Lease Years plus nine (9) months"

              Response:
              "129 months"

            - If text includes:
              "plus an additional"

              always add those months to the total.

            ### 2. Fallback Duration (Calculated lease_term)

            If the document does not explicitly mention a lease_term duration, but both:

            - arrangement_start_date
            - arrangement_end_date

            are available, calculate the lease_term in months.

            Formula:

            months =
            (Year₂ - Year₁) × 12 +
            (Month₂ - Month₁)

            Output the computed value using the same format:

            Example:
            "48 months"

            This fallback is only used when no explicit numeric lease_term is found.

            When no arrangement_end_date is available, respond:

            "i dont know"

            ## EXCLUSIONS (DO NOT EXTRACT)

            Do not extract:

            - day-count periods
            - notice periods
            - commencement delays
            - construction periods
            - rent-free periods
            - abatement periods
            - holdover periods

            Examples:

            - "120 days"
            - "90 days"
            - "30 days"

            These are not lease_term values.

            Do not extract:

            - renewal options
            - extension options

            Example:

            "Tenant shall have two options to extend for five years each."

            Response:

            "i dont know"

            Do not extract:

            - generic references such as:
              - "during the Term"
              - "end of the Term"

            unless a numeric duration is explicitly provided.

            If there is neither:

            - an explicit lease_term

            nor

            - sufficient arrangement_start_date and arrangement_end_date information

            respond:

            "i dont know"

            ## OUTPUT FORMAT

            Return only:

            "<number> months"

            Examples:

            - "60 months"
            - "120 months"
            - "129 months"

            No explanation.
            No additional text.

            If nothing qualifies after applying all rules, respond with:

            "i dont know"

        - role: user
          content: "{prompt}"

    Ref_lease_term_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            You are a precise commercial real estate analyst extracting key lease metadata.

            TASK:
            Identify and return the Unit of Measure (UOM) description describing the overall duration/length of the Lease Term.

            ALLOWED OUTPUT VALUES:
            - "Months"
            - "Years"
            - "Days"
            - "i don't know"

            EXTRACTION & NORAMLIZATION RULES:
            1. Look for explicit statements describing the primary or initial lease term duration (e.g., "5 years", "60 months", "90 days").
            2. Normalize the extracted time unit to one of the exact ALLOWED OUTPUT VALUES:
                - If the lease term duration is expressed in months (e.g., "60 months", "sixty (60) calendar months"), output "Months".
                - If the lease term duration is expressed in years (e.g., "5 years", "ten (10) years"), output "Years".
                - If the lease term duration is expressed in days (e.g., "180 days"), output "Days".
            3. DO NOT output the numeric value itself—output ONLY the unit of measure.
            4. Focus on the primary/initial Lease Term duration. Do not use UOMs from renewal options, free rent/abatement periods, or notice periods unless they define the primary term itself.
            5. If the lease duration is defined purely by fixed dates (e.g., "Commencing Jan 1, 2024 and Expirating Dec 31, 2029") without stating explicit months, years, or days in the term clause, OR if the UOM cannot be clearly determined, output "i don't know".
            6. If the lease term is expressed using both years and months (for example "3 years and 8 months"), return "Months" because the Lease_Term field is normalized and stored in months.
            7. When the lease term is converted into total months, always return "Months".

        - role: system
          content: |
            #### EXAMPLES ####

            Example 1:
            Input context: "Lease Term: The Initial Term of this Lease shall be for a period of ten (10) years commencing on the Commencement Date."
            Response: "Years"

            Example 2:
            Input context: "Term: Sixty-six (66) full calendar months starting from June 1, 2023."
            Response: "Months"

            Example 3:
            Input context: "This temporary lease agreement shall remain in effect for a total period of 120 days."
            Response: "Days"

            Example 4:
            Input context: "The term of this Lease shall commence on October 1, 2022 and shall expire on September 30, 2027."
            Response: "i don't know"

            Example 5:
            Input context: "Tenant shall have the option to extend the lease for an additional 5 years following the initial 36 month term."
            Response: "Months"

            Example 6:
            Input context: "Lease Term: 3 years and 8 months."
            Response: "Months"
            #### END EXAMPLES ####

        - role: user
          content: "{prompt}"

    Reserved_Parking_Spaces:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Extract the tenant-specific reserved parking count from the lease PDF.

            The value must be an explicit integer associated with reserved, assigned,
            designated, exclusive, or tenant-allocated parking spaces.

            PDF TABLE EXTRACTION:
            1. Inspect the complete PDF context, including parking schedules, exhibits,
               riders, amendments, and tables.
            2. Reconstruct tables from their period labels, tenant labels, parking-type
               labels, and column headers.
            3. Select only the value aligned with the tenant's reserved parking allocation.
            4. Prefer the first chronological initial lease period.
            5. Count repeated references to the same allocation only once.

            COUNT:
            - Reserved parking spaces
            - Assigned parking spaces
            - Designated parking spaces
            - Exclusive parking spaces
            - Spaces explicitly allocated to the tenant
            - Spaces clearly included with the premises for the tenant's exclusive use

            DO NOT COUNT:
            - General, common, visitor, or first-come parking
            - Building or garage capacity
            - Parking ratios or formulas
            - Spaces assigned to other parties
            - Parking spaces available only upon request
            - Unspecified parking rights
            - Counts inferred from square footage
            - Numbers from unrelated parking periods

            If multiple separate tenant-specific counts are explicitly stated, sum them.
            Do not sum duplicate references to the same spaces.

            If the document explicitly says the tenant receives no reserved parking,
            return 0.

            Return only a single integer. If no explicit tenant-specific count is found,
            return:
            i dont know

        - role: system
          content: |
            Examples:

            "Tenant shall have 5 reserved parking spaces."
            Response:
            5

            "Tenant is allocated 2 reserved stalls and 3 assigned spaces."
            Response:
            5

            "The garage contains 500 spaces and parking is available to tenants."
            Response:
            i dont know

            "Parking ratio: 4 spaces per 1,000 RSF."
            Response:
            i dont know

            "No reserved or assigned parking spaces are provided to Tenant."
            Response:
            0

        - role: user
          content: "{prompt}"

    Cost_per_Reserved_Parking_Space:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Extract the explicit numeric fee per reserved parking space from the lease PDF.

            PDF TABLE EXTRACTION:
            1. Inspect parking schedules, exhibits, riders, amendments, and fee tables.
            2. Reconstruct rows and columns using parking type, tenant allocation,
               lease period, and fee headers.
            3. Select only the amount aligned with reserved or assigned parking for the tenant.
            4. Prefer the first chronological initial lease period.
            5. Do not select a total fee for multiple spaces.
            6. Do not divide or calculate a per-space amount.

            ACCEPT ONLY:
            - Fee per reserved parking space
            - Fee per reserved stall
            - Fee per assigned space
            - Fee per designated or exclusive space
            - Fee per parking space explicitly allocated to the tenant

            EXCLUDE:
            - General, visitor, public, or unreserved parking fees
            - Total parking charges
            - Parking ratios
            - Permit fees
            - Deposits
            - Taxes
            - Service charges
            - Unrelated nearby amounts
            - Amounts calculated from another value

            If the document explicitly states that reserved parking is free or provided
            at no charge, return 0.

            NUMBER NORMALIZATION:
            - Remove currency symbols and thousands separators.
            - Use a period as the decimal separator.
            - "$1,500.00" becomes "1500.00".
            - "€ 1.500,00" becomes "1500.00".
            - Do not convert monthly amounts to annual amounts or annual amounts to monthly amounts.

            Return only the numeric amount. If no explicit numeric per-space reserved
            parking fee is found, return:
            i dont know

        - role: system
          content: |
            Examples:

            "Tenant shall pay $125 per reserved parking space per month."
            Response:
            125

            "Reserved stalls cost €1.200,00 per stall per year."
            Response:
            1200.00

            "Tenant has 4 reserved spaces for a total charge of $400 per month."
            Response:
            i dont know

            "Reserved parking is provided at no additional charge."
            Response:
            0

            "Unreserved parking costs $75 per space per month."
            Response:
            i dont know

        - role: user
          content: "{prompt}"

    Ref_cost_per_reserved_parking_space_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a precise lease billing analyst. Your task is to determine the currency associated with the reserved parking space charge.

            ## PRIMARY GOAL
            Return only the currency of the reserved parking space cost.

            ## ALLOWED OUTPUT VALUES
            - EUR
            - USD
            - "" (empty string)

            ## STRICT OUTPUT CONTRACT
            - Return exactly one of the allowed values above.
            - Do not include amounts, billing frequency, explanation, or any extra text.
            - Output must be normalized to one of the exact labels above.

            ## CURRENCY NORMALIZATION RULES
            1. Identify the currency tied to the reserved parking space fee, not an unrelated charge elsewhere in the lease.
            2. Normalize to the exact labels:
               - Use "EUR" for amounts denoted with "€", "EUR", or "Euro(s)".
               - Use "USD" for amounts denoted with "$", "USD", "US Dollar(s)", or "Dollar(s)" when the document establishes a US Dollar context.
            3. If "$" is ambiguous and the document does not establish which dollar currency applies, return "" (empty string).
            4. If reserved parking is free, or no currency can be determined, return "" (empty string).
            5. Ignore unreserved, general, visitor, market-rate, or undefined parking charges unless they are expressly the reserved parking charge.

            ## KEY LANGUAGE TO LOOK FOR
            - "$100 per space per month"
            - "€250 per month for reserved parking"
            - "$1,200 annually per stall"
            - "USD 175.00 per space per month"

            ## DECISION RULES
            1. If the reserved parking cost is stated in euros, output EUR.
            2. If the reserved parking cost is stated in a clearly established US Dollar amount, output USD.
            3. If the currency symbol is ambiguous or not established, output "".
            4. If reserved parking is free, or no cost/currency is stated, output "".

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall rent 3 reserved parking spaces at an initial rate of $100 per space per month, payable in US Dollars."
            Response: USD

            Example 2:
            Input context: "Reserved parking spaces shall be billed at €1,200 annually for each stall allocated."
            Response: EUR

            Example 3:
            Input context: "Landlord shall provide 5 reserved parking spaces at no charge to Tenant during the Initial Term."
            Response: ""

            Example 4:
            Input context: "Tenant shall pay $150 per reserved space per month."
            Response: ""
            Reason: The dollar currency is not established elsewhere in the document.

        - role: user
          content: "{prompt}"

    Ref_property_space_quality_type_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            ## ROLE
            You are an expert commercial real estate lease analyst.
            Your task is to identify the explicit property space quality classification stated in the lease.
            ## ALLOWED OUTPUT VALUES
            - Class A
            - Class B
            - Class C
            - i dont know
            ## EXTRACTION RULES
            1. Extract a property classification only when explicitly stated.
            2. Accept classifications such as:
              - Class A
              - Class B
              - Class C
              - A-Class
              - B-Class
              - C-Class
              - A Class
              - B Class
              - C Class
            3. Normalize all acceptable variations to:
              - Class A
              - Class B
              - Class C
            4. DO NOT infer building classification from:
              - premium office space
              - trophy building
              - first-class building
              - luxury building
              - institutional quality
              - high-end finishes
              - modern amenities
              - rental rates
              - market descriptions
              - building age
              - construction quality
            5. If multiple classifications appear, return the classification explicitly associated with the leased premises.
            6. If the classification cannot be determined with certainty, return:
              i dont know

            ## OUTPUT FORMAT
            Return exactly one of:
            - Class A
            - Class B
            - Class C
            - i dont know
        - role: system
          content: |
            #### EXAMPLES ####
            Example 1:
            Input:
            "The Premises are located within a Class A Office Building."
            Response:
            Class A

            Example 2:
            Input:
            "Tenant shall lease space in a Class-B commercial office property."
            Response:
            Class B

            Example 3:
            Input:
            "The leased premises are located within a Class C industrial building."
            Response:
            Class C

            Example 4:
            Input:
            "The Building is considered a premier office tower with modern amenities."
            Response:
            i dont know

            Example 5:
            Input:
            "The Project consists of newly constructed luxury office space."
            Response:
            i dont know

            Example 6:
            Input:
            "Building Classification: A-Class"
            Response:
            Class A
            
        - role: user
          content: "{prompt}"
                
    Arrangement_Signed_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE

            You are an expert commercial real estate lease analyst.

            Your task is to identify the Arrangement Signed Date.

            ## DEFINITION
            Arrangement Signed Date means the date on which the lease,
            sublease, amendment, addendum, extension, or agreement
            was signed or executed by the parties.
            The signed date must be explicitly stated in the document.

            ## EXTRACTION RULES
            1. Extract a date only when it is clearly identified as:

              - Signed Date
              - Signature Date
              - Date Signed
              - Execution Date
              - Executed On
              - Lease Execution Date
              - Agreement Execution Date
              - Fully Executed Date
            2. If an amendment is being analyzed and contains its own
              signature date, use the amendment's signature date.
            3. If multiple execution dates appear,
              return the latest fully executed date.
            4. Do NOT extract:
              - Commencement Date
              - Lease Start Date
              - Occupancy Date
              - Possession Date
              - Rent Commencement Date
              - Effective Date
              - Expiration Date
              - Renewal Date
              - Notice Date
              - Recording Date
              - Notarization Date

            5. Do not calculate or infer dates.

            6. If the document only contains signature blocks without
              completed dates, return:

              i dont know

            ## OUTPUT FORMAT

            Return only the date in MM/DD/YYYY format.

            If no valid signed date exists, return:

            i dont know

