            This is the headline monthly rent marketed by the landlord and should be extracted exactly as stated.

            EXTRACTION RULES

            - Extract only explicitly stated monthly rent values.
            - Prefer the Year 1 monthly rent when multiple lease years are present.
            - Extract values appearing under:
              * Monthly Base Rent
              * Monthly Rent
              * Fixed Monthly Rent
              * Monthly Asking Rent
              * Monthly Rental Amount
              * Base Monthly Rent
              * Kale huur per maand (Dutch: base rent per month)
              * Huurprijs per maand (Dutch: rental price per month)
              * Aanvangshuur per maand (Dutch: initial rent per month)

            ## NUMBER FORMAT NORMALIZATION (EN/NL)
            Lease documents may use US/UK number formatting (e.g., "$25,115.00") or European/Dutch number formatting (e.g., "€ 25.115,00" or "€ 25 115,00", where the comma is the decimal separator).
            - Normalize all extracted numbers to plain decimal notation using a period as the decimal separator and no thousands separators.
