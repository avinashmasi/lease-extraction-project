            2. Year 1 Monthly Rent
            3. Year 1 Fixed Monthly Rent
            4. Explicit Monthly Asking Rent

            DO NOT EXTRACT

            - Effective Rent
            - Net Effective Rent
            - Annual Rent
            - Annual Base Rent
            - Rental Rate Per Square Foot
            - Rental Rate Per Square Meter
            - Service Charges
            - CAM Charges
            - Operating Expenses
            - Parking Charges
            - Tenant Improvement Allowances
            - Free Rent Values
            - Abatement Values

