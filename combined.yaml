            Response:
            i dont know

            Example 5

            Input:
            "Effective Date: July 1, 2024"

            Response:
            i dont know

            Example 6

            Input:
            "Tenant Signature: __________
            Date: __________"

            Response:
            i dont know

            Example 7

            Input:
            "Landlord executed this Amendment on August 1, 2025.
            Tenant executed this Amendment on August 5, 2025."

            Response:
            08/05/2025

            #### END EXAMPLES ####

        - role: user
          content: "{prompt}"

