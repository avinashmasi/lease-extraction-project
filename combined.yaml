# file name: en-nl-completions-contacts.yaml
kind: Ontology/v2
name: en-nl-completions-contacts
namespaces:
 self:

  contact_display_name:
    reduction:
      $match:
        key: =global-fields/self.validation
        default: =fuzzy.contact_display_name
        primary: =primary.contact_display_name
        secondary: =secondary.contact_display_name

  first_name:
    reduction:
      $match:
        key: =global-fields/self.validation
        default: =fuzzy.first_name
        primary: =primary.first_name
        secondary: =secondary.first_name

  last_name:
    reduction:
      $match:
        key: =global-fields/self.validation
        default: =fuzzy.last_name
        primary: =primary.last_name
        secondary: =secondary.last_name

  email:
    reduction:
      $match:
        key: =global-fields/self.validation
        default: =fuzzy.email
        primary: =primary.email
        secondary: =secondary.email

  full_phone_number:
    reduction:
      $match:
        key: =global-fields/self.validation
        default: =fuzzy.full_phone_number
        primary: =primary.full_phone_number
        secondary: =secondary.full_phone_number

  fuzzy:

    contact_display_name:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.contact_display_name
          - =secondary.contact_display_name

    first_name:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.first_name
          - =secondary.first_name

    last_name:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.last_name
          - =secondary.last_name

    email:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.email
          - =secondary.email

    full_phone_number:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.full_phone_number
