kind: Ontology/v2

# name - used by external ontologies to reference
#        back to the current instance.
#        this should always be the same as the file base-name
name: en-nl-lease

# minimum version
version: v2.2.126

# entrypoint
entrypoint: abstract

# defaults
defaults:

  # embed metadata in all searches
  search_adorn: false

  # override completion instance confidence with token logits
  completion_logprobs: true

  # default date input style and output format
  kind_date_input_format: 'MDY'
  kind_date_output_format: '%m/%d/%y'

  # turn off highlighted for testing
  abstract_highlight: false
  abstract_highlight_search_length: 128

# namespaces
namespaces:

  # #################################
  # abstract
  # #################################

  abstract:

    # used to specialize prompts and logic for
    # certain locales (a.k.a., jurisdictions), notice
    # it will keep the value if preset, otherwise set to
    # the default, e.g., en-us
    # { "kind": "object" ... "jurisdiction": "en-us" }
    jurisdiction:
      reduction:
        $precedence:
        - $get: jurisdiction
        - $set: en-us

    validation:
      reduction:
        $precedence:
        - $get: validation
        - $set: fuzzy   # fuzzy, primary, secondary

    $classifications:
      reduction:
        $set:
        - name: Lease
          confidence: 1.0

    response_language:
      reduction:
        $precedence:
          - $get: $response_language
          - $set: en  # en - english, es - spanish, jp - japanese, de - german, etc.

    response_encoding:
      reduction:
        $precedence:
          - $get: $response_encoding
          - $eval:
              lang: =abstract.response_language
              expression: "'ascii' if lang == 'en' else 'utf-8'"
          - $set: 'ascii'

    # the following semantics will all run in parallel
    # (i.e., labels with the first letter capitalized run concurrently)
    # however, the collate and join parameters run sequentially

    Terms:
      reduction:
        $collate:
          - =global-fields/self.Arrangement_Start_Date
          - =global-fields/self.Arrangement_End_Date
          - =global-fields/self.Occupancy_Date
          - =global-fields/self.Lease_Term
          - =global-fields/self.Ref_lease_term_uom_desc
          - =global-fields/self.Reserved_Parking_Spaces
          - =global-fields/self.Cost_per_Reserved_Parking_Space
          - =global-fields/self.Ref_cost_per_reserved_parking_space_uom_desc
          - =global-fields/self.Ref_property_space_quality_type_desc
          - =global-fields/self.Arrangement_Signed_Date
          - =global-fields/self.Asking_Rent_Monthly
          - =global-fields/self.Ref_asking_rent_monthly_uom_desc
          - =global-fields/self.Asking_Rent_Yearly
          - =global-fields/self.Ref_asking_rent_yearly_uom_desc
          - =global-fields/self.Effective_Rent_Monthly
          - =global-fields/self.Ref_effective_rent_monthly_uom_desc
          - =global-fields/self.Effective_Rent_Yearly
          - =global-fields/self.Ref_effective_rent_yearly_uom_desc
          - =global-fields/self.Service_Charge_Per_Area_Value
          - =global-fields/self.Ref_service_charge_per_area_value_price_uom_desc
          - =global-fields/self.Number_Of_Month_Free_Rent
          - =global-fields/self.Tenant_Improvement_Allowance
          - =global-fields/self.Ref_tenant_improvement_allowance_uom_desc
          - =global-fields/self.Option_Notes

    # #############################################################################################################
    # Lease_Comp_Details:
    #   reduction:
    #     $collate:
    #       - =global-fields/self.total_leased_space
    #       - =global-fields/self.ref_total_leased_space_uom_desc
    #       - =global-fields/self.ref_lease_activity_type_desc
    #       - =global-fields/self.ref_lease_arrangement_type_desc
    #       - =global-fields/self.total_leased_space_estimated_f
    #       - =global-fields/self.sublease_f
    #       - =global-fields/self.lease_arrangement_reason_type_desc
    #       - =global-fields/self.tenant_status_type_desc
    #       - =global-fields/self.act_1954_f
    #       - =global-fields/self.space_condition_type_desc
    #       - =global-fields/self.arrangement_end_future_action_type_desc
    #       - =global-fields/self.arrangement_end_action_status_type_desc
    #       - =global-fields/self.arrangement_end_future_action_date
    #       - =global-fields/self.arrangement_end_action_status_reason_type_desc

    #############################################################################################################
    # floor_suite:
    #   reduction:
    #     $join:
    #       floor_number:
    #         - =global-fields/self.Floor-Suite-Floor
    #       suite_number:
    #         - =global-fields/self.Floor-Suite-Suite
    #       arrangement_space_area:
    #         - =global-fields/self.Floor-Suite-Space-Size
    #       ref_arrangement_space_area_uom_desc:
    #         - =global-fields/self.Floor-Suite-Space-Size-UOM
    #       full_floor_f:
    #         - =global-fields/self.Floor-Suite-Whole-Floor
    #       tenancy_status_desc:
    #         - =global-fields/self.Floor-Suite-Floor-Status
    #       tenancy_status_reason_desc:
    #         - =global-fields/self.Floor-Suite-Reason
    #       tenancy_status_reason_notes:
    #         - =global-fields/self.Floor-Suite-Reason-Notes

  #############################################################################################################
    # parking:
    #   reduction:
    #     $join:
    #       parking_type_desc:
    #         - =global-fields/self.parking_type_desc
    #       parking_sub_type_desc:
    #         - =global-fields/self.parking_sub_type_desc
    #       number_parking_space:
    #         - =global-fields/self.number_parking_space
    #       parking_cost_monthly:
    #         - =global-fields/self.parking_cost_monthly
    #       parking_cost_monthly_uom:
    #         - =global-fields/self.parking_cost_monthly_uom
    #       parking_comments:
