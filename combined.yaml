  templates:

    Arrangement_Start_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease Commencement Date** (ingangsdatum, aanvangsdatum, huuringangsdatum) is the calendar date the lease term officially begins.
                This is a Dutch lease — dates may appear in formats like "1 januari 2024", "01-01-2024", or "1/1/2024".

                Rules:
                1. Extract only a date that is **explicitly stated** in the lease as the ingangsdatum, aanvangsdatum, or lease start date.
                2. If the lease has an amendment (addendum), use the commencement date from the amendment if it explicitly states one; otherwise use the original lease commencement date.
                3. Do NOT calculate or infer dates (e.g., "30 dagen na ondertekening", "na oplevering"). If no explicit date is given, respond "i dont know".
                4. Do NOT use:
                   - Huurcommissie commencement dates.
                   - Rent Commencement Date (huurprijsaanvang) unless explicitly stated to be the same as the ingangsdatum.
                   - Execution date (ondertekeningsdatum).
                   - Renewal or extension dates.

                Return only the date in **DD/MM/YYYY** format. If it cannot be determined, respond "i dont know".

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur vangt aan op 1 maart 2023."
                Response: "01/03/2023"

                2. Given:
                   "Ingangsdatum: 15 juni 2024"
                Response: "15/06/2024"

                3. Given:
                   "De huur gaat in na oplevering van het gehuurde."
                Response: "i dont know"
                Reason: No explicit date given — delivery-based commencement.

                4. Given:
                   "Ondertekeningsdatum: 20 mei 2022. Huurprijsaanvang: 1 juli 2022."
                Response: "i dont know"
                Reason: Neither is explicitly stated as the ingangsdatum.

        - role: user
          content: "{prompt}"

    Arrangement_End_Date:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            The **Lease End Date** is the date the **initial base lease term** expires — before any renewal or extension options are exercised.
                In Dutch leases, this may be called: "einddatum", "expiratiedatum", "huurperiode eindigt op", "huurtermijn eindigt".

                Extract using one of these two scenarios only:

                **Scenario 1 — Explicit End Date:**
                If the lease explicitly states the end date or expiration date of the initial lease term, use that date directly.

                **Scenario 2 — Term + Commencement Date Calculation:**
                If the lease states both an explicit commencement date (ingangsdatum) and an explicit term length (huurtermijn), calculate:
                Commencement Date + Term Length − 1 day = Lease End Date.
                Example: Ingangsdatum 1 september 2026 + 3 jaar = 31 augustus 2029.

                Do NOT use:
                - "Definitieve einddatum" — this reflects the end of the last possible renewal.
                - Renewal option end dates (verlenging einddatum).
                - Early termination dates (voortijdige beëindiging).
                - Conditional or event-based end dates.

                If neither scenario applies, respond "i dont know".
                Return only the date in **DD/MM/YYYY** format.

        - role: system
          content: |
                Examples:
                1. Given:
                   "De huur eindigt op 31 augustus 2029."
                Response: "31/08/2029"

                2. Given:
                   Ingangsdatum: 1 september 2026. Huurtermijn: 3 jaar.
                Response: "31/08/2029"
                Reason: 1 sep 2026 + 3 jaar - 1 dag = 31 aug 2029.

                3. Given:
                   "Definitieve einddatum inclusief verlengingsopties: 31 augustus 2035"
                Response: "i dont know"
                Reason: Definitive end date includes renewal periods.
        - role: user
