    Tenant_Status_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the Tenant Status Type strictly into one of the allowed categories.

            Do not explain.
            Do not use quotation marks.
            Respond with ONLY the category name.

            Allowed categories:
              - Expired
              - Future
              - Gone
              - Moving
              - No Longer Tenant
              - Occupying
              - Unknown

            Determine the tenant status as of the current date on which this
            extraction is being performed.

            Compare the operative lease commencement date, expiry date,
            termination date, and any exercised break date against the current date.

            Apply the following rules in priority order:

            1. Gone
              Select Gone only if the document explicitly confirms that the
              tenant has vacated, surrendered, or permanently left the premises.

            2. No Longer Tenant
              Select No Longer Tenant only if the document explicitly confirms
              that the tenancy relationship has been terminated or that the
              party has ceased to be the tenant.

            3. Moving
              Select Moving only if the document confirms that the tenant is
              currently relocating or transferring its operations to or from
              another property.

              Do not select Moving merely because:
                - an alternative location is mentioned;
                - the tenant has a future relocation right;
                - the lease contains a break option; or
                - relocation is a condition for exercising a break option.

            4. Expired
              Select Expired if:
                - the operative lease expiry or confirmed termination date is
                  earlier than the current date; and
                - there is no evidence of renewal, extension, holding over,
                  or continued occupation.

            5. Future
              Select Future if:
                - the lease has been signed or executed; and
                - the lease commencement date is later than the current date.

              A future break date, rent review date, payment date, renewal date,
              expiry date, or other future event does not make the tenant
              status Future.

            6. Occupying
              Select Occupying if:
                - the lease commencement date is on or before the current date;
                - the operative lease expiry or termination date is after the
                  current date; and
                - there is no evidence that the tenant has vacated, surrendered
                  the premises, or ceased to be the tenant.

              For an executed lease, physical occupation does not need to be
              explicitly stated if the lease is active according to its
              commencement and end dates.

            7. Unknown
              Select Unknown if:
                - the operative commencement date cannot be identified;
                - the lease dates are incomplete, ambiguous, or conflicting;
                - it is unclear whether the document was executed;
                - the document explicitly states that an unfulfilled condition
                  prevents the lease from becoming effective; or
                - the tenant status cannot otherwise be reliably determined.

            Additional rules:

              - Use only the dates governing the actual lease being classified.
              - Do not use dates from examples, templates, general conditions,
                appendices, headers, footers, signature certificates, or
                unrelated agreements.
              - A break option by itself does not mean that the lease has ended.
              - Use a break date as the termination date only if the document
                confirms that the break option was exercised.
              - Do not assume that a break option has been exercised merely
                because it is available.
              - A renewal option does not mean that the lease has been renewed.
              - Treat a signed lease as active from its stated commencement date
                unless the document explicitly confirms cancellation,
                non-fulfilment of a condition, termination, surrender, or vacation.
              - If the lease is signed before its commencement date, classify
                it as Future.
              - If the commencement date has passed and the lease remains active,
                classify it as Occupying.
              - Return exactly one allowed category.

        - role: user
          content: "{prompt}"

    ACT_1954_F:
