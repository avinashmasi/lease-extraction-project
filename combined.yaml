# file name: en-nl-completions-terms.yaml
# yaml-language-server: $schema=../schemas/ontology.schema.json
# Copyright (C) 2024-2025 CBRE Inc. All rights reserved.
kind: Ontology/v2
name: en-nl-completions-terms
namespaces:

  tokens:

  self:

    Arrangement_Start_Date:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Arrangement_Start_Date
          primary: =primary.Arrangement_Start_Date
          secondary: =secondary.Arrangement_Start_Date

    Arrangement_End_Date:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Arrangement_End_Date
          primary: =primary.Arrangement_End_Date
          secondary: =secondary.Arrangement_End_Date

    Occupancy_Date:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Occupancy_Date
          primary: =primary.Occupancy_Date
          secondary: =secondary.Occupancy_Date

    Lease_Term:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Lease_term
          primary: =primary.Lease_term
          secondary: =secondary.Lease_term

    Ref_lease_term_uom_desc:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Ref_lease_term_uom_desc
          primary: =primary.Ref_lease_term_uom_desc
          secondary: =secondary.Ref_lease_term_uom_desc

    Reserved_Parking_Spaces:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Reserved_Parking_Spaces
          primary: =primary.Reserved_Parking_Spaces
          secondary: =secondary.Reserved_Parking_Spaces

    Cost_per_Reserved_Parking_Space:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Cost_per_Reserved_Parking_Space
          primary: =primary.Cost_per_Reserved_Parking_Space
          secondary: =secondary.Cost_per_Reserved_Parking_Space

    Ref_cost_per_reserved_parking_space_uom_desc:
      reduction:
        $match:
          key: =global-fields/self.validation
          default: =fuzzy.Ref_cost_per_reserved_parking_space_uom_desc
          primary: =primary.Ref_cost_per_reserved_parking_space_uom_desc
          secondary: =secondary.Ref_cost_per_reserved_parking_space_uom_desc

  fuzzy:
    Arrangement_Start_Date:
      reduction:
        $fuzzy:
          $parallel:
          - =primary.Arrangement_Start_Date
          - =secondary.Arrangement_Start_Date

