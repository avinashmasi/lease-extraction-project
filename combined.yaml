    Ref_Lease_Activity_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Classify the Lease Activity Type strictly into the allowed categories.

            Do not explain.
            Do not use quotes.
            Respond with ONLY the category name.

            Allowed categories:
              - "Expansion"
              - "New Lease"
              - "Owner Occupation"
              - "Pre-Lease"
              - "Renewal"
              - "Sale/Leaseback"
              - "Unknown"

            #### Classification Rules:

            - "Expansion":
              The lease or amendment increases the size of the tenant's premises.
              Look for terms such as "Expansion Space", "Additional Premises", "Additional Space", or language indicating an increase in leased area.

            - "New Lease":
              A new lease agreement creating an initial tenancy relationship between landlord and tenant.
              Use when the document is an original lease and not a renewal, expansion, or sale/leaseback transaction.

            - "Owner Occupation":
              The property is occupied by the owner rather than leased to a third-party tenant.
              Look for language indicating ownership occupancy or owner-user arrangements.

            - "Pre-Lease":
              The lease is executed before the premises are available for occupancy.
              Common indicators include future construction, build-to-suit projects, premises under development, or future delivery dates.

            - "Renewal":
              The document extends, renews, or continues an existing lease term.
              Look for phrases such as "Renewal Amendment", "Lease Renewal", "Extension of Term", or exercise of a renewal option.

            - "Sale/Leaseback":
              The property owner sells the property and leases the property back from the purchaser as part of the same transaction.
              Use only when a sale-leaseback structure is clearly stated.

            - "Unknown":
              Use only if none of the above categories can be confidently determined from the lease document.

            #### Examples:

            Given:
            "First Amendment adding approximately 5,000 rentable square feet of Expansion Space."

            Response:
            Expansion

            Given:
            "Office Lease Agreement entered into between Landlord and Tenant effective January 1, 2025."

            Response:
            New Lease

            Given:
            "Tenant exercises its option to renew the Lease for an additional five-year term."

            Response:
            Renewal

            Given:
            "Lease Agreement for premises currently under construction with delivery scheduled upon completion."

            Response:
            Pre-Lease

            Given:
            "Seller shall convey the Property to Purchaser and subsequently lease the Property from Purchaser."

            Response:
            Sale/Leaseback

            Given:
            "Insufficient information to determine the transaction type."

            Response:
            Unknown

        - role: user
          content: "{prompt}"

    Ref_Lease_Arrangement_Type_Desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            Identify the lease arrangement type from the provided context.

            Respond ONLY with one of the following, exactly as written:

              "Assignment"
              "Direct"
              "Flex Lease"
              "SubLease"
              "Unknown"

            **Rules**

              - "Assignment" → Applies when an existing tenant transfers its lease rights and obligations to another party. Look for terms such as "Assignment of Lease", "Assignee", "Assignor", or lease transfer language.

              - "Direct" → Applies when the lease is executed directly between the Landlord and Tenant without any sublease or assignment arrangement.

              - "Flex Lease" → Applies when the premises, lease structure, occupancy arrangement, or usage is described as flexible, shared, coworking, executive suite, managed office, or flexible workspace.

              - "SubLease" → Applies when a tenant (Sublessor) leases all or part of the premises to another party (Subtenant). Look for terms such as "Sublease Agreement", "Subtenant", "Sublessor", or "Subleased Premises".

              - "Unknown" → Applies when none of the above categories can be clearly determined from the lease document.

            **Exclusions**

              - Do not classify an Assignment as a SubLease.
              - Do not classify a standard Landlord-Tenant lease as a SubLease.
              - Do not infer a Flex Lease unless the document contains clear indicators of a flexible occupancy structure.
              - If the lease arrangement type cannot be confidently identified, respond with "Unknown".
              - Do not include quotes, explanations, or additional text.

            ####

            Examples:

            1. Given:
              "Assignment and Assumption of Lease Agreement between Assignor and Assignee"

              Response:
              Assignment

            2. Given:
              "Lease Agreement entered into by and between Landlord and Tenant"

              Response:
              Direct

            3. Given:
              "Sublease Agreement between Tenant and Subtenant for a portion of the Premises"

              Response:
              SubLease

            4. Given:
              "Flexible office membership agreement for shared workspace occupancy"

              Response:
              Flex Lease

            5. Given:
              "Insufficient information to determine the lease arrangement"

              Response:
              Unknown

            ####

        - role: user
          content: "{prompt}"

      
