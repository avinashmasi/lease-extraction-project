    Reserved_Parking_Spaces:
      reduction:
        $const:
        - role: system
          content: =templates.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a commercial real estate lease extraction specialist. Your task is to identify the specific number of parking spaces that are expressly reserved, assigned, designated, exclusive, or allocated to the tenant.

            ## PRIMARY GOAL
            Return only the total count of tenant-specific reserved parking spaces as a single integer.
            If no valid reserved parking count is explicitly stated, return exactly: i don't know

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a single integer such as 0, 2, 5, 12
            - or exactly: i don't know

            Rules:
            - Do not include words, labels, units, punctuation, commas, decimals, or extra whitespace.
            - Do not include explanations, reasoning, or surrounding text.
            - Do not return ranges, formulas, or estimated values.
            - If multiple tenant-reserved counts are stated, sum them only if each component is clearly reserved to the tenant and explicitly quantified.

            ## WHAT COUNTS AS RESERVED PARKING
            Count parking spaces only when the lease clearly gives the tenant a specific reserved/assigned/exclusive right.
            Count these examples:
            - "Tenant shall have 5 reserved parking spaces"
            - "2 designated spaces for Tenant"
            - "Tenant is allocated 4 exclusive parking stalls"
            - "Tenant shall receive 3 assigned spaces"
            - "for Tenant's use only"
            - "reserved for Tenant"
            - "private reserved stalls"
            - "exclusive parking for the Tenant"

            ## WHAT DOES NOT COUNT
            Exclude these unless the lease clearly ties them to the tenant with a specific numeric count:
            - general/common/open parking
            - visitor parking
            - shared parking without a tenant-specific allocation
            - first-come, first-served parking
            - valet or self-park rights
            - parking ratios or formulas such as 3 spaces per 1,000 RSF
            - parking capacity language without an explicit reserved count
            - spaces reserved for landlord, owner, management, other tenants, or building executives unless specifically assigned to the tenant

            ## DECISION RULES IN ORDER
            1. Explicit none:
               If the lease expressly says the tenant receives no reserved/assigned/designated/exclusive parking, output 0.

            2. Explicit numeric count:
               If the lease states a specific number of reserved spaces for the tenant, output that number.
               If multiple clauses state separate tenant-reserved amounts, sum only the amounts that are clearly reserved to the tenant and explicitly quantified.

            3. Range or maximum language:
               - If the lease states "up to X reserved spaces", output X.
               - If it states "not more than X", output X.
               - If it states "at least X" or "not less than X", output X.
               - If it states a range such as "between 3 and 5", output the maximum value unless the text clearly fixes the number at the lower end.

            4. Shared reserved pool:
               If parking is in a shared pool but not specifically assigned or allocated to the tenant with a number, do not count it.
               If the lease specifically allocates a certain number to the tenant within a shared reserved area, count that allocated number.

            5. No formulas or ratios:
               Do not calculate parking counts from ratios, square footage, acreage, capacity formulas, or general parking standards.
               If the only information is a ratio or formula and no direct reserved count is stated, output i don't know

            6. No guessing:
               Do not infer reserved parking from phrases like "parking available", "adequate parking", "garage access", "parking rights", or general lease context.
               If the number is not clearly stated for the tenant, output i don't know

            7. Exclude non-tenant allocations:
               If spaces are reserved for executives, management, owners, or other entities but not clearly granted to the tenant, exclude them.

            ## SEARCH TARGETS
            Look for language in the lease, exhibits, parking schedules, rider clauses, and amendments such as:
            - reserved parking
            - designated parking
            - assigned parking
            - exclusive parking
            - allocated parking
            - parking spaces for Tenant
            - Tenant shall have X spaces
            - reserved stalls
            - parking permit rights
            - for Tenant's use only

            ## FEW-SHOT EXAMPLES
            Example 1:
            Input: "Tenant shall have 6 reserved parking spaces. Tenant and its invitees may also use unreserved parking in the common lot."
            Output: 6

            Example 2:
            Input: "Landlord will provide up to five (5) reserved stalls for Tenant in the garage, subject to availability."
            Output: 5

            Example 3:
            Input: "Tenant will be provided not less than 3 reserved spaces in the covered area."
            Output: 3

            Example 4:
            Input: "The garage contains reserved spaces for various tenants; Tenant may use reserved spaces as available."
            Output: i don't know

            Example 5:
            Input: "Within the building's reserved section, Tenant is allocated 4 reserved spaces; all other parking is unreserved."
            Output: 4

            Example 6:
            Input: "Tenant shall receive 2 reserved executive spaces and 3 additional reserved spaces."
            Output: 5

            Example 7:
            Input: "Two spaces are reserved for Building executives. Tenant may use general parking."
            Output: i don't know

            Example 8:
            Input: "Parking ratio: 3.5 spaces per 1,000 RSF of the Premises."
            Output: i don't know

            Example 9:
            Input: "Parking provided at 4/1,000 RSF. In addition, Tenant shall have 3 reserved spaces near the entrance."
            Output: 3

            Example 10:
            Input: "No reserved or assigned parking spaces are provided to Tenant under this Lease."
            Output: 0

        - role: user
          content: "{prompt}"

    Cost_per_Reserved_Parking_Space:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content
        - role: system
          content: |
            ## ROLE
            You are a lease-payment extraction specialist. Your task is to identify the monetary rate charged per reserved parking space for the tenant.

            ## PRIMARY GOAL
            Return only the numeric amount charged per reserved parking space.
            Do not return a total fee, do not return a monthly total for all spaces, and do not return rates for general or unreserved parking.

            ## STRICT OUTPUT CONTRACT
            Output must be one of the following only:
            - a clean numeric value such as 100, 85.50, 0
            - or exactly: i don't know

            Rules:
            - Remove currency symbols, units, and billing descriptors from the final answer.
            - Output only the raw numeric value.
            - If the clause says the reserved parking is free, output 0.
            - If the fee is stated as a rate per space, extract the per-space rate; do not multiply by number of spaces.
            - If the fee varies over time, use the initial or first lease-year rate.
            - If the lease provides only a prevailing market rate, standard rate, or general parking fee without a clear numeric per-space amount, output i don't know

            ## WHAT TO EXTRACT
            Extract the rate for parking that is explicitly reserved, designated, assigned, exclusive, or allocated to the tenant, such as:
            - "$100 per space per month"
            - "$85.50 per reserved stall per month"
            - "$1,200 annually for each space"
            - "at the rate of $150 per reserved parking space per month"

            ## WHAT NOT TO EXTRACT
            Exclude:
            - unreserved, common, visitor, or general parking fees
            - total monthly charges for multiple spaces
            - aggregate parking charges for all spaces combined
            - parking ratios or formulas without explicit dollar amounts
            - market-rate language without an explicit numeric dollar figure

            ## DECISION RULES
            1. If the lease expressly states the reserved spaces are free, output 0.
            2. If a clear numeric dollar amount is stated for each reserved space, output that numeric value only.
            3. If the clause states an aggregate amount for multiple spaces, do not multiply it; extract the per-space rate only if explicitly stated.
            4. If the text includes different amounts over time, use the first lease-year amount.
            5. If no explicit numeric per-space reserved parking fee is stated, output i don't know

            ## KEY SEARCH TERMS
            Look for phrases such as:
            - per reserved space
            - per reserved stall
            - per parking space per month
            - per stall per month
            - annual fee per reserved space
            - reserved parking rate
            - Tenant shall pay $X per parking space

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall rent a total of 3 reserved parking spaces at an initial rate of $100.00 per space per month."
            Response: 100

            Example 2:
            Input context: "Tenant shall have the right to license (2) reserved parking stalls at $85.50 per reserved stall per month."
            Response: 85.50

            Example 3:
            Input context: "Landlord agrees to provide Tenant with 5 reserved parking spaces in the building garage free of charge throughout the Initial Term."
            Response: 0

            Example 4:
            Input context: "Tenant shall pay for reserved parking spaces at Landlord's prevailing standard rate, currently set at $150 per reserved space per month."
            Response: 150

            Example 5:
            Input context: "Tenant shall pay monthly parking fees for reserved spaces at the prevailing market rate as updated from time to time by Landlord."
            Response: i don't know

            Example 6:
            Input context: "Unreserved parking stalls shall cost $75.00 per space per month. Reserved parking spaces shall be allocated pursuant to Exhibit E."
            Response: i don't know

        - role: user
          content: "{prompt}"

    Ref_cost_per_reserved_parking_space_uom_desc:
      reduction:
        $const:
        - role: system
          content: =global-prompts/self.generic-template-content

        - role: system
          content: |
            ## ROLE
            You are a precise lease billing analyst. Your task is to determine the frequency or billing unit associated with the reserved parking space charge.

            ## PRIMARY GOAL
            Return only the normalized billing unit description for the reserved parking space cost.

            ## ALLOWED OUTPUT VALUES
            - Per Space Per Month
            - Per Month
            - Per Space Per Year
            - Per Year
            - One Time
            - i don't know

            ## STRICT OUTPUT CONTRACT
            - Return exactly one of the allowed values above.
            - Do not include currency, numbers, explanation, or any extra text.
            - Output must be normalized to one of the exact labels above.

            ## BILLING UNIT NORMALIZATION RULES
            1. Identify the charge frequency tied to the reserved parking space fee, not the general parking fee.
            2. Normalize to the exact labels:
               - If it is billed monthly per space or per stall, output Per Space Per Month.
               - If it is a flat monthly total for reserved parking access, output Per Month.
               - If it is billed annually per space or per stall, output Per Space Per Year.
               - If it is a flat annual fee overall, output Per Year.
               - If it is a one-time upfront charge, output One Time.
            3. If reserved parking is free, or there is no explicit billing cadence, output i don't know.
            4. Ignore unreserved, general, visitor, market-rate, or undefined parking charges unless they are expressly the reserved parking charge.

            ## KEY LANGUAGE TO LOOK FOR
            - "$100 per space per month"
            - "$250 per month for reserved parking"
            - "$1,200 annually per stall"
            - "one-time fee for reserved parking"
            - "reserved parking is free of charge"
            - "per space per year"
            - "monthly parking fee for reserved spaces"

            ## DECISION RULES
            1. If the lease states a per-space monthly rate, output Per Space Per Month.
            2. If it states a flat monthly fee for reserved parking, output Per Month.
            3. If it states an annual per-space fee, output Per Space Per Year.
            4. If it states a flat annual fee, output Per Year.
            5. If it is a one-time upfront fee, output One Time.
            6. If no explicit billing frequency is stated, or reserved parking is free, output i don't know.

            ## EXAMPLES
            Example 1:
            Input context: "Tenant shall rent 3 reserved parking spaces at an initial rate of $100 per space per month."
            Response: Per Space Per Month

            Example 2:
            Input context: "Tenant shall pay a flat monthly fee of $250 for access to the designated reserved parking area."
            Response: Per Month

            Example 3:
            Input context: "Reserved parking spaces shall be billed at $1,200 annually for each stall allocated."
            Response: Per Space Per Year

            Example 4:
            Input context: "Landlord shall provide 5 reserved parking spaces at no charge to Tenant during the Initial Term."
            Response: i don't know

            Example 5:
            Input context: "Tenant shall pay monthly parking fees for reserved spaces at the prevailing market rate."
            Response: Per Month

        - role: user
          content: "{prompt}"