    #       parking_cost_yearly_uom:
    #         - =global-fields/self.parking_cost_yearly_uom

  #############################################################################################################

    measurements:
      reduction:
        $join:
          debug:
            - =en-nl-completions-measurements/self.Measurements-Table

          property_element_type_desc:
            - =global-fields/self.Property_Element_Type_Desc

          property_measurement_size:
            - =global-fields/self.Property_Measurement_Size

          property_measurement_size_uom:
            - =global-fields/self.Property_Measurement_Size_UOM

          asking_rent_yearly:
            - =global-fields/self.Measurement_Asking_Rent_Yearly

          asking_rent_yearly_uom:
            - =global-fields/self.Measurement_Asking_Rent_Yearly_UOM

          property_measurement_notes:
            - =global-fields/self.Property_Measurement_Notes


  #############################################################################################################

    lease_break:
      reduction:
        $join:
          arrangement_option_executor_type_desc:
            - =global-fields/self.Arrangement_Option_Executor_Type_Desc

          arrangement_option_start_date:
            - =global-fields/self.Arrangement_Option_Start_Date
